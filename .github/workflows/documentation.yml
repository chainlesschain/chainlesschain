name: Documentation Generation

# Manual trigger ONLY. Auto-trigger on push / pull_request was disabled on
# 2026-09: the auto-generated docs PR (#348 etc.) had zero checks and stayed
# permanently BLOCKED under branch protection (no DOCS_APP_ID / DOCS_PR_TOKEN
# secrets → cpr fell back to GITHUB_TOKEN, which GitHub intentionally does not
# run checks for), and every push to main refreshed the same PR. Docs are now
# generated locally:
#
#     cd desktop-app-vue && npm run docs:generate   # then commit + push normally
#
# workflow_dispatch remains as an on-demand preview/validation run (results are
# uploaded as an artifact, NOT proposed as a PR).
on:
  workflow_dispatch:
    inputs:
      doc_type:
        description: "Documentation type to generate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api
          - user-guide
          - changelog
          - architecture

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for changelog

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies (workspace-aware)
        # The generator only imports pure-JS tooling such as glob. Skipping
        # lifecycle scripts avoids compiling unrelated Electron native addons
        # (for example node-pty), while the root workspace lock still installs
        # desktop-app-vue dependencies deterministically.
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate documentation
        working-directory: ./desktop-app-vue
        run: |
          echo "📖 Generating documentation (manual dispatch)..."
          node scripts/cowork-doc-generator.js --type ${{ github.event.inputs.doc_type || 'all' }}

      - name: Check for documentation changes
        id: check-changes
        working-directory: ./desktop-app-vue
        run: |
          if git diff --quiet docs/ CHANGELOG.md 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Documentation changes detected"
            git diff --stat docs/ CHANGELOG.md
          fi

      # NOTE: No create-pull-request step anymore. The old flow opened
      # chore/auto-docs PRs with a GITHUB_TOKEN fallback, which produced PRs
      # with zero checks → blocked forever by branch protection. Generated docs
      # are committed and pushed locally (see header comment).
      - name: Upload documentation artifacts
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: generated-docs
          path: |
            desktop-app-vue/docs/api/generated/
            desktop-app-vue/docs/user-guide/
            desktop-app-vue/docs/architecture/
            desktop-app-vue/CHANGELOG.md
          retention-days: 30

      - name: Documentation generation summary
        if: always()
        working-directory: ./desktop-app-vue
        run: |
          echo "## 📚 Documentation Generation (manual)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Regenerated docs can be downloaded from the **generated-docs** artifact." >> $GITHUB_STEP_SUMMARY
          echo "To commit them locally instead, run:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cd desktop-app-vue && npm run docs:generate" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  validate-docs:
    name: Validate Documentation Quality
    runs-on: ubuntu-latest
    needs: generate-docs
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download generated documentation
        # Artifact only exists when generate-docs found changes. Continue on
        # absence — checkout already provides the committed docs to validate.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: generated-docs
          path: desktop-app-vue/

      - name: Validate documentation structure
        working-directory: ./desktop-app-vue
        run: |
          echo "📋 Validating documentation structure..."

          # Check required directories exist
          required_dirs=("docs/api" "docs/user-guide" "docs/architecture")
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              exit 1
            fi
            echo "✅ Directory exists: $dir"
          done

          # Check required files exist
          if [ ! -f "CHANGELOG.md" ]; then
            echo "❌ Missing CHANGELOG.md"
            exit 1
          fi
          echo "✅ CHANGELOG.md exists"

      - name: Check for broken links (optional)
        working-directory: ./desktop-app-vue
        continue-on-error: true
        run: |
          echo "🔗 Checking for broken internal links..."

          # Simple broken link detection
          find docs -name "*.md" -type f -exec grep -H "\[.*\](.*)" {} \; > /tmp/links.txt || true

          if [ -s /tmp/links.txt ]; then
            echo "Found $(wc -l < /tmp/links.txt) markdown links"
          else
            echo "No markdown links found or all links are valid"
          fi

      - name: Documentation quality summary
        run: |
          echo "## 📊 Documentation Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All documentation structure checks passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Target: 95%" >> $GITHUB_STEP_SUMMARY
          echo "- Current: Needs manual assessment" >> $GITHUB_STEP_SUMMARY
