name: Agent Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "packages/agent-protocol/**"
      - "packages/agent-sdk/src/generated/**"
      - "packages/agent-sdk/__fixtures__/protocol/**"
      - "packages/agent-sdk/__tests__/protocol-fixtures.test.ts"
      - "packages/agent-sdk-python/src/chainlesschain_agent_sdk/generated_app_protocol.py"
      - "packages/cli/src/generated/cc-agent-protocol.schema.json"
      - ".github/workflows/agent-protocol-ci.yml"
      - ".github/workflows/workspace-npm-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/agent-protocol/**"
      - "packages/agent-sdk/src/generated/**"
      - "packages/agent-sdk/__fixtures__/protocol/**"
      - "packages/agent-sdk/__tests__/protocol-fixtures.test.ts"
      - "packages/agent-sdk-python/src/chainlesschain_agent_sdk/generated_app_protocol.py"
      - "packages/cli/src/generated/cc-agent-protocol.schema.json"
      - ".github/workflows/agent-protocol-ci.yml"
      - ".github/workflows/workspace-npm-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"

      - name: Verify generated bindings and compatibility baseline
        run: npm run check --workspace=packages/agent-protocol

      - name: Run protocol package tests
        run: npm test --workspace=packages/agent-protocol

      - name: Install TypeScript Agent SDK test dependencies
        working-directory: packages/agent-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Build and test the generated TypeScript Agent SDK contract
        working-directory: packages/agent-sdk
        run: |
          npm run build
          npx vitest run __tests__/protocol.test.ts __tests__/protocol-fixtures.test.ts

      - name: Compile and replay Swift ApprovalDecision conformance
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swiftc \
            packages/agent-protocol/generated/swift/CcAgentProtocol.swift \
            packages/agent-protocol/test/swift-approval-conformance/main.swift \
            -o "$RUNNER_TEMP/swift-approval-conformance"
          "$RUNNER_TEMP/swift-approval-conformance" \
            packages/agent-protocol/test/fixtures/approval-decisions.json

      - name: Verify public package tarball
        working-directory: packages/agent-protocol
        run: npm pack --dry-run --json
