name: VERIFY01 Assisted 04 and 13 (no model)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assisted:
    name: Original Docker checker, verify-04 then verify-13
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Pin original checker image
        run: |
          docker pull node:22.12.0-bookworm
          test "$(docker image inspect node:22.12.0-bookworm --format '{{.Id}}')" = 'sha256:344dbe71e1c47a59db0e94bebdcc94ef3a7bc8bd828393c820168993539048da'
      - name: Run both original contracts sequentially
        run: >-
          node docs/research/cli/evidence/assisted-next132-0413-ci/run-assisted.mjs
          "$RUNNER_TEMP/assisted-next132-0413"
      - name: Preserve actual original checker receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assisted-next132-0413-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assisted-next132-0413/summary.json
            ${{ runner.temp }}/assisted-next132-0413/commands/
            ${{ runner.temp }}/assisted-next132-0413/verify-04/pack/acceptance-evidence/
            ${{ runner.temp }}/assisted-next132-0413/verify-13/pack/acceptance-evidence/
            docs/research/cli/evidence/assisted-next132-0413-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
