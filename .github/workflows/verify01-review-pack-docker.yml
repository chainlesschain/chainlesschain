name: VERIFY01 Assisted Pagination Repair (no model)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assisted:
    name: Original checker, original failure, assisted repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Pin the same independent checker image
        run: |
          docker pull node:22.12.0-bookworm
          test "$(docker image inspect node:22.12.0-bookworm --format '{{.Id}}')" = 'sha256:344dbe71e1c47a59db0e94bebdcc94ef3a7bc8bd828393c820168993539048da'
      - name: Reproduce the original failure and check the assisted repair
        run: >-
          node docs/research/cli/evidence/native131-preexecution-2026-10-29/raw/assisted-verify10-ci/run-assisted.mjs
          "$RUNNER_TEMP/assisted-verify10"
      - name: Preserve actual checker receipts and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: assisted-verify10-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assisted-verify10/summary.json
            ${{ runner.temp }}/assisted-verify10/commands/
            ${{ runner.temp }}/assisted-verify10/pack/acceptance-evidence/
            docs/research/cli/evidence/native131-preexecution-2026-10-29/raw/assisted-verify10-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
