name: Full Test Automation with Diagnostics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # 每天凌晨2点运行
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"

# Cancel older runs of this workflow on the same branch/PR when a newer push
# arrives. Without this, multi-push diagnostic sessions stack runs and starve
# the runner queue (e.g. four parallel runs blocked CLI CI for 11+ min on
# 2026-05-04).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 健康检查 (advisory only — failures here do not block run-all-tests; see
  # issue #7 where a transient ECONNRESET in this job filed a false-positive
  # bug ticket).
  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop-app-vue/package-lock.json

      - name: Run health checks
        working-directory: ./desktop-app-vue
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps && break || {
              echo "npm install attempt $i failed, retrying in $((i*15))s..."
              sleep $((i*15))
            }
          done
          node -e "const { getHealthCheckService } = require('./src/main/health-check'); const service = getHealthCheckService(); service.runChecks().then(r => console.log(JSON.stringify(r, null, 2)));" || true

  # 综合测试运行器
  run-all-tests:
    name: Run All Tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop-app-vue/package-lock.json

      - name: Install dependencies
        working-directory: ./desktop-app-vue
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ci-npm-retry.sh" \
            npm install --legacy-peer-deps

      # Packaging and embedded web-shell tests intentionally require the CLI's
      # standalone production dependency topology; a workspace-hoisted install
      # is not equivalent to the files shipped under Resources/packages/cli.
      - name: Install packages/cli production dependencies standalone
        working-directory: ./packages/cli
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-cli-production-deps.sh"

      - name: Verify CI gate integrity contracts
        run: node --test scripts/__tests__/ci-gate-integrity.test.mjs

      - name: Run comprehensive test suite
        id: primary-tests
        working-directory: ./desktop-app-vue
        run: node scripts/test-runner.js
        continue-on-error: true

      - name: Collect failure diagnostics (non-mutating)
        id: failure-diagnostics
        if: steps.primary-tests.outcome == 'failure'
        working-directory: ./desktop-app-vue
        run: node scripts/auto-fix-runner.js
        continue-on-error: true

      # A retry may help reproduce or classify a transient failure, but it
      # never turns a failed primary gate green. Its reports use a distinct
      # suffix so the primary failure evidence remains immutable.
      - name: Re-run tests for failure diagnosis
        id: retry-tests
        if: steps.primary-tests.outcome == 'failure'
        working-directory: ./desktop-app-vue
        env:
          TEST_REPORT_SUFFIX: retry
        run: node scripts/test-runner.js
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: |
            desktop-app-vue/test-results/
            desktop-app-vue/coverage/

      - name: Enforce comprehensive test result
        if: always()
        env:
          PRIMARY_TEST_OUTCOME: ${{ steps.primary-tests.outcome }}
          RETRY_TEST_OUTCOME: ${{ steps.retry-tests.outcome }}
        run: |
          node -e "const primary=process.env.PRIMARY_TEST_OUTCOME; const retry=process.env.RETRY_TEST_OUTCOME; console.log('primary='+primary+', diagnostic-retry='+retry); if(primary!=='success'){console.error('The primary comprehensive test run did not pass; a diagnostic retry cannot replace it.'); process.exit(1)}"

  # 创建Issue如果测试失败
  create-issue-on-failure:
    name: Create Issue on Failure
    runs-on: ubuntu-latest
    needs: run-all-tests
    if: failure()

    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `自动测试失败 - ${date}`,
              body: `## 自动测试失败报告\n\n**工作流运行**: [查看详情](${workflowUrl})\n**分支**: ${context.ref}\n**提交**: ${context.sha}\n**触发者**: ${context.actor}\n\n首轮综合测试失败；无变更重跑只用于复现和诊断，不能替代首轮门禁。诊断器不会执行自动修复，请查看工作流日志和诊断报告。\n\n### 下一步行动\n1. 查看测试日志\n2. 查看 \`test-results/auto-fix-report.json\`（仅诊断）\n3. 对比 \`test-report.json\` 与 \`test-report-retry.json\`\n4. 本地运行 \`npm run test:all\`\n5. 修复问题后重新提交`,
              labels: ['bug', 'automated-detection', 'test-failure', 'needs-triage']
            });
