name: Publish CLI release to npm

on:
  push:
    tags:
      - "v-npm-*"
  # Manual runs are intentionally dry-run only. A production release must be
  # a push of the immutable v-npm-* tag so npm provenance and source identity
  # cannot diverge after an operator-controlled dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run tests before publishing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"

      - name: Install root dependencies (workspaces)
        run: |
          npm install --legacy-peer-deps
          npm install @rollup/rollup-linux-x64-gnu --no-save --legacy-peer-deps || true

      - name: Run core package tests
        run: |
          set -e
          echo "=== core-env tests ==="
          npm test --workspace=packages/core-env

          echo "=== shared-logger tests ==="
          npm test --workspace=packages/shared-logger

          echo "=== core-config tests ==="
          npm test --workspace=packages/core-config

          echo "=== core-db tests ==="
          npm test --workspace=packages/core-db

          echo "=== core-infra tests ==="
          npm test --workspace=packages/core-infra

          echo "=== session-core tests ==="
          npm test --workspace=packages/session-core

          echo "=== core-mtc tests ==="
          npm test --workspace=packages/core-mtc

      - name: Run Agent SDK tests
        working-directory: packages/agent-sdk
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx vitest run

      - name: Run Context Memory Kernel tests
        working-directory: packages/context-memory-kernel
        run: |
          npm test
          npm run check:inventory

      - name: Run Personal Data Hub tests
        working-directory: packages/personal-data-hub
        run: npm test

      - name: Test and build the bundled Web Panel
        working-directory: packages/web-panel
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          npm test -- --reporter=default --silent=passed-only

      - name: Run CLI tests
        working-directory: packages/cli
        # Large suites can overwhelm Vitest's reporter RPC when every passing
        # assertion is streamed. CI still runs the complete suite. If every
        # recorded assertion passes but the forks worker exits during teardown,
        # retry once without file parallelism; real test failures remain hard.
        run: >-
          node scripts/run-vitest-with-worker-retry.mjs -- run
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/npm-publish.xml
          --silent=passed-only

  exact-sha-gate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"

      - name: Verify immutable npm tag identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          EXPECTED_REF="refs/tags/v-npm-${VERSION//./-}"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Expected release ref $EXPECTED_REF, got $GITHUB_REF" >&2
            exit 1
          fi
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"

      - name: Verify CLI CI and CLI Strict Sandbox for exact SHA
        run: node packages/cli/scripts/verify-release-gates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CC_RELEASE_GATE_OUTPUT: cli-release-gate.json
          CC_RELEASE_GATE_WAIT_MS: "2700000"
          CC_RELEASE_GATE_POLL_MS: "30000"

      - name: Upload exact-SHA gate attestation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-release-gate-${{ github.sha }}
          path: cli-release-gate.json
          if-no-files-found: error
          retention-days: 90

  package-cli:
    needs: [test, exact-sha-gate]
    if: ${{ needs.test.result == 'success' && needs.exact-sha-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      # npm pack does not run prepublishOnly. Build the generated payloads in
      # this exact-SHA job so the immutable archive cannot inherit a tracked
      # index.html whose Vite assets are absent from a clean checkout.
      - name: Build CLI package assets before packing
        working-directory: packages/cli
        run: |
          npm run commands:manifest:check
          npm run commands:help-index:check
          npm run commands:completions:check
          npm run build:web-panel:force
          npm run build:changelog

      - name: Resolve and pack immutable CLI tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          mkdir -p release-artifacts
          PACK_METADATA=$(mktemp)
          trap 'rm -f "$PACK_METADATA"' EXIT
          (cd packages/cli && npm pack --json --pack-destination ../../release-artifacts) > "$PACK_METADATA"
          TARBALL=$(node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(x[0].filename)' "$PACK_METADATA")
          TARBALL_PATH="release-artifacts/$TARBALL"
          CC_RELEASE_VERSION="$VERSION" \
          GITHUB_SHA="${{ github.sha }}" \
          node packages/cli/scripts/npm-release-artifact.mjs create \
            "$TARBALL_PATH" release-artifacts/chainlesschain-release.json

      # The monorepo lock contains desktop/mobile peer graphs that are not part
      # of the CLI tarball and make root-level `npm sbom --package-lock-only`
      # fail with ESBOMPROBLEMS. Resolve an ignore-scripts lock from the exact
      # immutable tarball instead, then validate that the CycloneDX root still
      # names the release package/version before uploading it beside the
      # tarball and release manifest.
      - name: Generate CLI release SBOM from immutable tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(find release-artifacts -maxdepth 1 -name 'chainlesschain-*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          VERSION=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version)' release-artifacts/chainlesschain-release.json)
          SBOM_ROOT=$(mktemp -d)
          trap 'rm -rf "$SBOM_ROOT"' EXIT
          SBOM_CANDIDATES="$SBOM_ROOT/internal-candidates"
          bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-cli-production-deps.sh" \
            --pack-candidates "$SBOM_CANDIDATES"
          INTERNAL_CANDIDATES=()
          for candidate in "$SBOM_CANDIDATES"/*.tgz; do
            if [[ "$(basename "$candidate")" != "chainlesschain-$VERSION.tgz" ]]; then
              INTERNAL_CANDIDATES+=("$candidate")
            fi
          done
          test "${#INTERNAL_CANDIDATES[@]}" -gt 0
          mkdir -p "$SBOM_ROOT/chainlesschain"
          tar -xzf "$TARBALL" -C "$SBOM_ROOT/chainlesschain" --strip-components=1
          (
            cd "$SBOM_ROOT/chainlesschain"
            npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund \
              "${INTERNAL_CANDIDATES[@]}"
            npm sbom --package-lock-only --sbom-format cyclonedx \
              > "$GITHUB_WORKSPACE/release-artifacts/chainlesschain-sbom.cdx.json"
          )
          node -e '
            const fs = require("fs");
            const [path, version] = process.argv.slice(1);
            const sbom = JSON.parse(fs.readFileSync(path, "utf8"));
            const root = sbom?.metadata?.component;
            if (sbom?.bomFormat !== "CycloneDX" || root?.name !== "chainlesschain" || root?.version !== version || root?.purl !== `pkg:npm/chainlesschain@${version}`) {
              throw new Error("CLI release SBOM identity does not match immutable tarball");
            }
            if (!Array.isArray(sbom.components) || sbom.components.length === 0 || !Array.isArray(sbom.dependencies) || sbom.dependencies.length === 0) {
              throw new Error("CLI release SBOM dependency graph is empty");
            }
          ' release-artifacts/chainlesschain-sbom.cdx.json "$VERSION"

      - name: Upload immutable CLI release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chainlesschain-npm-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

  dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.test.result == 'success' }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - run: npm install --legacy-peer-deps
      - name: Validate CLI package without publish credentials
        working-directory: packages/cli
        run: npm publish --dry-run

  # Publish all packages in dependency order.
  # NODE_AUTH_TOKEN is intentionally retained during the OIDC rollout. npm
  # prefers Trusted Publishing and falls back to this token if OIDC is not yet
  # configured for this workflow.
  publish:
    needs: [test, exact-sha-gate, package-cli]
    if: ${{ github.event_name == 'push' && needs.test.result == 'success' && needs.exact-sha-gate.result == 'success' && needs.package-cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # npm Trusted Publishing requires Node.js 22.14.0 or newer.
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Enable npm Trusted Publishing support
        run: |
          npm install --global npm@11.18.0
          npm --version

      - name: Install root dependencies (workspaces)
        run: |
          npm install --legacy-peer-deps
          npm install @rollup/rollup-linux-x64-gnu --no-save --legacy-peer-deps || true

      - name: Download exact verified CLI tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chainlesschain-npm-${{ github.sha }}
          path: release-artifacts

      - name: Verify immutable CLI tarball before publishing
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(find release-artifacts -maxdepth 1 -name 'chainlesschain-*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          node packages/cli/scripts/npm-release-artifact.mjs verify \
            "$TARBALL" release-artifacts/chainlesschain-release.json

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Set publish command
        id: publish-cmd
        run: |
          echo "FLAGS=--provenance --access public" >> $GITHUB_OUTPUT
          echo "Mode: LIVE PUBLISH"

      # Publish order respects dependency chain:
      # 1. core-env (no deps)
      # 2. shared-logger (-> core-env) + core-config (-> core-env)
      # 3. core-db (-> core-env, core-config)
      # 4. core-infra (-> shared-logger)
      # 5. cli (-> all above)

      - name: "Publish @chainlesschain/core-env"
        working-directory: packages/core-env
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-env@$PKG_VER"
          if npm view "@chainlesschain/core-env@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # core-mtc has no internal deps — safe anywhere before cli
      - name: "Publish @chainlesschain/core-mtc"
        working-directory: packages/core-mtc
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-mtc@$PKG_VER"
          if npm view "@chainlesschain/core-mtc@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # core-multisig -> core-mtc (published just above), @noble/*, canonicalize.
      # Idempotent: skips when npm version already matches package.json.
      - name: "Publish @chainlesschain/core-multisig"
        working-directory: packages/core-multisig
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-multisig@$PKG_VER"
          if npm view "@chainlesschain/core-multisig@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # core-settlement -> core-mtc (published above), canonicalize. (devDep
      # core-multisig is dev-only, not needed by consumers.) Idempotent.
      - name: "Publish @chainlesschain/core-settlement"
        working-directory: packages/core-settlement
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-settlement@$PKG_VER"
          if npm view "@chainlesschain/core-settlement@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish @chainlesschain/shared-logger"
        working-directory: packages/shared-logger
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/shared-logger@$PKG_VER"
          if npm view "@chainlesschain/shared-logger@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish @chainlesschain/core-config"
        working-directory: packages/core-config
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-config@$PKG_VER"
          if npm view "@chainlesschain/core-config@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish @chainlesschain/core-db"
        working-directory: packages/core-db
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-db@$PKG_VER"
          if npm view "@chainlesschain/core-db@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish @chainlesschain/core-infra"
        working-directory: packages/core-infra
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/core-infra@$PKG_VER"
          if npm view "@chainlesschain/core-infra@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish @chainlesschain/session-core"
        working-directory: packages/session-core
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/session-core@$PKG_VER"
          if npm view "@chainlesschain/session-core@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The CLI imports this package at runtime and pins its exact version.
      # Publish and read it back before the immutable CLI tarball so a fresh
      # public install can resolve every production dependency from npm.
      - name: "Publish @chainlesschain/context-memory-kernel"
        id: context-memory-kernel-publish
        working-directory: packages/context-memory-kernel
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/context-memory-kernel@$PKG_VER"
          if npm view "@chainlesschain/context-memory-kernel@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published Context Memory Kernel registry bytes and npm provenance
        if: steps.context-memory-kernel-publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="@chainlesschain/context-memory-kernel"
          PACKAGE_VERSION=$(node -p "require('./packages/context-memory-kernel/package.json').version")
          CLI_VERSION="${{ steps.version.outputs.VERSION }}"
          EXPECTED_REF="refs/tags/v-npm-${CLI_VERSION//./-}"
          READBACK_ROOT=$(mktemp -d)
          trap 'rm -rf "$READBACK_ROOT"' EXIT

          REGISTRY_TARBALL=""
          for ATTEMPT in {1..30}; do
            if npm pack "$PACKAGE_NAME@$PACKAGE_VERSION" --pack-destination "$READBACK_ROOT" \
              >/dev/null 2>"$READBACK_ROOT/npm-pack.err"; then
              REGISTRY_TARBALL=$(find "$READBACK_ROOT" -maxdepth 1 -name 'chainlesschain-context-memory-kernel-*.tgz' -type f -print -quit)
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "Registry did not expose $PACKAGE_NAME@$PACKAGE_VERSION after 30 attempts" >&2
              cat "$READBACK_ROOT/npm-pack.err" >&2
              exit 1
            fi
            echo "::notice::Registry has not exposed $PACKAGE_NAME@$PACKAGE_VERSION yet (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test -n "$REGISTRY_TARBALL"
          PACKAGE_SHA512=$(node -e 'const c=require("node:crypto"),f=require("node:fs");process.stdout.write(c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("hex"))' "$REGISTRY_TARBALL")

          AUDIT_ROOT="$READBACK_ROOT/audit"
          mkdir -p "$AUDIT_ROOT"
          (
            cd "$AUDIT_ROOT"
            npm init --yes >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_NAME@$PACKAGE_VERSION"
          )
          VERIFIED=false
          for ATTEMPT in {1..30}; do
            AUDIT_JSON="$AUDIT_ROOT/npm-signatures.json"
            AUDIT_ERROR="$AUDIT_ROOT/npm-signatures.err"
            if (
              cd "$AUDIT_ROOT"
              npm audit signatures --include-attestations --json \
                > "$AUDIT_JSON" 2> "$AUDIT_ERROR"
            ) && CC_NPM_PROVENANCE_OUTPUT=release-artifacts/context-memory-kernel-npm-provenance.json \
              node packages/cli/scripts/verify-npm-release-provenance.mjs \
                "$AUDIT_JSON" "$PACKAGE_VERSION" "$GITHUB_SHA" "$EXPECTED_REF" "$PACKAGE_SHA512" "$PACKAGE_NAME"; then
              VERIFIED=true
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "npm did not expose valid signed provenance for $PACKAGE_NAME@$PACKAGE_VERSION after 30 attempts" >&2
              cat "$AUDIT_ERROR" >&2 || true
              exit 1
            fi
            echo "::notice::Signed npm provenance is not ready for $PACKAGE_NAME@$PACKAGE_VERSION (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test "$VERIFIED" = true

      # Agent SDK — workspace member whose prepublishOnly runs the TypeScript
      # dual build. Its build resolves a local or workspace-hoisted compiler.
      # No consumer pins it yet (VS Code vendors the build; web-panel aliases
      # the TS source), so order relative to the CLI is free. Added 2026-07-09
      # (platform phase 3 first publish).
      - name: "Publish @chainlesschain/agent-sdk"
        id: agent-sdk-publish
        working-directory: packages/agent-sdk
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/agent-sdk@$PKG_VER"
          if npm view "@chainlesschain/agent-sdk@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm install --no-audit --no-fund
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published Agent SDK registry bytes and npm provenance
        if: steps.agent-sdk-publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_NAME="@chainlesschain/agent-sdk"
          SDK_VERSION=$(node -p "require('./packages/agent-sdk/package.json').version")
          CLI_VERSION="${{ steps.version.outputs.VERSION }}"
          EXPECTED_REF="refs/tags/v-npm-${CLI_VERSION//./-}"
          READBACK_ROOT=$(mktemp -d)
          trap 'rm -rf "$READBACK_ROOT"' EXIT

          REGISTRY_TARBALL=""
          for ATTEMPT in {1..30}; do
            if npm pack "$SDK_NAME@$SDK_VERSION" --pack-destination "$READBACK_ROOT" \
              >/dev/null 2>"$READBACK_ROOT/npm-pack.err"; then
              REGISTRY_TARBALL=$(find "$READBACK_ROOT" -maxdepth 1 -name 'chainlesschain-agent-sdk-*.tgz' -type f -print -quit)
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "Registry did not expose $SDK_NAME@$SDK_VERSION after 30 attempts" >&2
              cat "$READBACK_ROOT/npm-pack.err" >&2
              exit 1
            fi
            echo "::notice::Registry has not exposed $SDK_NAME@$SDK_VERSION yet (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test -n "$REGISTRY_TARBALL"
          SDK_SHA512=$(node -e 'const c=require("node:crypto"),f=require("node:fs");process.stdout.write(c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("hex"))' "$REGISTRY_TARBALL")

          AUDIT_ROOT="$READBACK_ROOT/audit"
          mkdir -p "$AUDIT_ROOT"
          (
            cd "$AUDIT_ROOT"
            npm init --yes >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "$SDK_NAME@$SDK_VERSION"
          )
          VERIFIED=false
          for ATTEMPT in {1..30}; do
            AUDIT_JSON="$AUDIT_ROOT/npm-signatures.json"
            AUDIT_ERROR="$AUDIT_ROOT/npm-signatures.err"
            if (
              cd "$AUDIT_ROOT"
              npm audit signatures --include-attestations --json \
                > "$AUDIT_JSON" 2> "$AUDIT_ERROR"
            ) && CC_NPM_PROVENANCE_OUTPUT=release-artifacts/agent-sdk-npm-provenance.json \
              node packages/cli/scripts/verify-npm-release-provenance.mjs \
                "$AUDIT_JSON" "$SDK_VERSION" "$GITHUB_SHA" "$EXPECTED_REF" "$SDK_SHA512" "$SDK_NAME"; then
              VERIFIED=true
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "npm did not expose valid signed provenance for $SDK_NAME@$SDK_VERSION after 30 attempts" >&2
              cat "$AUDIT_ERROR" >&2 || true
              exit 1
            fi
            echo "::notice::Signed npm provenance is not ready for $SDK_NAME@$SDK_VERSION (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test "$VERIFIED" = true

      # Personal Data Hub — must publish before CLI: CLI's package.json pins
      # a fixed version of this package, so a same-day CLI bump expects the
      # new PDH version to already be on the registry. Added 2026-05-21
      # alongside Plan A v0.1 system-data-android adapter.
      - name: "Publish @chainlesschain/personal-data-hub"
        working-directory: packages/personal-data-hub
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "target: @chainlesschain/personal-data-hub@$PKG_VER"
          if npm view "@chainlesschain/personal-data-hub@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published, skipping"
          else
            npm publish ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish chainlesschain (CLI)"
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(find "$GITHUB_WORKSPACE/release-artifacts" -maxdepth 1 -name 'chainlesschain-*.tgz' -type f -print -quit)
          MANIFEST=release-artifacts/chainlesschain-release.json
          node packages/cli/scripts/npm-release-artifact.mjs verify "$TARBALL" "$MANIFEST"
          PKG_VER=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version)' "$MANIFEST")
          echo "target: chainlesschain@$PKG_VER"
          if npm view "chainlesschain@$PKG_VER" version >/dev/null 2>&1; then
            echo "Exact version already published; verifying registry bytes"
          else
            npm publish "$TARBALL" ${{ steps.publish-cmd.outputs.FLAGS }}
          fi
          mkdir -p registry-verify
          REGISTRY_TARBALL=""
          for ATTEMPT in {1..30}; do
            if npm pack "chainlesschain@$PKG_VER" --pack-destination registry-verify \
              >/dev/null 2>registry-verify/npm-pack.err; then
              REGISTRY_TARBALL=$(find registry-verify -maxdepth 1 -name 'chainlesschain-*.tgz' -type f -print -quit)
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "Registry did not expose chainlesschain@$PKG_VER after 30 attempts" >&2
              cat registry-verify/npm-pack.err >&2
              exit 1
            fi
            echo "::notice::Registry has not exposed chainlesschain@$PKG_VER yet (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test -n "$REGISTRY_TARBALL"
          node packages/cli/scripts/npm-release-artifact.mjs verify "$REGISTRY_TARBALL" "$MANIFEST"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published CLI npm provenance
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=release-artifacts/chainlesschain-release.json
          VERSION=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version)' "$MANIFEST")
          EXPECTED_SHA512=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha512)' "$MANIFEST")
          EXPECTED_REF="refs/tags/v-npm-${VERSION//./-}"
          AUDIT_ROOT=$(mktemp -d)
          trap 'rm -rf "$AUDIT_ROOT"' EXIT
          (
            cd "$AUDIT_ROOT"
            npm init --yes >/dev/null
          )
          VERIFIED=false
          for ATTEMPT in {1..30}; do
            INSTALL_ERROR="$AUDIT_ROOT/npm-install.err"
            AUDIT_JSON="$AUDIT_ROOT/npm-signatures.json"
            AUDIT_ERROR="$AUDIT_ROOT/npm-signatures.err"
            if [ ! -f "$AUDIT_ROOT/node_modules/chainlesschain/package.json" ]; then
              if ! (
                cd "$AUDIT_ROOT"
                npm install --ignore-scripts --no-audit --no-fund "chainlesschain@$VERSION" \
                  2> "$INSTALL_ERROR"
              ); then
                if [ "$ATTEMPT" -eq 30 ]; then
                  echo "npm did not expose installable chainlesschain@$VERSION after 30 attempts" >&2
                  cat "$INSTALL_ERROR" >&2 || true
                  exit 1
                fi
                echo "::notice::Published chainlesschain@$VERSION is not installable yet (attempt $ATTEMPT/30); retrying in 10 seconds"
                sleep 10
                continue
              fi
            fi
            if ! (
              cd "$AUDIT_ROOT"
              node_modules/.bin/cc agent --capabilities \
                > agent-capabilities.json 2> agent-capabilities.err
            ); then
              rm -rf "$AUDIT_ROOT/node_modules" "$AUDIT_ROOT/package-lock.json"
              if [ "$ATTEMPT" -eq 30 ]; then
                echo "Published chainlesschain@$VERSION cannot start the Agent command" >&2
                cat "$AUDIT_ROOT/agent-capabilities.err" >&2 || true
                exit 1
              fi
              echo "::notice::Published Agent command is not executable yet (attempt $ATTEMPT/30); retrying in 10 seconds"
              sleep 10
              continue
            fi
            node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value || typeof value !== "object" || !value.protocol_version) {
                throw new Error("Agent capability output is not a valid capability manifest");
              }
            ' "$AUDIT_ROOT/agent-capabilities.json"
            if (
              cd "$AUDIT_ROOT"
              npm audit signatures --include-attestations --json \
                > "$AUDIT_JSON" 2> "$AUDIT_ERROR"
            ) && CC_NPM_PROVENANCE_OUTPUT=release-artifacts/chainlesschain-npm-provenance.json \
              node packages/cli/scripts/verify-npm-release-provenance.mjs \
                "$AUDIT_JSON" "$VERSION" "$GITHUB_SHA" "$EXPECTED_REF" "$EXPECTED_SHA512"; then
              VERIFIED=true
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              echo "npm did not expose valid signed provenance for chainlesschain@$VERSION after 30 attempts" >&2
              cat "$INSTALL_ERROR" >&2 || true
              cat "$AUDIT_ERROR" >&2 || true
              exit 1
            fi
            echo "::notice::Signed npm provenance is not ready for chainlesschain@$VERSION (attempt $ATTEMPT/30); retrying in 10 seconds"
            sleep 10
          done
          test "$VERIFIED" = true

      - name: Upload public npm readback evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chainlesschain-npm-readback-${{ github.sha }}
          path: |
            release-artifacts/chainlesschain-release.json
            release-artifacts/chainlesschain-npm-provenance.json
            release-artifacts/agent-sdk-npm-provenance.json
            release-artifacts/context-memory-kernel-npm-provenance.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          V_ENV=$(node -p "require('./packages/core-env/package.json').version")
          V_MTC=$(node -p "require('./packages/core-mtc/package.json').version")
          V_MULTISIG=$(node -p "require('./packages/core-multisig/package.json').version")
          V_SETTLEMENT=$(node -p "require('./packages/core-settlement/package.json').version")
          V_LOG=$(node -p "require('./packages/shared-logger/package.json').version")
          V_CFG=$(node -p "require('./packages/core-config/package.json').version")
          V_DB=$(node -p "require('./packages/core-db/package.json').version")
          V_INF=$(node -p "require('./packages/core-infra/package.json').version")
          V_SC=$(node -p "require('./packages/session-core/package.json').version")
          V_CONTEXT=$(node -p "require('./packages/context-memory-kernel/package.json').version")
          V_AGENT=$(node -p "require('./packages/agent-sdk/package.json').version")
          V_PDH=$(node -p "require('./packages/personal-data-hub/package.json').version")
          {
            echo "## Publish Summary"
            echo ""
            echo "**Mode: LIVE (exact-SHA gated, immutable CLI tarball)**"
            echo "**Release SHA:** \`${{ github.sha }}\`"
            echo "**CLI tarball SHA-256:** \`$(node -p "require('./release-artifacts/chainlesschain-release.json').sha256")\`"
            echo ""
            echo "| Package | Version |"
            echo "|---------|---------|"
            echo "| @chainlesschain/core-env | $V_ENV |"
            echo "| @chainlesschain/core-mtc | $V_MTC |"
            echo "| @chainlesschain/core-multisig | $V_MULTISIG |"
            echo "| @chainlesschain/core-settlement | $V_SETTLEMENT |"
            echo "| @chainlesschain/shared-logger | $V_LOG |"
            echo "| @chainlesschain/core-config | $V_CFG |"
            echo "| @chainlesschain/core-db | $V_DB |"
            echo "| @chainlesschain/core-infra | $V_INF |"
            echo "| @chainlesschain/session-core | $V_SC |"
            echo "| @chainlesschain/context-memory-kernel | $V_CONTEXT |"
            echo "| @chainlesschain/agent-sdk | $V_AGENT |"
            echo "| @chainlesschain/personal-data-hub | $V_PDH |"
            echo "| chainlesschain | $VERSION |"
          } >> $GITHUB_STEP_SUMMARY

      # Trigger npmmirror (cnpmcore) to sync each published package so its
      # tarball is cached on cdn.npmmirror.com right away. The mirror lists
      # new versions in metadata but lazily mirrors tarballs, so without an
      # explicit sync mainland-China users (whose npm defaults to
      # registry.npmmirror.com) hit E404 on tarball download — see issue #33
      # (@chainlesschain/core-infra@0.1.0 tarball missing on the mirror).
      #
      # Best-effort by design: npmjs.org is the source of truth, so a slow or
      # unreachable mirror must NOT fail the publish. Per-package outcomes are
      # surfaced to the job summary (no continue-on-error masking — trap #30).
      # cosmetic-green-ok: intentional best-effort, each result written to
      # GITHUB_STEP_SUMMARY below.
      - name: "Sync published packages to npmmirror"
        run: |
          set +e
          PKGS=(
            "@chainlesschain/core-env"
            "@chainlesschain/core-mtc"
            "@chainlesschain/shared-logger"
            "@chainlesschain/core-config"
            "@chainlesschain/core-db"
            "@chainlesschain/core-infra"
            "@chainlesschain/core-multisig"
            "@chainlesschain/core-settlement"
            "@chainlesschain/session-core"
            "@chainlesschain/context-memory-kernel"
            "@chainlesschain/agent-sdk"
            "@chainlesschain/personal-data-hub"
            "chainlesschain"
          )
          {
            echo "## npmmirror sync"
            echo ""
            echo "| Package | Sync request |"
            echo "|---------|--------------|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for pkg in "${PKGS[@]}"; do
            enc="${pkg//@/%40}"; enc="${enc//\//%2F}"
            code=$(curl -s -o /tmp/mirror-sync.json -w "%{http_code}" -X PUT \
              "https://registry.npmmirror.com/-/package/${enc}/syncs" \
              -H "content-type: application/json" --max-time 30)
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "  OK   $pkg (HTTP $code) -> $(cat /tmp/mirror-sync.json)"
              echo "| \`$pkg\` | ✅ queued (HTTP $code) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  WARN $pkg sync request returned HTTP $code (mirror will lazy-sync on first install)"
              echo "| \`$pkg\` | ⚠️ HTTP $code |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "::warning::One or more npmmirror sync requests did not return 2xx (best-effort; npmjs.org is authoritative)."
          fi
          # Best-effort: never fail the publish on mirror issues.
          exit 0
