name: VERIFY01 collect public 139 round 3 result

on:
  push:
    tags: [verify01-139r3-collect-*]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.repository == 'chainlesschain/chainlesschain'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Collect original single-sample artifacts without model credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node packages/cli/scripts/verify01-public139-collect.mjs
          --round-directory docs/research/cli/verify01-openai-139-r3-20261103
      - name: Preserve original receipts and binding index
        uses: actions/upload-artifact@v6
        with:
          name: verify01-public139-r3-collected-results
          path: docs/research/cli/verify01-openai-139-r3-20261103/public-*/
          include-hidden-files: true
          if-no-files-found: error
