name: VERIFY01 public 139 assisted candidate check

on:
  push:
    tags: [verify01-public139-assisted-*]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Pull the original independent acceptance image
        run: docker pull node:22.12.0-bookworm
      - name: Check assisted candidate with unchanged original evaluator bytes
        run: node packages/cli/scripts/verify01-public139-assisted-check.mjs
      - name: Preserve assisted result and original evaluator receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-public139-assisted-verify08-${{ github.sha }}
          path: ${{ runner.temp }}/verify01-public139-assisted-verify08/
          if-no-files-found: error
