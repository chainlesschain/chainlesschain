name: Graph Agent Real Journey

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact event commit SHA; overrides are refused when provider secrets are used
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  JOURNEY_SHA: ${{ github.sha }}

jobs:
  real-journey:
    name: Real model, exec, worktree (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: windows
          - runner: macos-latest
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Refuse a secret-bearing commit override
        if: inputs.commit_sha != '' && inputs.commit_sha != github.sha
        shell: bash
        run: |
          echo "::error::Real-provider secrets may only be used with the workflow event commit"
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.JOURNEY_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Verify exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${JOURNEY_SHA}"

      - name: Run deterministic Graph, recovery, message, and worktree contracts
        shell: bash
        run: >-
          npx vitest run
          --testTimeout 60000
          packages/cli/__tests__/unit/app-server-graph-runtime.test.js
          packages/cli/__tests__/unit/graph-kernel-authority.test.js
          packages/cli/__tests__/unit/graph-kernel-compiler.test.js
          packages/cli/__tests__/unit/graph-kernel-cutover-authority-resolver.test.js
          packages/cli/__tests__/unit/graph-kernel-cutover-ledger.test.js
          packages/cli/__tests__/unit/graph-kernel-runtime.test.js
          packages/cli/__tests__/unit/graph-kernel-fault-injection.test.js
          packages/cli/__tests__/unit/graph-kernel-migration-saga.test.js
          packages/cli/__tests__/unit/graph-kernel-observability.test.js
          packages/cli/__tests__/unit/graph-store-cutover-evidence.test.js
          packages/cli/__tests__/unit/runtime-entry-cutover-wiring.test.js
          packages/cli/__tests__/unit/cowork-graph-authority-adapter.test.js
          packages/cli/__tests__/unit/scheduler-graph-authority-adapter.test.js
          packages/cli/__tests__/unit/team-distributed-graph-bridge.test.js
          packages/cli/__tests__/unit/team-distributed-graph-writer.test.js
          packages/cli/__tests__/unit/team-runner.test.js
          packages/cli/__tests__/integration/headless-session-resume.test.js
          packages/cli/__tests__/integration/team-worktree-real-git.test.js
          desktop-app-vue/src/main/ai-engine/code-agent/__tests__/desktop-runtime-authority.test.js
          desktop-app-vue/src/main/ai-engine/code-agent/__tests__/desktop-graph-execution-adapter.test.js
          desktop-app-vue/src/main/ai-engine/code-agent/__tests__/desktop-graph-ipc-journey.test.js

      - name: Re-run Desktop kill and reopen through the Electron runtime
        shell: bash
        run: |
          ELECTRON_EXECUTABLE="$(node -e 'process.stdout.write(require("electron"))')"
          CC_DESKTOP_GRAPH_KILL_EXECUTABLE="${ELECTRON_EXECUTABLE}" \
            npx vitest run --testTimeout 90000 \
            desktop-app-vue/src/main/ai-engine/code-agent/__tests__/desktop-graph-ipc-journey.test.js

      - name: Run packaged ASAR and BrowserWindow kill-reopen journey
        shell: bash
        run: |
          OUTPUT_PATH="${RUNNER_TEMP}/desktop-packaged-graph-${{ matrix.platform }}.json"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run -a node desktop-app-vue/scripts/graph-packaged-electron-journey.mjs --output "${OUTPUT_PATH}"
          else
            node desktop-app-vue/scripts/graph-packaged-electron-journey.mjs --output "${OUTPUT_PATH}"
          fi

      - name: Kill and recover every CLI durable store cutpoint
        shell: bash
        run: |
          node packages/cli/scripts/graph-cli-store-cutover-journey.mjs \
            --expected-commit "${JOURNEY_SHA}" \
            --output "${RUNNER_TEMP}/cli-store-cutover-${{ matrix.platform }}.json"

      - name: Verify this platform's store receipts
        shell: bash
        run: |
          node packages/cli/scripts/graph-store-cutover-evidence.mjs \
            --evidence "${RUNNER_TEMP}/desktop-packaged-graph-${{ matrix.platform }}.json" \
            --evidence "${RUNNER_TEMP}/cli-store-cutover-${{ matrix.platform }}.json" \
            --expected-commit "${JOURNEY_SHA}" \
            --output "${RUNNER_TEMP}/graph-store-coverage-${{ matrix.platform }}.json"

      - name: Run formal dependency, scope, and aging fairness soak
        env:
          CC_TEAM_FAIRNESS_MODE: formal
          CC_TEAM_FAIRNESS_EXPECTED_SHA: ${{ env.JOURNEY_SHA }}
          CC_TEAM_FAIRNESS_WORKFLOW_SHA: ${{ env.JOURNEY_SHA }}
          CC_TEAM_FAIRNESS_OUTPUT: ${{ runner.temp }}/team-fairness-${{ matrix.platform }}.json
        run: npm run test:cli-team-fairness-soak

      - name: Run real-provider cc exec journey
        shell: bash
        env:
          CC_API_KEY: ${{ secrets.CC_LLM_API_KEY }}
          CC_GRAPH_JOURNEY_PROVIDER: ${{ vars.CC_LLM_PROVIDER || 'openai' }}
          CC_GRAPH_JOURNEY_MODEL: ${{ vars.CC_LLM_MODEL || 'gpt-5-mini' }}
        run: >-
          node packages/cli/scripts/graph-agent-real-journey.mjs
          --commit-sha "${JOURNEY_SHA}"
          --output "${RUNNER_TEMP}/graph-agent-journey-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: graph-agent-real-journey-${{ matrix.platform }}-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-agent-journey-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: team-fairness-${{ matrix.platform }}-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/team-fairness-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-packaged-graph-${{ matrix.platform }}-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-packaged-graph-${{ matrix.platform }}.json
            ${{ runner.temp }}/cli-store-cutover-${{ matrix.platform }}.json
            ${{ runner.temp }}/graph-store-coverage-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

  exact-sha-matrix:
    name: Exact-SHA three-platform journey gate
    if: always()
    needs: real-journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse a partial or failed platform matrix
        if: needs.real-journey.result != 'success'
        shell: bash
        run: |
          echo "::error::Graph/Agent real journey matrix is incomplete"
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.JOURNEY_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          pattern: graph-agent-real-journey-*-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-agent-evidence
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-packaged-graph-*-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-store-evidence
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: team-fairness-*-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/team-fairness-evidence
          merge-multiple: true

      - name: Verify exact SHA and all platform evidence
        run: >-
          node packages/cli/scripts/graph-agent-real-journey.mjs
          --verify-dir "${RUNNER_TEMP}/graph-agent-evidence"
          --commit-sha "${JOURNEY_SHA}"
          --output "${RUNNER_TEMP}/graph-agent-real-journey-matrix.json"

      - name: Require all durable stores on the exact three-platform SHA
        run: >-
          node packages/cli/scripts/graph-store-cutover-evidence.mjs
          --evidence-dir "${RUNNER_TEMP}/graph-store-evidence"
          --expected-commit "${JOURNEY_SHA}"
          --require-complete
          --output "${RUNNER_TEMP}/graph-store-cutover-matrix.json"

      - name: Require 3x queue-wait SLO fairness on the exact platform matrix
        run: >-
          node packages/cli/scripts/team-fairness-soak.mjs
          --verify-evidence-dir "${RUNNER_TEMP}/team-fairness-evidence"
          --release-commit "${JOURNEY_SHA}"
          --mode formal
          --output "${RUNNER_TEMP}/team-fairness-matrix.json"

      - uses: actions/upload-artifact@v6
        with:
          name: graph-agent-real-journey-matrix-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-agent-real-journey-matrix.json
          if-no-files-found: error
          retention-days: 180

      - uses: actions/upload-artifact@v6
        with:
          name: graph-store-cutover-matrix-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-store-cutover-matrix.json
          if-no-files-found: error
          retention-days: 180

      - uses: actions/upload-artifact@v6
        with:
          name: team-fairness-matrix-${{ env.JOURNEY_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/team-fairness-matrix.json
          if-no-files-found: error
          retention-days: 180
