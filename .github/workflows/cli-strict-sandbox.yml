      - "packages/cli/__tests__/unit/agent-core.test.js"
      - "packages/cli/__tests__/unit/ws-runtime-events.test.js"
      - "packages/cli/__tests__/integration/ws-bridge-side-effect-resume.test.js"
      - "packages/cli/__tests__/integration/parity-mcp-invoke.test.js"
      - "packages/cli/__tests__/unit/plugin-monitor-supervisor.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-mcp.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-monitors.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-hooks.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-process-boundary.test.js"
      - "packages/cli/__tests__/unit/plugin-marketplace-selection-command.test.js"
      - "packages/cli/__tests__/unit/plugin-security.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-install.test.js"
      - "packages/cli/__tests__/unit/plugin-marketplace-source-cache.test.js"
      - "packages/cli/__tests__/unit/plugin-remote-source-security.test.js"
      - "packages/cli/__tests__/unit/agenda-command.test.js"
      - "packages/cli/__tests__/unit/background-task-manager.test.js"
      - "packages/cli/__tests__/unit/background-task-command-runner.test.js"
      - "packages/cli/__tests__/unit/agent-core-run-shell-background-sandbox.test.js"
      - "packages/cli/__tests__/unit/background-agent-supervisor.test.js"
      - "packages/cli/__tests__/integration/background-task-worker.test.js"
      - "packages/cli/src/lib/lsp/__tests__/lsp-client.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin-agent-core.test.js"
      - "packages/cli/__tests__/integration/process-broker-platform-sandbox-live.test.js"
      - "packages/cli/__tests__/integration/mcp-materialized-capsule-sandbox-live.test.js"
      - "packages/cli/__tests__/fixtures/mcp-materialized-capsule-live-server.cjs"
      - "packages/cli/__tests__/fixtures/mcp-materialized-capsule-child-contract.cjs"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-live-child.mjs"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-native-live.c"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-native-dlopen-library.c"
      - "packages/cli/__tests__/fixtures/process-broker-windows-posix-replace.ps1"
      - "packages/cli/__tests__/integration/sandbox-bwrap-live.test.js"
      - ".github/workflows/cli-strict-sandbox.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - ".github/actions/setup-linux-bwrap/action.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-latest-capability:
    name: "macOS latest native capability"
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      - name: Probe current macOS Seatbelt capability with a real process
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/cli/scripts/macos-latest-sandbox-capability.mjs
          "${RUNNER_TEMP}/macos-latest-sandbox-capability.json"
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-latest-sandbox-capability
          path: ${{ runner.temp }}/macos-latest-sandbox-capability.json
          if-no-files-found: error
          retention-days: 7

  strict-platform:
    name: "strict native boundary (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        # Keep the full Seatbelt acceptance lane pinned to macOS 15 while the
        # separate macos-latest job probes the current hosted image. A latest
        # capability result does not substitute for this full contract suite.
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps

      - name: Run mapped Claude security delta tests
        shell: bash
        run: >-
          node packages/cli/scripts/run-claude-security-map-tests.mjs
          --output "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"

      - name: Verify Windows helper source contract
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          ./packages/cli/scripts/build-windows-sandbox-helper.ps1 -Check

      - name: Set up Linux kernel sandbox backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-bwrap

      - name: Run platform sandbox contract tests
        working-directory: packages/cli
        # Hosted Windows can occasionally write a complete zero-failure JSON
        # report and still exit 1 during Vitest teardown. Retry once without
        # file parallelism only after a clean partial report, then accept a
        # teardown-only worker exit only when the retry report accounts for
        # every selected file and test with zero failures.
        run: >-
          node scripts/run-vitest-with-worker-retry.mjs -- run
          --reporter=default --reporter=json --silent=passed-only
          --testTimeout=35000
          --outputFile.json=strict-sandbox-contract-result.json
          __tests__/unit/process-execution-broker-platform-sandbox.test.js
          __tests__/unit/linux-generic-bwrap.test.js
          __tests__/unit/linux-generic-bwrap-runtime.test.js
          __tests__/unit/process-execution-broker-linux-generic-pty.test.js
          __tests__/unit/pty-manager.test.js
          __tests__/unit/hook-runner.test.js
          __tests__/unit/async-hook-supervisor.test.js
          __tests__/unit/hooks-v2-managed-policy.test.js
          __tests__/unit/hooks-v2-workspace-context.test.js
          __tests__/unit/event-runtime-host.test.js
          __tests__/unit/headless-runner.test.js
          __tests__/unit/headless-stream.test.js
          __tests__/unit/headless-hook-events.test.js
          __tests__/unit/remote-control-lib.test.js
          __tests__/unit/remote-approval-start.test.js
          __tests__/integration/remote-control-start.test.js
          __tests__/unit/agent-policy-repl-passthrough.test.js
          __tests__/unit/vscode-ext-remote-handoff.test.js
          __tests__/unit/vscode-ext-qr-code.test.js
          __tests__/unit/agent-repl-loop-wrapper.test.js
          __tests__/unit/ws-agent-handler.test.js
          __tests__/unit/ws-session-manager.test.js
          __tests__/unit/mcp-client-sandbox-policy.test.js
          __tests__/unit/mcp-call-ledger.test.js
          __tests__/unit/mcp-call-ledger-store.test.js
          __tests__/unit/mcp-host-recovery-runtime.test.js
          __tests__/unit/mcp-ledger-recovery-admission.test.js
          __tests__/unit/mcp-recovery-adjudication.test.js
          __tests__/unit/mcp-recovery-adjudication-store.test.js
          __tests__/unit/session-host-lease.test.js
          __tests__/unit/mcp-sandbox-policy.test.js
          __tests__/unit/mcp-stdio-capsule-contract.test.js
          __tests__/unit/mcp-stdio-native-code-policy.test.js
          __tests__/unit/mcp-stdio-execution-authority.test.js
          __tests__/unit/mcp-stdio-executable-identity.test.js
          __tests__/unit/mcp-stdio-package-materialization.test.js
          __tests__/unit/mcp-stdio-capsule-builder-worker.test.js
          __tests__/unit/mcp-stdio-immutable-vfs-resolver.test.js
          __tests__/unit/skill-execution-authority.test.js
          __tests__/unit/skill-loader.test.js
          __tests__/integration/agent-core-mcp-adversarial-stdio.test.js
          __tests__/integration/mcp-client-stdio-process-tree.test.js
          __tests__/unit/session-mcp-recovery.test.js
          __tests__/unit/agent-core-mcp-ledger.test.js
          __tests__/unit/agent-repl.test.js
          __tests__/unit/headless-runner-mcp-ledger.test.js
          __tests__/unit/cowork-task-runner.test.js
          __tests__/unit/session-resource-budget.test.js
          __tests__/unit/sub-agent-session-budget.test.js
          __tests__/unit/background-task-session-budget.test.js
          __tests__/unit/sub-agent-registry.test.js
          __tests__/unit/team-runner-session-budget.test.js
          __tests__/unit/agent-core.test.js
          __tests__/unit/ws-runtime-events.test.js
          __tests__/integration/ws-bridge-side-effect-resume.test.js
          __tests__/integration/parity-mcp-invoke.test.js
          __tests__/unit/plugin-monitor-supervisor.test.js
          __tests__/unit/plugin-runtime-mcp.test.js
          __tests__/unit/plugin-runtime-monitors.test.js
          __tests__/unit/plugin-runtime-hooks.test.js
          __tests__/unit/plugin-runtime-process-boundary.test.js
          __tests__/unit/plugin-marketplace-selection-command.test.js
          __tests__/unit/plugin-security.test.js
          __tests__/unit/plugin-runtime-install.test.js
          __tests__/unit/plugin-remote-source-security.test.js
          __tests__/unit/plugin-marketplace-source-cache.test.js
          __tests__/unit/agenda-command.test.js
          __tests__/unit/background-task-manager.test.js
          __tests__/unit/background-task-command-runner.test.js
          __tests__/unit/agent-core-run-shell-background-sandbox.test.js
          __tests__/unit/agent-sandbox.test.js
          __tests__/unit/sandbox-network-policy.test.js
          __tests__/integration/sandbox-egress-proxy.test.js
          __tests__/integration/sandbox-egress-worker.test.js
          __tests__/integration/background-task-worker.test.js
          src/lib/lsp/__tests__/lsp-client.test.js
          __tests__/unit/plugin-runtime-bin.test.js
          __tests__/unit/plugin-runtime-bin-agent-core.test.js

      # This suite launches a real worker and keeper that contend for a strict
      # state lock. Give those processes a quiet runner, while retaining the
      # suite as a required gate on every OS in this matrix.
      - name: Run background agent supervisor contract tests
        working-directory: packages/cli
        run: >-
          node scripts/run-vitest-with-worker-retry.mjs -- run
          --no-file-parallelism --reporter=default --reporter=json
          --silent=passed-only --testTimeout=35000
          --outputFile.json=background-agent-supervisor-result.json
          __tests__/unit/background-agent-supervisor.test.js

      - name: Run native ProcessExecutionBroker strict boundary
        id: strict-native-boundary
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=default --reporter=json
          --outputFile=strict-sandbox-result.json
          __tests__/integration/process-broker-platform-sandbox-live.test.js
          __tests__/integration/mcp-materialized-capsule-sandbox-live.test.js
          __tests__/unit/mcp-stdio-macos-code-snapshot.test.js

      - name: Produce advisory canonical SEC-DELTA fragment
        shell: bash
        run: >-
          node packages/cli/scripts/verify-claude-security-map.mjs
          --release-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --test-report "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"
          --disposition advisory
          --artifact-name "strict-sandbox-result-${{ matrix.os }}"
          --output "${RUNNER_TEMP}/claude-security-map-${RUNNER_OS}.json"

      - name: Capture macOS sandbox diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: >-
          /usr/bin/log show --last 5m --style compact
          --predicate 'subsystem == "com.apple.sandbox"'
          > packages/cli/strict-sandbox-system.log
          2>&1 || true

      - name: Upload strict sandbox result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strict-sandbox-result-${{ matrix.os }}
          path: |
            packages/cli/strict-sandbox-contract-result.json
            packages/cli/strict-sandbox-result.json
            packages/cli/strict-sandbox-system.log
            ${{ runner.temp }}/claude-security-map-tests-${{ runner.os }}.json
            ${{ runner.temp }}/claude-security-map-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run Linux bubblewrap filesystem and network boundary
        if: runner.os == 'Linux'
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=default
          __tests__/integration/sandbox-bwrap-live.test.js

      - name: Run Linux Docker egress boundary with real containers
        if: runner.os == 'Linux'
        working-directory: packages/cli
        env:
          CC_DOCKER_EGRESS_LIVE: "1"
          CC_DOCKER_EGRESS_IMAGE: "node@sha256:25330af3531fb5e23318554a0aa911125b6e91b1b777edf7655501d207c067a2"
        run: |
          docker info --format '{{.ServerVersion}}'
          docker pull "$CC_DOCKER_EGRESS_IMAGE"
          npx vitest run --reporter=default __tests__/integration/sandbox-docker-egress-live.test.js

  strict-linux-arm64:
    name: strict native boundary (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity and native ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      - name: Record native environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = arm64
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "runner_arch=$RUNNER_ARCH"
            echo "kernel=$(uname -srmo)"
            echo "node=$(node --version)"
          } > "${RUNNER_TEMP}/strict-linux-arm64-environment.txt"
      - name: Verify native anonymous tmpfile support
        shell: bash
        run: |
          set -euo pipefail
          echo "tmp_fs=$(findmnt -rn -T /tmp -o FSTYPE)" >> "${RUNNER_TEMP}/strict-linux-arm64-environment.txt"
          node --input-type=module -e '
            import fs from "node:fs";
            import { linuxTmpfileFlag } from "./packages/cli/src/lib/process-execution-broker/linux-open-flags.js";
            const c = fs.constants;
            const tmpfile = linuxTmpfileFlag(c);
            const flags = c.O_RDWR | c.O_EXCL | tmpfile | c.O_NOFOLLOW | c.O_NONBLOCK;
            const fd = fs.openSync("/tmp", flags, 0o400);
            try {
              fs.writeSync(fd, Buffer.from("probe"));
              fs.fsyncSync(fd);
              const stat = fs.fstatSync(fd);
              if (stat.nlink !== 0 || stat.size !== 5) throw new Error("anonymous tmpfile unattested");
              console.log(`tmpfile_flag=${tmpfile.toString(16)} nlink=${stat.nlink} size=${stat.size}`);
            } finally {
              fs.closeSync(fd);
            }
          ' >> "${RUNNER_TEMP}/strict-linux-arm64-environment.txt"
      - uses: ./.github/actions/setup-linux-bwrap
      - name: Record bubblewrap version
        shell: bash
        run: /usr/bin/bwrap --version >> "${RUNNER_TEMP}/strict-linux-arm64-environment.txt"
      - name: Run native broker and MCP capsule boundary
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=default --reporter=json
          --outputFile=arm64-native-sandbox-result.json
          __tests__/integration/process-broker-platform-sandbox-live.test.js
          __tests__/integration/mcp-materialized-capsule-sandbox-live.test.js
      - name: Run native bubblewrap boundary
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=default --reporter=json
          --outputFile=arm64-bwrap-result.json
          __tests__/integration/sandbox-bwrap-live.test.js
      - name: Run native Docker egress boundary
        working-directory: packages/cli
        env:
          CC_DOCKER_EGRESS_LIVE: "1"
          CC_DOCKER_EGRESS_IMAGE: "node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e"
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}'
          docker pull "$CC_DOCKER_EGRESS_IMAGE"
          test "$(docker image inspect "$CC_DOCKER_EGRESS_IMAGE" --format '{{.Architecture}}')" = arm64
          {
            echo "docker_image=$CC_DOCKER_EGRESS_IMAGE"
            echo "docker_image_arch=$(docker image inspect "$CC_DOCKER_EGRESS_IMAGE" --format '{{.Architecture}}')"
          } >> "${RUNNER_TEMP}/strict-linux-arm64-environment.txt"
          npx vitest run --reporter=default --reporter=json \
            --outputFile=arm64-docker-egress-result.json \
            __tests__/integration/sandbox-docker-egress-live.test.js
      - name: Upload native ARM64 evidence
        if: always()
        shell: bash
        run: |
          for report in packages/cli/arm64-*-result.json; do
            if test -f "$report"; then sha256sum "$report"; fi
          done > "${RUNNER_TEMP}/strict-linux-arm64-sha256.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: strict-sandbox-result-ubuntu-24.04-arm
          path: |
            packages/cli/arm64-*-result.json
            ${{ runner.temp }}/strict-linux-arm64-environment.txt
            ${{ runner.temp }}/strict-linux-arm64-sha256.txt
          if-no-files-found: warn
          retention-days: 7
