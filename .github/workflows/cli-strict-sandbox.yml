name: CLI Strict Sandbox

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/src/lib/process-execution-broker/**"
      - "packages/cli/scripts/build-windows-sandbox-helper.ps1"
      - "packages/cli/src/lib/packer/pkg-config-generator.js"
      - "packages/cli/__tests__/unit/packer-pkg-config-generator.test.js"
      - "packages/cli/package.json"
      - ".gitattributes"
      - "packages/cli/src/lib/plugin-runtime/bin.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/lib/agent-sandbox.js"
      - "packages/cli/__tests__/unit/process-execution-broker-platform-sandbox.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin-agent-core.test.js"
      - "packages/cli/__tests__/integration/process-broker-platform-sandbox-live.test.js"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-live-child.mjs"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-native-live.c"
      - "packages/cli/__tests__/fixtures/process-broker-windows-posix-replace.ps1"
      - "packages/cli/__tests__/integration/sandbox-bwrap-live.test.js"
      - ".github/workflows/cli-strict-sandbox.yml"
      - ".github/actions/setup-node-deps/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/src/lib/process-execution-broker/**"
      - "packages/cli/scripts/build-windows-sandbox-helper.ps1"
      - "packages/cli/src/lib/packer/pkg-config-generator.js"
      - "packages/cli/__tests__/unit/packer-pkg-config-generator.test.js"
      - "packages/cli/package.json"
      - ".gitattributes"
      - "packages/cli/src/lib/plugin-runtime/bin.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/lib/agent-sandbox.js"
      - "packages/cli/__tests__/unit/process-execution-broker-platform-sandbox.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin.test.js"
      - "packages/cli/__tests__/unit/plugin-runtime-bin-agent-core.test.js"
      - "packages/cli/__tests__/integration/process-broker-platform-sandbox-live.test.js"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-live-child.mjs"
      - "packages/cli/__tests__/fixtures/process-broker-linux-bwrap-native-live.c"
      - "packages/cli/__tests__/fixtures/process-broker-windows-posix-replace.ps1"
      - "packages/cli/__tests__/integration/sandbox-bwrap-live.test.js"
      - ".github/workflows/cli-strict-sandbox.yml"
      - ".github/actions/setup-node-deps/action.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-platform:
    name: "strict native boundary (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        # macos-latest currently resolves to macOS 26, where Apple removed the
        # sandbox-exec binary. Keep the Seatbelt acceptance lane on the newest
        # hosted image that still exposes the declared production primitive.
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps

      - name: Verify Windows helper source contract
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          ./packages/cli/scripts/build-windows-sandbox-helper.ps1 -Check

      - name: Install bubblewrap for Linux kernel boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          /usr/bin/bwrap --version
          /usr/bin/bwrap --help | grep -F -- --ro-bind-fd
          /usr/bin/bwrap --help | grep -F -- "--ro-bind-data FD DEST"
          /usr/bin/bwrap --help | grep -F -- "--perms OCTAL"
          /usr/bin/bwrap --help | grep -F -- --disable-userns
          /usr/bin/bwrap --help | grep -F -- --assert-userns-disabled
          /usr/bin/bwrap --help | grep -F -- --seccomp

      - name: Run platform sandbox contract tests
        working-directory: packages/cli
        run: >-
          npx vitest run --reporter=json
          --outputFile=strict-sandbox-contract-result.json
          __tests__/unit/process-execution-broker-platform-sandbox.test.js
          __tests__/unit/plugin-runtime-bin.test.js
          __tests__/unit/plugin-runtime-bin-agent-core.test.js

      - name: Run native ProcessExecutionBroker strict boundary
        id: strict-native-boundary
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=json
          --outputFile=strict-sandbox-result.json
          __tests__/integration/process-broker-platform-sandbox-live.test.js

      - name: Capture macOS sandbox diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: >-
          /usr/bin/log show --last 5m --style compact
          --predicate 'subsystem == "com.apple.sandbox"'
          > packages/cli/strict-sandbox-system.log
          2>&1 || true

      - name: Upload strict sandbox result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strict-sandbox-result-${{ matrix.os }}
          path: |
            packages/cli/strict-sandbox-contract-result.json
            packages/cli/strict-sandbox-result.json
            packages/cli/strict-sandbox-system.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run Linux bubblewrap filesystem and network boundary
        if: runner.os == 'Linux'
        working-directory: packages/cli
        env:
          CC_SANDBOX_LIVE: "1"
        run: >-
          npx vitest run --reporter=default
          __tests__/integration/sandbox-bwrap-live.test.js
