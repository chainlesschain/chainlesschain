name: VERIFY01 collect existing public 138 results

on:
  push:
    tags: [verify01-public138-collect-*]

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'chainlesschain/chainlesschain'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/openai138-four-retest
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Read existing immutable artifacts without model credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/cli/scripts/verify01-public138-collect.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: verify01-public138-collected-results
          path: docs/research/cli/verify01-openai-138/public-c472d664eb/
          include-hidden-files: true
      - name: Commit original receipts and result index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/research/cli/verify01-openai-138/public-c472d664eb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(verify01): archive public 138 four-case results [skip ci]'
          git push origin HEAD:refs/heads/feature/openai138-four-retest
