name: Recover product v5.0.3.140

# This entry only recovers the reviewed f733f92 build. It cannot select arbitrary
# runs, source commits, package versions, or artifact names.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified complete draft after all recovery gates
        type: boolean
        default: false
        required: true

concurrency:
  group: product-release-v5.0.3.140
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  BUILD_SOURCE_SHA: f733f92cb953fffaafea9f91024bbf1c8846406d
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  audit-original:
    name: Verify original source and successful producers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed recovery controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          fetch-depth: 0
          sparse-checkout: scripts
      - name: Checkout immutable original product source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BUILD_SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Test recovery rejection boundaries
        run: >-
          node --test
          controller/scripts/__tests__/verify-product-recovery.test.mjs
          controller/scripts/__tests__/verify-android-release-signature.test.cjs
          controller/scripts/__tests__/verify-android-release-artifacts.test.cjs
      - name: Audit original run and six exact-source CI gates
        run: node controller/scripts/ci/verify-product-recovery.mjs audit source original-audit
      - name: Preserve original producer audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-recovery-original-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: original-audit/
          if-no-files-found: error
          retention-days: 90

  build-android:
    name: Rebuild and verify original Android source
    needs: audit-original
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed recovery controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          fetch-depth: 0
          sparse-checkout: scripts
      - name: Checkout immutable original product source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BUILD_SOURCE_SHA }}
          path: source
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Require configured release signing
        working-directory: source/android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "::error::Required Android release credential is missing: $required"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          release.storeFile=keystore.jks
          release.storePassword=${KEYSTORE_PASSWORD}
          release.keyAlias=${KEY_ALIAS}
          release.keyPassword=${KEY_PASSWORD}
          EOF
          echo 'SIGNING_TYPE=release' >> "$GITHUB_ENV"
      - name: Build original Android payload with the established CI settings
        working-directory: source/android-app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SOURCE_SHA"
          chmod +x gradlew
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/android.enableR8.fullMode=true/android.enableR8.fullMode=false/' gradle.properties
          ./gradlew downloadInternalBinaries --no-daemon
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon
      - name: Verify release signatures and pinned CLI bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bash "$GITHUB_WORKSPACE/controller/scripts/ci/verify-android-release-artifacts.sh" \
            "$GITHUB_WORKSPACE/source/android-app" "$RUNNER_TEMP/android-release-diagnostics"
      - name: Bind verified Android bytes to original source and recovery controller
        run: node controller/scripts/ci/verify-product-recovery.mjs android-receipt source android-recovery
      - name: Upload verified Android recovery artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-recovery-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-recovery/
          if-no-files-found: error
          retention-days: 90
      - name: Upload sanitized verification diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-recovery-android-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-release-diagnostics/sanitized/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f source/android-app/keystore.jks source/android-app/keystore.properties

  publish-complete-product:
    name: Verify five-platform provenance and publish complete product
    needs: [audit-original, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout reviewed recovery controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          fetch-depth: 0
          sparse-checkout: scripts
      - name: Checkout immutable original product source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BUILD_SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Install only the source-lock-pinned metadata parser
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const yaml = require('./source/package-lock.json').packages['node_modules/yaml'];
          if (!yaml?.integrity || !yaml.resolved || Object.keys(yaml.dependencies || {}).length) throw new Error('Unpinned metadata parser');
          const root = path.join(process.env.RUNNER_TEMP, 'recovery-parser');
          const pkg = { name: 'recovery-parser', version: '1.0.0', private: true, dependencies: { yaml: yaml.version } };
          fs.mkdirSync(root);
          fs.writeFileSync(path.join(root, 'package.json'), JSON.stringify(pkg));
          fs.writeFileSync(path.join(root, 'package-lock.json'), JSON.stringify({ name: pkg.name, version: pkg.version, lockfileVersion: 3, packages: { '': pkg, 'node_modules/yaml': { version: yaml.version, resolved: yaml.resolved, integrity: yaml.integrity, bin: yaml.bin, engines: yaml.engines } } }));
          NODE
          npm ci --prefix "$RUNNER_TEMP/recovery-parser" --ignore-scripts --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/recovery-parser/node_modules" >> "$GITHUB_ENV"
      - name: Download original immutable archives and verify all 22 assets
        run: node controller/scripts/ci/verify-product-recovery.mjs aggregate source recovery
      - name: Require current public CLI and both IDE releases
        env:
          CC_MARKETPLACE_VERIFY_ATTEMPTS: "1"
          CC_OPEN_VSX_LISTING_VERIFY_ATTEMPTS: "1"
        run: |
          set -euo pipefail
          test "$(npm view chainlesschain@0.166.93 version --registry=https://registry.npmjs.org --prefer-online)" = 0.166.93
          mkdir -p "$RUNNER_TEMP/public-cli-readback"
          npm pack chainlesschain@0.166.93 --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP/public-cli-readback" >/dev/null
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto'), path = require('node:path');
          const evidence = require('./recovery/product-recovery-provenance.json');
          const tar = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'public-cli-readback/chainlesschain-0.166.93.tgz'));
          if (crypto.createHash('sha512').update(tar).digest('hex') !== evidence.cliEvidence.provenance.sha512) throw new Error('Public CLI archive differs from original npm attestation');
          fs.writeFileSync('recovery/public-cli.json', JSON.stringify({ version: '0.166.93', sha512: evidence.cliEvidence.provenance.sha512 }));
          NODE
          node source/scripts/verify-ide-marketplace.mjs open-vsx 0.37.138 > recovery/open-vsx-public.json
          node source/scripts/verify-ide-marketplace.mjs jetbrains 0.4.156 > recovery/jetbrains-public.json
          node controller/scripts/ci/verify-product-recovery.mjs prerequisites source recovery
      - name: Preserve exact asset receipt and recovery provenance before publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-recovery-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/product-release-assets.json
            recovery/product-recovery-provenance.json
            recovery/public-cli.json
            recovery/open-vsx-public.json
            recovery/jetbrains-public.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish only complete source-bound product through Actions token
        env:
          RECOVERY_PUBLISH: ${{ inputs.publish }}
        run: node controller/scripts/ci/verify-product-recovery.mjs publish source recovery
      - name: Preserve final GitHub release readback
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-recovery-release-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/draft-readback.json
            recovery/public-readback.json
          if-no-files-found: ignore
          retention-days: 90
