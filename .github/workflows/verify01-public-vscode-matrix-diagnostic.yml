name: VERIFY01 Public VS Code Native First Run
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Real public VSIX + CLI paid UI and restart journey on three native OSes"
        type: boolean
        required: true
        default: false
      hosts:
        description: "Run all hosts or only a failed native host"
        type: choice
        required: true
        default: all
        options: [all, linux, windows, macos]
  push:
    branches: [feature/verify01-task-completion-20261017]
    paths:
      - packages/cli/scripts/verify01-public-vscode-matrix-diagnostic.mjs
      - .github/workflows/verify01-public-vscode-matrix-diagnostic.yml
permissions:
  contents: read
jobs:
  first-run:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_live == true) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[volcengine-vscode-first-run]') || contains(github.event.head_commit.message, '[volcengine-vscode-linux]') || contains(github.event.head_commit.message, '[volcengine-vscode-windows]') || contains(github.event.head_commit.message, '[volcengine-vscode-macos]')))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.hosts == 'linux' || contains(github.event.head_commit.message, '[volcengine-vscode-linux]')) && '["ubuntu-24.04"]' || (inputs.hosts == 'windows' || contains(github.event.head_commit.message, '[volcengine-vscode-windows]')) && '["windows-latest"]' || (inputs.hosts == 'macos' || contains(github.event.head_commit.message, '[volcengine-vscode-macos]')) && '["macos-15"]' || '["ubuntu-24.04","windows-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Validate host configuration
        run: node --test packages/cli/test-node/verify01-public-vscode-matrix-diagnostic.node-test.mjs
      - name: Prepare real VS Code and test driver dependencies
        working-directory: packages/vscode-extension
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @vscode/test-electron@3.1.0 ws@8.21.2
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode({version:'1.132.0',cachePath:require('node:path').resolve('.vscode-test')}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Install Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Public installed extension and real model UI journey
        shell: bash
        env:
          VOLCENGINE_API_KEY: ${{ secrets.CC_LLM_API_KEY }}
        run: |
          display=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/cli/scripts/verify01-public-vscode-matrix-diagnostic.mjs --confirm-live --output-dir "$RUNNER_TEMP/public-vscode-first-run"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-vscode-first-run-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-vscode-first-run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
