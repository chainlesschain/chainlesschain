name: VERIFY01 public 139 round 2 assisted history repair

on:
  push:
    tags: [verify01-139r2-assisted08-*]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Pull original independent acceptance image
        run: docker pull node:22.12.0-bookworm
      - name: Verify repaired history candidate against original evaluator
        run: >-
          node packages/cli/scripts/verify01-public139-assisted-check.mjs
          verify-08 docs/research/cli/verify01-openai-139-r2-20261103
      - name: Preserve assisted result and original receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-public139-r2-assisted-verify08-${{ github.sha }}
          path: ${{ runner.temp }}/verify01-public139-assisted-verify08/
          if-no-files-found: error
