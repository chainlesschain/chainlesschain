name: VERIFY01 public 139 round 2 package preflight

on:
  push:
    tags: [verify01-139r2-preflight-*]

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: github.repository == 'chainlesschain/chainlesschain'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Verify latest CLI and IDE bytes without model credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/cli/scripts/verify01-public139-r2-package-snapshot.mjs
      - name: Preserve new round identities and public JetBrains proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-public139-r2-preflight-${{ github.sha }}
          path: |
            docs/research/cli/verify01-package-sets/2026-11-03-openai-139-r2.json
            docs/research/cli/verify01-openai-139-r2-20261103/package-resolution.json
            docs/research/cli/verify01-openai-139-r2-20261103/jetbrains-public.json
          if-no-files-found: warn
