name: Model Catalog Review

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  pull_request:
    paths:
      - "packages/cli/src/lib/model-*.js"
      - "packages/cli/src/lib/llm-pricing.js"
      - "packages/cli/scripts/review-model-catalog.mjs"
      - "packages/cli/__tests__/fixtures/model-catalog-review-*.json"
      - ".github/workflows/model-catalog-review.yml"

permissions:
  contents: read

jobs:
  reviewed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.2"
      - uses: ./.github/actions/setup-node-deps
      - name: Verify reviewed model contracts
        run: node packages/cli/scripts/review-model-catalog.mjs
      # Review alerts are separate from exact-commit npm release gates. An
      # upstream release never modifies or enables a model automatically.
      - name: Fetch official release notes
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --location --max-time 60 https://developers.openai.com/codex/changelog -o "$RUNNER_TEMP/codex.html"
          curl --fail --location --max-time 60 https://code.claude.com/docs/en/changelog.md -o "$RUNNER_TEMP/claude.md"
      - name: Detect releases requiring review
        if: github.event_name != 'pull_request'
        run: node packages/cli/scripts/review-model-catalog.mjs --codex "$RUNNER_TEMP/codex.html" --claude "$RUNNER_TEMP/claude.md" --fail-on-drift
