name: IDE Roadmap Safety Matrix

on:
  pull_request:
    paths:
      - ".github/workflows/ide-roadmap-safety.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "package.json"
      - "package-lock.json"
      - "tests/fixtures/ide-roadmap/**"
      - "packages/cli/package.json"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/scripts/ide-roadmap-safety-gate.mjs"
      - "packages/cli/scripts/verify-rc-default-audit.mjs"
      - "packages/cli/src/commands/remote-control.js"
      - "packages/cli/src/lib/remote-control.js"
      - "packages/cli/src/lib/remote-approval-bridge.js"
      - "packages/cli/src/harness/remote-session-registry.js"
      - "packages/cli/__tests__/integration/remote-control-start.test.js"
      - "packages/cli/__tests__/unit/remote-control-lib.test.js"
      - "packages/cli/__tests__/unit/remote-approval-start.test.js"
      - "packages/cli/__tests__/unit/rc-default-audit.test.js"
      - "packages/cli/scripts/verify-claude-security-map.mjs"
      - "packages/cli/scripts/run-claude-security-map-tests.mjs"
      - "packages/cli/__tests__/unit/claude-security-map.test.js"
      - "packages/cli/__tests__/unit/**"
      - "packages/cli/src/**"
      - "tests/fixtures/claude-2.1.221-238-security-map.json"
      - "packages/cli/scripts/ide-roadmap-mcp-security-gate.mjs"
      - "packages/cli/src/harness/mcp-client.js"
      - "packages/cli/src/harness/prompt-compressor.js"
      - "packages/cli/src/harness/structured-handoff.js"
      - "packages/cli/src/lib/mcp-call-ledger.js"
      - "packages/cli/src/lib/mcp-conflict-scheduler.js"
      - "packages/cli/src/lib/mcp-effect-contract.js"
      - "packages/cli/src/lib/mcp-ledger-recovery-admission.js"
      - "packages/cli/src/lib/mcp-stdio-execution-authority.js"
      - "packages/cli/src/lib/mcp-stdio-environment.js"
      - "packages/cli/src/lib/mcp-stdio-executable-identity.js"
      - "packages/cli/src/lib/mcp-stdio-package-materialization.js"
      - "packages/cli/src/lib/plan-mode.js"
      - "packages/cli/src/lib/plan-persistence.js"
      - "packages/cli/src/lib/todo-manager.js"
      - "packages/cli/src/lib/todo-persistence.js"
      - "packages/cli/src/gateways/ws/ws-session-state.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/runtime/mcp-config.js"
      - "packages/cli/__tests__/fixtures/mcp-adversarial-effect-server.mjs"
      - "packages/cli/__tests__/integration/agent-core-mcp-adversarial-stdio.test.js"
      - "packages/cli/__tests__/unit/agent-core-mcp-ledger.test.js"
      - "packages/cli/__tests__/unit/agent-core-mcp-scheduler.test.js"
      - "packages/cli/__tests__/unit/ide-roadmap-mcp-security-gate.test.js"
      - "packages/cli/__tests__/unit/mcp-stdio-package-materialization.test.js"
      - "packages/cli/__tests__/unit/verify-ide-roadmap-fixtures.test.js"
      - "packages/cli/__tests__/unit/ide-roadmap-safety-gate.test.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ide-roadmap-safety.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "package.json"
      - "package-lock.json"
      - "tests/fixtures/ide-roadmap/**"
      - "packages/cli/package.json"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/scripts/ide-roadmap-safety-gate.mjs"
      - "packages/cli/scripts/verify-rc-default-audit.mjs"
      - "packages/cli/src/commands/remote-control.js"
      - "packages/cli/src/lib/remote-control.js"
      - "packages/cli/src/lib/remote-approval-bridge.js"
      - "packages/cli/src/harness/remote-session-registry.js"
      - "packages/cli/__tests__/integration/remote-control-start.test.js"
      - "packages/cli/__tests__/unit/remote-control-lib.test.js"
      - "packages/cli/__tests__/unit/remote-approval-start.test.js"
      - "packages/cli/__tests__/unit/rc-default-audit.test.js"
      - "packages/cli/scripts/verify-claude-security-map.mjs"
      - "packages/cli/scripts/run-claude-security-map-tests.mjs"
      - "packages/cli/__tests__/unit/claude-security-map.test.js"
      - "packages/cli/__tests__/unit/**"
      - "packages/cli/src/**"
      - "tests/fixtures/claude-2.1.221-238-security-map.json"
      - "packages/cli/scripts/ide-roadmap-mcp-security-gate.mjs"
      - "packages/cli/src/harness/mcp-client.js"
      - "packages/cli/src/harness/prompt-compressor.js"
      - "packages/cli/src/harness/structured-handoff.js"
      - "packages/cli/src/lib/mcp-call-ledger.js"
      - "packages/cli/src/lib/mcp-conflict-scheduler.js"
      - "packages/cli/src/lib/mcp-effect-contract.js"
      - "packages/cli/src/lib/mcp-ledger-recovery-admission.js"
      - "packages/cli/src/lib/mcp-stdio-execution-authority.js"
      - "packages/cli/src/lib/mcp-stdio-environment.js"
      - "packages/cli/src/lib/mcp-stdio-executable-identity.js"
      - "packages/cli/src/lib/mcp-stdio-package-materialization.js"
      - "packages/cli/src/lib/plan-mode.js"
      - "packages/cli/src/lib/plan-persistence.js"
      - "packages/cli/src/lib/todo-manager.js"
      - "packages/cli/src/lib/todo-persistence.js"
      - "packages/cli/src/gateways/ws/ws-session-state.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/runtime/mcp-config.js"
      - "packages/cli/__tests__/fixtures/mcp-adversarial-effect-server.mjs"
      - "packages/cli/__tests__/integration/agent-core-mcp-adversarial-stdio.test.js"
      - "packages/cli/__tests__/unit/agent-core-mcp-ledger.test.js"
      - "packages/cli/__tests__/unit/agent-core-mcp-scheduler.test.js"
      - "packages/cli/__tests__/unit/ide-roadmap-mcp-security-gate.test.js"
      - "packages/cli/__tests__/unit/mcp-stdio-package-materialization.test.js"
      - "packages/cli/__tests__/unit/verify-ide-roadmap-fixtures.test.js"
  schedule:
    - cron: "17 2 * * 4"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full commit SHA to test (blank uses selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  IDE_ROADMAP_SAFETY_COMMIT: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  IDE_ROADMAP_SAFETY_RUNS: "100"

jobs:
  safety-matrix:
    name: "P0-S formal recovery and handoff (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact safety candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_ROADMAP_SAFETY_COMMIT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Verify roadmap manifest contract only
        run: node packages/cli/scripts/verify-ide-roadmap-fixtures.mjs --contract-only

      - name: Run mapped Claude security delta tests
        shell: bash
        run: >-
          node packages/cli/scripts/run-claude-security-map-tests.mjs
          --output "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"

      - name: Test fail-closed runtime evidence verifier
        run: npm --prefix packages/cli test -- __tests__/unit/verify-ide-roadmap-fixtures.test.js

      - name: Run 100 independent injections per kill point and transport
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-safety-gate.mjs \
            --runs "${IDE_ROADMAP_SAFETY_RUNS}" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/ide-roadmap-safety-${RUNNER_OS}.json"

      - name: Run 100 adversarial calls per MCP effect class over real stdio
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-mcp-security-gate.mjs \
            --runs "${IDE_ROADMAP_SAFETY_RUNS}" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/ide-roadmap-mcp-security-${RUNNER_OS}.json"

      - name: Produce required canonical SEC-DELTA fragment
        shell: bash
        run: >-
          node packages/cli/scripts/verify-claude-security-map.mjs
          --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}"
          --test-report "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"
          --disposition required
          --artifact-name "ide-roadmap-safety-${RUNNER_OS}-${IDE_ROADMAP_SAFETY_COMMIT}-${GITHUB_RUN_ATTEMPT}"
          --output "${RUNNER_TEMP}/claude-security-map-${RUNNER_OS}.json"

      - name: Produce required canonical RC-DEFAULT fragment
        shell: bash
        run: >-
          node packages/cli/scripts/verify-rc-default-audit.mjs
          --required
          --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}"
          --artifact-name "ide-roadmap-safety-${RUNNER_OS}-${IDE_ROADMAP_SAFETY_COMMIT}-${GITHUB_RUN_ATTEMPT}"
          --output "${RUNNER_TEMP}/rc-default-audit-${RUNNER_OS}.json"

      - name: Upload exact-SHA safety evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ide-roadmap-safety-${{ runner.os }}-${{ env.IDE_ROADMAP_SAFETY_COMMIT }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ide-roadmap-safety-${{ runner.os }}.json
            ${{ runner.temp }}/ide-roadmap-mcp-security-${{ runner.os }}.json
            ${{ runner.temp }}/claude-security-map-tests-${{ runner.os }}.json
            ${{ runner.temp }}/claude-security-map-${{ runner.os }}.json
            ${{ runner.temp }}/rc-default-audit-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: P0-S formal safety gate
    if: always()
    needs: safety-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse an incomplete platform matrix
        if: needs.safety-matrix.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one formal safety platform failed or did not finish"
          exit 1

      - name: Checkout exact safety candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_ROADMAP_SAFETY_COMMIT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          pattern: ide-roadmap-safety-*-${{ env.IDE_ROADMAP_SAFETY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ide-roadmap-safety-evidence
          merge-multiple: true

      - name: Verify exact commit, three OSes, sample counts, and invariants
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-safety-gate.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/ide-roadmap-safety-evidence" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/ide-roadmap-safety-aggregate.json"

          node packages/cli/scripts/ide-roadmap-mcp-security-gate.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/ide-roadmap-safety-evidence" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/ide-roadmap-mcp-security-aggregate.json"

          node packages/cli/scripts/verify-claude-security-map.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/ide-roadmap-safety-evidence" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/claude-security-map-aggregate.json"

          node packages/cli/scripts/verify-rc-default-audit.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/ide-roadmap-safety-evidence" \
            --release-commit "${IDE_ROADMAP_SAFETY_COMMIT}" \
            --output "${RUNNER_TEMP}/rc-default-audit-aggregate.json"

      - name: Upload immutable aggregate
        uses: actions/upload-artifact@v6
        with:
          name: ide-roadmap-safety-aggregate-${{ env.IDE_ROADMAP_SAFETY_COMMIT }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ide-roadmap-safety-aggregate.json
            ${{ runner.temp }}/ide-roadmap-mcp-security-aggregate.json
            ${{ runner.temp }}/claude-security-map-aggregate.json
            ${{ runner.temp }}/rc-default-audit-aggregate.json
          if-no-files-found: error
          retention-days: 90
