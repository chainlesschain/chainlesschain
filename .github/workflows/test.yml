name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 快速单元测试（排除不稳定测试）
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Vitest 4 (vitest-dev/vitest#8297) made birpc respect user-configured
    # timeouts, so the Windows-only 60s onTaskUpdate heartbeat that gated
    # this matrix is gone. continue-on-error stayed on Windows until the
    # v4 bump landed; closes #5.

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The selector diffs origin/<base>...HEAD. A depth-1 checkout plus a
          # depth-1 base fetch contains both tips but no common ancestor.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      # The fail-closed fallback exercises the real embedded CLI vendor path.
      # A workspace-hoisted install does not create the dependency closure that
      # is copied into Resources/packages/cli during desktop packaging.
      - name: Install packages/cli production dependencies standalone
        working-directory: ./packages/cli
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-cli-production-deps.sh"

      - name: Run TypeScript type check
        working-directory: ./desktop-app-vue
        # vue-tsc on 164k+ LOC trips macOS runner's 7GB RAM ceiling without
        # this; SIGABRT (exit 134). Match the 4GB cap used in release.yml.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run type-check

      - name: Fetch base branch for diff
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}

      - name: Run intelligent test selection
        id: test-selector
        working-directory: ./desktop-app-vue
        shell: bash
        run: |
          echo "🧪 Running Cowork intelligent test selection..."
          node scripts/cowork-ci-test-selector.js
        continue-on-error: true

      - name: Run stable unit tests (fallback)
        id: fallback-tests
        if: steps.test-selector.outcome == 'failure' && steps.test-selector.outputs.test-mode == 'fail-closed'
        working-directory: ./desktop-app-vue
        shell: bash
        # Detection/mapping failures cannot safely choose a subset. Run both
        # configured unit roots; vitest.config.ts still excludes E2E/spec and
        # standalone integration probes. Do not add broad domain exclusions:
        # they would make a successful fallback indistinguishable from a gap.
        run: |
          echo "⚠️  Intelligent test selection failed, running complete unit roots..."
          npm exec --offline -- vitest run tests/unit src \
            --reporter=default --silent=passed-only --pool=forks --maxWorkers=2

      - name: Enforce selector or fallback result
        if: always()
        env:
          SELECTOR_OUTCOME: ${{ steps.test-selector.outcome }}
          SELECTOR_MODE: ${{ steps.test-selector.outputs.test-mode }}
          FALLBACK_OUTCOME: ${{ steps.fallback-tests.outcome }}
        run: |
          node -e "const selector=process.env.SELECTOR_OUTCOME; const mode=process.env.SELECTOR_MODE; const fallback=process.env.FALLBACK_OUTCOME; const passed=selector==='success'||(selector==='failure'&&mode==='fail-closed'&&fallback==='success'); console.log('selector='+selector+', mode='+mode+', fallback='+fallback); if(!passed){console.error('Selected tests failed, or fail-closed fallback did not pass.'); process.exit(1)}"

      - name: Test Summary
        if: always()
        shell: bash
        env:
          SELECTOR_OUTCOME: ${{ steps.test-selector.outcome }}
          SELECTOR_MODE: ${{ steps.test-selector.outputs.test-mode }}
          FALLBACK_OUTCOME: ${{ steps.fallback-tests.outcome }}
        run: |
          echo "### Unit Tests (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          if [ "$SELECTOR_OUTCOME" == "success" ]; then
            echo "✅ Intelligent test selection passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$SELECTOR_MODE" == "fail-closed" ] && [ "$FALLBACK_OUTCOME" == "success" ]; then
            echo "✅ Fail-closed stable fallback passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Unit-test gate failed" >> $GITHUB_STEP_SUMMARY
          fi

  # 代码质量检查
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Run ESLint
        working-directory: ./desktop-app-vue
        run: npm run lint --if-present

      - name: Run rules validator
        working-directory: ./desktop-app-vue
        run: npm run validate:rules
        continue-on-error: true

  # 构建检查
  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Build main process
        working-directory: ./desktop-app-vue
        run: npm run build:main

      - name: Build renderer
        working-directory: ./desktop-app-vue
        run: npm run build:renderer

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}
          path: |
            desktop-app-vue/dist/
          retention-days: 7

  # CLI 全局安装冒烟（验证 postinstall 在 Windows/Linux 都不炸）
  cli-install-smoke:
    name: CLI Global Install Smoke
    runs-on: ${{ matrix.os }}
    # Windows global installs can spend several minutes resolving native
    # dependencies. Keep enough headroom for hosted-runner/network variance.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Pack CLI and exact internal dependency candidates
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-cli-production-deps.sh"
          --pack-candidates "$RUNNER_TEMP/cli-global-install-candidates"

      - name: Global install from tarball (exercises postinstall)
        shell: bash
        env:
          # Reproduce a first install on a machine without Python/build tools.
          # Every native dependency must be optional so node-gyp failures do
          # not prevent the portable sql.js-backed CLI from installing.
          npm_config_build_from_source: "true"
          NODE_GYP_FORCE_PYTHON: ${{ runner.temp }}/chainlesschain-no-python
        run: npm install -g "$RUNNER_TEMP/cli-global-install-candidates/"*.tgz

      - name: Verify CLI executable
        shell: bash
        run: |
          cc --version
          chainlesschain --version

  # 数据库测试（仅 Linux，需要 SQLite）
  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Run database tests
        working-directory: ./desktop-app-vue
        run: npm run test:db

  # Personal Data Hub 测试（独立 workspace，CI 之前完全没跑过 —— 见 memory
  # bs3mc_electron_abi_sandbox_workaround "MAJOR FINDING"）。
  # 关键：在 workspace 之外做独立 install，让 better-sqlite3-multiple-ciphers
  # 拿到 host-Node 的预编译 (ABI 127)，而不是 desktop-app-vue 的 Electron 构建
  # ——否则 vitest.config.js 的探针会判定 native 不可用而静默 skip 15 个 vault
  # 测试，job 假绿。guard step 再显式断言 native 能加载，杜绝假绿。
  pdh-tests:
    name: PDH Data Hub Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Run PDH suite in an isolated install (host-ABI native drivers)
        shell: bash
        run: |
          set -euo pipefail
          # Mirror the REAL repo layout (packages/… + scripts/… + docs/…) in a scratch dir
          # OUTSIDE the workspace so npm install resolves standalone — bs3mc then
          # gets the host-Node prebuild (ABI 127), not desktop-app-vue's Electron
          # build. Full depth (packages/personal-data-hub + packages/cli +
          # scripts/android) preserves EVERY cross-tree relative import the tests
          # make, at the same depth as the real tree:
          #   __tests__/adapters/…test.js      → ../../../cli/src/lib/host-adb-bridge.js
          #   __tests__/sqlite-leaf-salvage.js → ../../../scripts/android/pdh-sqlite-leaf-salvage.js
          #     (which in turn → ../../packages/personal-data-hub/lib/forensics/leaf-salvage.js)
          ROOT="${RUNNER_TEMP}/pdh-ci"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/packages/personal-data-hub" "$ROOT/packages/cli" "$ROOT/scripts/android" "$ROOT/docs/internal"
          cp -r packages/personal-data-hub/lib "$ROOT/packages/personal-data-hub/"
          cp -r packages/personal-data-hub/__tests__ "$ROOT/packages/personal-data-hub/"
          cp packages/personal-data-hub/package.json "$ROOT/packages/personal-data-hub/"
          cp packages/personal-data-hub/vitest.config.js "$ROOT/packages/personal-data-hub/"
          cp -r packages/cli/src "$ROOT/packages/cli/src"   # host-adb-bridge.js (node builtins only)
          cp packages/cli/package.json "$ROOT/packages/cli/"  # package metadata read by CLI bridge tests
          cp scripts/android/pdh-sqlite-leaf-salvage.js "$ROOT/scripts/android/"  # leaf-salvage test re-export target
          cp docs/internal/pdh-app-data-catalog.json "$ROOT/docs/internal/"  # catalog completeness fixture
          cd "$ROOT/packages/personal-data-hub"
          npm install --no-audit --no-fund --loglevel=warn
          # Plain better-sqlite3 (browser-history / *-adb / vscode adapters read
          # external SQLite DBs) is hoisted in the real workspace but not a
          # declared PDH dep, so a standalone install lacks it — add it.
          # Keep the auxiliary plain driver on the Node 22 prebuild line. The
          # newest 12.x release can fall back to node-gyp on Windows runners
          # when its host-ABI prebuild is unavailable, which requires MSVC.
          npm install --no-save --no-audit --no-fund better-sqlite3@11.10.0
          # Guard: both native drivers MUST load in CI. If a future Node has no
          # prebuild, fail loud here instead of letting vitest.config.js silently
          # skip the vault tests and report a false green.
          node -e "new (require('better-sqlite3-multiple-ciphers'))(':memory:').close(); console.log('bs3mc OK, ABI '+process.versions.modules)"
          node -e "new (require('better-sqlite3'))(':memory:').close(); console.log('better-sqlite3 OK')"
          VITEST_ARGS=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Native SQLite tests perform many short-lived database and temp-file
            # operations. On shared Windows runners, the default worker count can
            # amplify Defender/filesystem contention until an otherwise sub-second
            # test hits the finite 60s hang guard. Two isolated forks keep the full
            # suite parallel without starving an individual native test.
            VITEST_ARGS+=(--pool=forks --maxWorkers=2)
          fi
          npx vitest run --reporter=default "${VITEST_ARGS[@]}"

  # 完整测试（可选，手动触发或定时运行）
  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    # 2026-05-28: bump 30 → 60 min. Run all unit tests takes ~17 min and
    # Run test coverage another ~15 min, so the previous 30 min cap killed
    # the coverage step mid-flight every push (runs 26568184549, 26522992152
    # both cancelled at the limit). The coverage step is continue-on-error
    # so it doesn't fail the job, but a JOB-level timeout still cancels it.
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      # The vendor-layout unit test exercises the same standalone production
      # dependency tree shipped under Resources/packages/cli. A workspace
      # install may hoist semver (and other runtime packages), so prepare the
      # real packaging topology before the complete unit suite.
      - name: Install packages/cli production dependencies standalone
        working-directory: ./packages/cli
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-cli-production-deps.sh"

      - name: Run all unit tests
        working-directory: ./desktop-app-vue
        run: npm run test:unit

      - name: Run test coverage
        working-directory: ./desktop-app-vue
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./desktop-app-vue/coverage/lcov.info
          flags: unittests
          name: codecov-full
          fail_ci_if_error: false

      - name: Archive coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: desktop-app-vue/coverage/
          retention-days: 30
