name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 快速测试（只运行核心测试）
  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run CLI tests
        id: cli
        run: npm test

      - name: Run Vitest tests (no coverage)
        id: vitest
        if: ${{ !cancelled() }}
        run: npx vitest run tests/unit/ai/ai-engine-workflow.test.js tests/unit/ai/ai-skill-scheduler.test.js

      - name: Comment PR
        uses: actions/github-script@v8
        if: always()
        with:
          script: |
            const mark = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const cli = '${{ steps.cli.outcome }}';
            const vitest = '${{ steps.vitest.outcome }}';
            const output = `## 🧪 Test Results

            - ${mark(cli)} CLI tests: \`${cli}\`
            - ${mark(vitest)} Vitest tests: \`${vitest}\`

            For detailed coverage reports, please check the full test workflow.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check for test files
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)
          test_files=$(echo "$changed_files" | grep -E '\.test\.(js|ts)$' || true)

          if [ -z "$test_files" ]; then
            echo "⚠️ Warning: No test files were modified in this PR"
            echo "warning=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Test files found: $test_files"
          fi
