name: IDE Roadmap Live Provider Trajectory

on:
  pull_request:
    paths:
      - ".github/workflows/ide-roadmap-live-provider.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "package.json"
      - "package-lock.json"
      - "tests/fixtures/ide-roadmap/**"
      - "packages/cli/package.json"
      - "packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/src/harness/prompt-compressor.js"
      - "packages/cli/src/harness/structured-handoff.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/__tests__/fixtures/live-provider-trajectory-openai-server.mjs"
      - "packages/cli/__tests__/unit/ide-roadmap-live-provider-trajectory.test.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ide-roadmap-live-provider.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "package.json"
      - "package-lock.json"
      - "tests/fixtures/ide-roadmap/**"
      - "packages/cli/package.json"
      - "packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/src/harness/prompt-compressor.js"
      - "packages/cli/src/harness/structured-handoff.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/__tests__/fixtures/live-provider-trajectory-openai-server.mjs"
      - "packages/cli/__tests__/unit/ide-roadmap-live-provider-trajectory.test.js"
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full commit SHA to test (blank uses selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  LIVE_TRAJECTORY_COMMIT: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  LOOPBACK_RUNS: "100"
  LIVE_PROVIDER_RUNS: "1"

jobs:
  loopback:
    name: "Production trajectory over loopback (${{ matrix.operating-system }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            operating-system: linux
          - runner: windows-latest
            operating-system: windows
          - runner: macos-latest
            operating-system: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact trajectory candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LIVE_TRAJECTORY_COMMIT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Run 100 independent production-path loopback trajectories
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs \
            --mode loopback \
            --runs "${LOOPBACK_RUNS}" \
            --release-commit "${LIVE_TRAJECTORY_COMMIT}" \
            --output "${RUNNER_TEMP}/live-provider-trajectory-loopback-${{ matrix.operating-system }}.json"

      - name: Upload exact-SHA loopback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-provider-trajectory-loopback-${{ matrix.operating-system }}-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-loopback-${{ matrix.operating-system }}.json
          if-no-files-found: error
          retention-days: 30

  loopback-aggregate:
    name: Production trajectory loopback matrix
    if: always()
    needs: loopback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse an incomplete loopback platform matrix
        if: needs.loopback.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one loopback trajectory platform failed or did not finish"
          exit 1

      - name: Checkout exact trajectory candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LIVE_TRAJECTORY_COMMIT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          pattern: live-provider-trajectory-loopback-*-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-loopback-evidence
          merge-multiple: true

      - name: Verify exact HEAD, fixture, three OS cells, run IDs, and redaction
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/live-provider-trajectory-loopback-evidence" \
            --release-commit "${LIVE_TRAJECTORY_COMMIT}" \
            --expected-mode loopback \
            --expected-operating-systems linux,windows,macos \
            --minimum-runs "${LOOPBACK_RUNS}" \
            --output "${RUNNER_TEMP}/live-provider-trajectory-loopback-aggregate.json"

      - name: Upload loopback aggregate
        uses: actions/upload-artifact@v6
        with:
          name: live-provider-trajectory-loopback-aggregate-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-loopback-aggregate.json
          if-no-files-found: error
          retention-days: 90

  live-provider:
    name: Manual or scheduled real-provider trajectory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse a workflow-dispatch commit override
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_COMMIT}" ] && [ "${REQUESTED_COMMIT}" != "${EVENT_COMMIT}" ]; then
            echo "::error::Live-provider secrets may only be used with the workflow event commit"
            exit 1
          fi

      - name: Checkout exact trajectory candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LIVE_TRAJECTORY_COMMIT }}

      - name: Verify the secretless live-provider checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The workflow event is not bound to an exact commit"
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          if [ "${actual_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::The live-provider checkout does not match the workflow event commit"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Run a real-provider trajectory without fallback
        env:
          CC_LLM_API_KEY: ${{ secrets.CC_LLM_API_KEY }}
          CC_LLM_PROVIDER: ${{ vars.CC_LLM_PROVIDER }}
          CC_LLM_MODEL: ${{ vars.CC_LLM_MODEL }}
        run: |
          node packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs \
            --mode live \
            --runs "${LIVE_PROVIDER_RUNS}" \
            --release-commit "${LIVE_TRAJECTORY_COMMIT}" \
            --output "${RUNNER_TEMP}/live-provider-trajectory-live-linux.json"

      - name: Upload success or sanitized failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-provider-trajectory-live-linux-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-live-linux.json
          if-no-files-found: error
          retention-days: 90

  live-provider-verify:
    name: Verify real-provider trajectory (partial release coverage)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.live-provider.result == 'success'
    needs: live-provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trajectory candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.LIVE_TRAJECTORY_COMMIT }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          name: live-provider-trajectory-live-linux-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-live-evidence

      - name: Verify live evidence without claiming the 100-run gate
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/ide-roadmap-live-provider-trajectory.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/live-provider-trajectory-live-evidence" \
            --release-commit "${LIVE_TRAJECTORY_COMMIT}" \
            --expected-mode live \
            --expected-operating-systems linux \
            --minimum-runs "${LIVE_PROVIDER_RUNS}" \
            --output "${RUNNER_TEMP}/live-provider-trajectory-live-aggregate.json"

          if [ "${LIVE_PROVIDER_RUNS}" -ge 100 ]; then
            node packages/cli/scripts/verify-ide-roadmap-fixtures.mjs \
              --verify-runtime-evidence-dir "${RUNNER_TEMP}/live-provider-trajectory-live-evidence" \
              --release-commit "${LIVE_TRAJECTORY_COMMIT}" \
              --case s0-live-provider-trajectory
          fi

      - name: Upload structurally verified live aggregate
        uses: actions/upload-artifact@v6
        with:
          name: live-provider-trajectory-live-aggregate-${{ env.LIVE_TRAJECTORY_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-provider-trajectory-live-aggregate.json
          if-no-files-found: error
          retention-days: 90
