name: CLI Reliability Soak

on:
  pull_request:
    paths:
      - ".github/workflows/cli-reliability-soak.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - ".github/actions/setup-linux-bwrap/action.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/cli/package.json"
      - "packages/cli/bin/chainlesschain.js"
      - "packages/cli/scripts/postinstall.mjs"
      - "packages/cli/scripts/repair-node-pty.mjs"
      - "packages/cli/src/runtime/headless-*.js"
      - "packages/cli/src/runtime/output-backpressure.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/lib/session-runtime-retention.js"
      - "packages/cli/src/lib/background-session-transport.js"
      - "packages/cli/src/commands/background-session.js"
      - "packages/cli/src/runtime/cleanup-deadline.js"
      - "packages/cli/src/runtime/pipe-safety.js"
      - "packages/cli/src/harness/jsonl-session-store.js"
      - "packages/cli/src/lib/session-persistence-failure.js"
      - "packages/cli/src/lib/session-message-fabric.js"
      - "packages/cli/src/lib/session-projection.js"
      - "packages/cli/src/commands/session-message.js"
      - "packages/cli/src/commands/session.js"
      - "packages/cli/src/lib/mcp-stdio-executable-identity.js"
      - "packages/cli/src/lib/mcp-stdio-environment.js"
      - "packages/cli/src/lib/mcp-stdio-native-code-policy.js"
      - "packages/cli/src/lib/mcp-stdio-package-materialization.js"
      - "packages/cli/src/harness/mcp-client.js"
      - "packages/cli/src/commands/mcp.js"
      - "packages/cli/src/lib/mcp-client.js"
      - "packages/cli/src/lib/mcp-oauth.js"
      - "packages/cli/src/lib/mcp-tls.js"
      - "packages/cli/src/lib/mcp-headers-helper.js"
      - "packages/cli/src/runtime/mcp-config.js"
      - "packages/cli/src/lib/paths.js"
      - "packages/cli/src/lib/automation-center-incidents.js"
      - "packages/cli/src/lib/automation-center-runtime.js"
      - "packages/cli/src/lib/automation-center.js"
      - "packages/cli/src/lib/automation-engine.js"
      - "packages/cli/src/lib/automation-execution-authority.js"
      - "packages/cli/src/lib/automation-execution-incident.js"
      - "packages/cli/src/commands/automation.js"
      - "packages/cli/src/lib/scheduler-kernel/**"
      - "packages/cli/scripts/cli-reliability-soak.mjs"
      - "packages/cli/scripts/cli-reliability-mcp-server.mjs"
      - "packages/cli/scripts/cli-mcp-security-soak.mjs"
      - "packages/cli/scripts/verify-mcp-lifecycle-increments.mjs"
      - "packages/cli/scripts/scheduler-reliability-soak.mjs"
      - "packages/cli/scripts/verify-session-message-fabric.mjs"
      - "packages/cli/scripts/verify-session-runtime-retention.mjs"
      - "packages/cli/scripts/ide-roadmap-mcp-security-gate.mjs"
      - "packages/cli/__tests__/unit/cli-reliability-soak.test.js"
      - "packages/cli/__tests__/unit/cli-mcp-security-soak.test.js"
      - "packages/cli/__tests__/unit/mcp-lifecycle-increments.test.js"
      - "packages/cli/__tests__/unit/mcp-oauth.test.js"
      - "packages/cli/__tests__/unit/mcp-client-headers-helper.test.js"
      - "packages/cli/__tests__/unit/mcp-client-rpc-error-sanitization.test.js"
      - "packages/cli/__tests__/unit/mcp-headers-helper-runner.test.js"
      - "packages/cli/__tests__/unit/ide-hot-reconnect.test.js"
      - "packages/cli/__tests__/integration/mcp-materialized-capsule-sandbox-live.test.js"
      - "packages/cli/__tests__/fixtures/mcp-materialized-capsule-live-server.cjs"
      - "packages/cli/__tests__/fixtures/mcp-materialized-capsule-child-contract.cjs"
      - "packages/cli/__tests__/unit/scheduler-reliability-soak.test.js"
      - "packages/cli/__tests__/unit/session-message-fabric.test.js"
      - "packages/cli/__tests__/unit/session-runtime-retention.test.js"
      - "packages/cli/__tests__/unit/background-session-transport.test.js"
      - "packages/cli/__tests__/unit/background-session-command.test.js"
      - "packages/cli/__tests__/unit/session-projection.test.js"
      - "packages/cli/__tests__/unit/vscode-ext-sessions-workbench.test.js"
      - "packages/vscode-extension/src/sessions-workbench.js"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/SessionProjection.java"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/SessionProjectionTest.java"
      - "packages/cli/__tests__/unit/scheduler-kernel-store.test.js"
      - "packages/cli/__tests__/unit/automation-center-incidents.test.js"
      - "packages/cli/__tests__/unit/automation-center-runtime.test.js"
      - "packages/cli/__tests__/unit/automation-center.test.js"
      - "packages/cli/__tests__/unit/automation-engine.test.js"
      - "packages/cli/__tests__/unit/automation-execution-authority.test.js"
      - "packages/cli/__tests__/unit/automation-execution-incident.test.js"
      - "packages/cli/__tests__/unit/scheduler-kernel-*.test.js"
      - "packages/cli/__tests__/unit/vscode-ext-automation-center.test.js"
      - "packages/vscode-extension/src/automation-center.js"
      - "packages/vscode-extension/src/ui/automation-center-view.js"
      - "packages/vscode-extension/test/automation-center.test.cjs"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/AutomationCenter.java"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/intellij/AutomationCenterToolWindowFactory.java"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/AutomationCenterTest.java"
      - "packages/cli/__tests__/unit/repair-node-pty.test.js"
      - "packages/cli/__tests__/unit/mcp-stdio-package-materialization.test.js"
      - "packages/cli/__tests__/unit/mcp-stdio-native-code-policy.test.js"
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full commit SHA to test (blank uses selected ref)"
        required: false
        type: string
      duration_seconds:
        description: "Minimum soak duration on each operating system"
        required: true
        default: "7200"
        type: choice
        options: ["600", "1800", "7200", "14400"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  reliability:
    name: "disk/pipe/TTY/SSH/MCP/resource soak (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      CC_CLI_RELIABILITY_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'formal' }}
      CC_CLI_RELIABILITY_DURATION_SECONDS: ${{ github.event_name == 'pull_request' && '5' || inputs.duration_seconds || '7200' }}
      CC_CLI_RELIABILITY_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      CC_CLI_RELIABILITY_CLEANUP_DEADLINE_MS: "10000"
      CC_CLI_RELIABILITY_MAX_RSS_GROWTH_MB: "128"
      CC_CLI_RELIABILITY_MAX_RESOURCE_GROWTH: "8"
    steps:
      - name: Checkout exact reliability commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Verify macOS node-pty spawn helper is executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          helper="$(node -e 'const path=require("node:path");const root=path.dirname(require.resolve("node-pty/package.json"));process.stdout.write(path.join(root,"prebuilds","darwin-"+process.arch,"spawn-helper"))')"
          if [[ ! -x "${helper}" ]]; then
            ls -l "${helper}"
            echo "node-pty spawn-helper is not executable after CLI postinstall" >&2
            exit 1
          fi
          echo "Verified executable node-pty helper: ${helper}"

      - name: Configure a real localhost SSH TTY
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server
          install -d -m 700 "${HOME}/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "${HOME}/.ssh/cli-reliability"
          cat "${HOME}/.ssh/cli-reliability.pub" >> "${HOME}/.ssh/authorized_keys"
          chmod 600 "${HOME}/.ssh/authorized_keys"
          sudo install -d -m 755 /run/sshd
          sudo /usr/sbin/sshd
          printf 'CC_CLI_RELIABILITY_SSH_TARGET=%s@127.0.0.1\n' "${USER}" >> "${GITHUB_ENV}"
          printf 'CC_CLI_RELIABILITY_SSH_IDENTITY=%s/.ssh/cli-reliability\n' "${HOME}" >> "${GITHUB_ENV}"

      - name: Configure real EROFS and ENOSPC session filesystems
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          disk_root="${RUNNER_TEMP}/cli-reliability-disk"
          erofs_home="${disk_root}/erofs-home"
          enospc_home="${disk_root}/enospc-home"
          install -d -m 700 "${erofs_home}/sessions" "${enospc_home}/sessions"
          owner_uid="$(id -u)"
          owner_gid="$(id -g)"
          sudo mount -t tmpfs -o "size=4m,uid=${owner_uid},gid=${owner_gid},mode=0700" tmpfs "${erofs_home}/sessions"
          sudo mount -o remount,ro "${erofs_home}/sessions"
          sudo mount -t tmpfs -o "size=1m,uid=${owner_uid},gid=${owner_gid},mode=0700" tmpfs "${enospc_home}/sessions"
          set +e
          dd if=/dev/zero of="${enospc_home}/sessions/full" bs=4096 status=none
          fill_status="$?"
          set -e
          if [[ "${fill_status}" -eq 0 ]]; then
            echo "ENOSPC fixture did not fill its tmpfs" >&2
            exit 1
          fi
          printf 'CC_CLI_RELIABILITY_DISK_ROOT=%s\n' "${disk_root}" >> "${GITHUB_ENV}"
          printf 'CC_CLI_RELIABILITY_DISK_EROFS_HOME=%s\n' "${erofs_home}" >> "${GITHUB_ENV}"
          printf 'CC_CLI_RELIABILITY_DISK_ENOSPC_HOME=%s\n' "${enospc_home}" >> "${GITHUB_ENV}"

      - name: Run real CLI reliability gate
        env:
          CC_CLI_RELIABILITY_OUTPUT: ${{ runner.temp }}/cli-reliability-result.json
        run: npm run test:cli-reliability-soak

      - name: Run bounded long-session retention profile
        env:
          CC_SESSION_RUNTIME_OUTPUT: ${{ runner.temp }}/session-runtime-retention.json
        run: npm run test:cli-session-runtime

      - name: Unmount reliability disk fixtures
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -u
          sudo umount "${CC_CLI_RELIABILITY_DISK_EROFS_HOME}/sessions" || true
          sudo umount "${CC_CLI_RELIABILITY_DISK_ENOSPC_HOME}/sessions" || true
          rm -rf -- "${CC_CLI_RELIABILITY_DISK_ROOT}"

      - name: Upload exact-SHA reliability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-reliability-${{ matrix.os }}-${{ env.CC_CLI_RELIABILITY_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-reliability-result.json
            ${{ runner.temp }}/session-runtime-retention.json
          if-no-files-found: error
          retention-days: 30

  session-message-fabric:
    name: "cross-session 32-process durability (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CC_SESSION_MESSAGE_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact cross-session message commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_SESSION_MESSAGE_EXPECTED_SHA }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${CC_SESSION_MESSAGE_EXPECTED_SHA}"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Run 32-process message admission and recovery matrix
        shell: bash
        run: >-
          node packages/cli/scripts/verify-session-message-fabric.mjs
          --release-commit "${CC_SESSION_MESSAGE_EXPECTED_SHA}"
          --output "${RUNNER_TEMP}/session-message-fabric-${RUNNER_OS}.json"

      - name: Upload exact-SHA cross-session message evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: session-message-fabric-${{ matrix.os }}-${{ env.CC_SESSION_MESSAGE_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-message-fabric-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

  session-message-fabric-aggregate:
    name: Cross-session message fabric aggregate
    if: always()
    needs: session-message-fabric
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_SESSION_MESSAGE_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse an incomplete cross-session platform matrix
        if: needs.session-message-fabric.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one cross-session message platform failed or did not finish"
          exit 1

      - name: Checkout exact cross-session message commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_SESSION_MESSAGE_EXPECTED_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Download exact-SHA platform evidence
        uses: actions/download-artifact@v7
        with:
          pattern: session-message-fabric-*-${{ env.CC_SESSION_MESSAGE_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-message-fabric-evidence

      - name: Verify complete Linux, Windows and macOS evidence
        shell: bash
        run: >-
          node packages/cli/scripts/verify-session-message-fabric.mjs
          --verify-evidence-dir "${RUNNER_TEMP}/session-message-fabric-evidence"
          --release-commit "${CC_SESSION_MESSAGE_EXPECTED_SHA}"
          --output "${RUNNER_TEMP}/session-message-fabric-aggregate.json"

      - name: Upload immutable cross-session aggregate
        uses: actions/upload-artifact@v6
        with:
          name: session-message-fabric-formal-aggregate-${{ env.CC_SESSION_MESSAGE_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-message-fabric-aggregate.json
          if-no-files-found: error
          retention-days: 30

  scheduler-reliability-soak:
    name: "scheduler persistence/restart/lease/retry/dedup soak (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      CC_CLI_SCHEDULER_SOAK_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'formal' }}
      CC_CLI_SCHEDULER_SOAK_DURATION_SECONDS: ${{ github.event_name == 'pull_request' && '5' || inputs.duration_seconds || '7200' }}
      CC_CLI_SCHEDULER_SOAK_CYCLES: ${{ github.event_name == 'pull_request' && '3' || '1000' }}
      CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      CC_CLI_SCHEDULER_SOAK_CHECKPOINT_INTERVAL_SECONDS: "30"
    steps:
      - name: Checkout exact scheduler reliability commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Run time-based scheduler persistence and recovery soak
        env:
          CC_CLI_SCHEDULER_SOAK_OUTPUT: ${{ runner.temp }}/scheduler-reliability-soak-${{ runner.os }}.json
        run: npm run test:cli-scheduler-reliability-soak

      - name: Upload exact-SHA scheduler reliability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduler-reliability-soak-${{ runner.os }}-${{ env.CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-reliability-soak-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

  scheduler-reliability-soak-aggregate:
    name: Scheduler reliability soak aggregate
    if: always()
    needs: scheduler-reliability-soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse an incomplete scheduler reliability platform matrix
        if: needs.scheduler-reliability-soak.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one scheduler reliability soak platform failed or did not finish"
          exit 1

      - name: Checkout exact scheduler reliability commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          pattern: scheduler-reliability-soak-*-${{ env.CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-reliability-soak-evidence
          merge-multiple: true

      - name: Verify formal release evidence or isolated non-qualifying PR smoke
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/scheduler-reliability-soak.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/scheduler-reliability-soak-evidence" \
            --release-commit "${CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA}" \
            ${{ github.event_name == 'pull_request' && '--allow-smoke' || '' }} \
            --output "${RUNNER_TEMP}/scheduler-reliability-soak-aggregate.json"

      - name: Upload immutable scheduler reliability soak aggregate
        uses: actions/upload-artifact@v6
        with:
          name: scheduler-reliability-soak-${{ github.event_name == 'pull_request' && 'smoke-non-qualifying' || 'formal-aggregate' }}-${{ env.CC_CLI_SCHEDULER_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-reliability-soak-aggregate.json
          if-no-files-found: error
          retention-days: 90

  mcp-security-soak:
    name: "malicious MCP host/race soak (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      CC_CLI_MCP_SECURITY_SOAK_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'formal' }}
      CC_CLI_MCP_SECURITY_SOAK_DURATION_SECONDS: ${{ github.event_name == 'pull_request' && '5' || inputs.duration_seconds || '7200' }}
      CC_CLI_MCP_SECURITY_SOAK_CYCLES: ${{ github.event_name == 'pull_request' && '2' || '100' }}
      CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      CC_CLI_MCP_SECURITY_SOAK_CHECKPOINT_INTERVAL_SECONDS: "30"
      CC_CLI_MCP_SECURITY_SOAK_EXECUTION_CONTEXT_SAMPLES: ${{ github.event_name == 'pull_request' && '0' || '3' }}
    steps:
      - name: Checkout exact MCP security soak commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/setup-node-deps

      - name: Set up Linux kernel sandbox backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-bwrap

      - name: Run time-based MCP host/race soak with repeated fresh isolates
        env:
          CC_CLI_MCP_SECURITY_SOAK_OUTPUT: ${{ runner.temp }}/cli-mcp-security-soak-${{ runner.os }}.json
          CC_CLI_MCP_SECURITY_SOAK_EXECUTION_CONTEXT_DIR: ${{ runner.temp }}/cli-mcp-execution-context-live-${{ runner.os }}
        run: npm run test:cli-mcp-security-soak

      - name: Run exact-SHA MCP lifecycle compatibility matrix
        shell: bash
        run: >-
          node packages/cli/scripts/verify-mcp-lifecycle-increments.mjs
          --release-commit "${CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA}"
          --output "${RUNNER_TEMP}/mcp-lifecycle-${RUNNER_OS}.json"

      - name: Upload repeated materialized capsule execution-context evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: cli-mcp-execution-context-live-${{ matrix.os }}-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-mcp-execution-context-live-${{ runner.os }}/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload exact-SHA MCP security soak evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-mcp-security-soak-${{ runner.os }}-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-mcp-security-soak-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload exact-SHA MCP lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-lifecycle-${{ runner.os }}-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcp-lifecycle-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90

  mcp-security-soak-aggregate:
    name: Malicious MCP security soak aggregate
    if: always()
    needs: mcp-security-soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse an incomplete MCP security soak platform matrix
        if: needs.mcp-security-soak.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one MCP security soak platform failed or did not finish"
          exit 1

      - name: Checkout exact MCP security soak commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v7
        with:
          pattern: cli-mcp-security-soak-*-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-mcp-security-soak-evidence
          merge-multiple: true

      - name: Download exact-SHA MCP lifecycle evidence
        uses: actions/download-artifact@v7
        with:
          pattern: mcp-lifecycle-*-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcp-lifecycle-evidence
          merge-multiple: true

      - name: Download materialized capsule execution-context evidence
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v7
        with:
          pattern: cli-mcp-execution-context-live-*-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-mcp-execution-context-live-evidence
          merge-multiple: true

      - name: Verify formal exact-SHA platform, duration, and live-boundary evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/cli-mcp-security-soak.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/cli-mcp-security-soak-evidence" \
            --execution-context-evidence-dir "${RUNNER_TEMP}/cli-mcp-execution-context-live-evidence" \
            --release-commit "${CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA}" \
            --output "${RUNNER_TEMP}/cli-mcp-security-soak-aggregate.json"

      - name: Verify isolated non-qualifying PR smoke evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/scripts/cli-mcp-security-soak.mjs \
            --verify-evidence-dir "${RUNNER_TEMP}/cli-mcp-security-soak-evidence" \
            --release-commit "${CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA}" \
            --allow-smoke \
            --output "${RUNNER_TEMP}/cli-mcp-security-soak-aggregate.json"

      - name: Verify complete MCP lifecycle platform matrix
        shell: bash
        run: >-
          node packages/cli/scripts/verify-mcp-lifecycle-increments.mjs
          --verify-evidence-dir "${RUNNER_TEMP}/mcp-lifecycle-evidence"
          --release-commit "${CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA}"
          --output "${RUNNER_TEMP}/mcp-lifecycle-aggregate.json"

      - name: Upload immutable MCP security soak aggregate
        uses: actions/upload-artifact@v6
        with:
          name: cli-mcp-security-soak-${{ github.event_name == 'pull_request' && 'smoke-non-qualifying' || 'formal-aggregate' }}-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-mcp-security-soak-aggregate.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable MCP lifecycle aggregate
        uses: actions/upload-artifact@v6
        with:
          name: mcp-lifecycle-aggregate-${{ env.CC_CLI_MCP_SECURITY_SOAK_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcp-lifecycle-aggregate.json
          if-no-files-found: error
          retention-days: 90
