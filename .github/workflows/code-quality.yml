name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-scope:
    name: Scoped documentation check
    uses: ./.github/workflows/_scoped-docs-check.yml
    permissions:
      contents: read
    with:
      target_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Detect changed files for conditional job execution
  detect-changes:
    needs: [docs-scope]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend-java: ${{ steps.filter.outputs.backend-java }}
      backend-python: ${{ steps.filter.outputs.backend-python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend-java:
              - 'backend/project-service/**'
            backend-python:
              - 'backend/ai-service/**'

  validate-rules:
    needs: [docs-scope]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
    name: Validate Coding Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Run Rules Validator
        working-directory: ./desktop-app-vue
        run: npm run validate:rules
        continue-on-error: false

      - name: Verify canonical Agent stream desktop consumption
        working-directory: ./desktop-app-vue
        run: >-
          npx vitest run
          src/main/ai-engine/code-agent/__tests__/coding-agent-session-service.test.js
          src/main/ai-engine/code-agent/__tests__/app-server-pilot.test.js
          src/main/ai-engine/code-agent/__tests__/coding-agent-ipc-v3.test.js
          src/main/bootstrap/__tests__/coding-agent-bootstrap.test.js

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: validation-report
          path: desktop-app-vue/validation-report.txt
          retention-days: 30

  security-audit:
    needs: [docs-scope]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Run npm audit (informational)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Check for critical vulnerabilities
        run: |
          # Use custom audit check script that handles known unfixable vulnerabilities
          node scripts/audit-check.js --audit-level=critical

  lint-and-format:
    needs: [docs-scope]
    if: ${{ always() && !cancelled() }}
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Enforce exact-source documentation decision
        if: always()
        uses: actions/github-script@v8
        env:
          DOCS_RESULT: ${{ needs.docs-scope.result }}
          DOCS_ONLY: ${{ needs.docs-scope.outputs.docs_only }}
          DOCS_VALIDATED: ${{ needs.docs-scope.outputs.docs_validated }}
          DOCS_TARGET: ${{ needs.docs-scope.outputs.target_sha }}
          EXPECTED_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const e = process.env;
            if (e.DOCS_RESULT !== 'success' || e.DOCS_TARGET !== e.EXPECTED_TARGET ||
                !['true', 'false'].includes(e.DOCS_ONLY) ||
                (e.DOCS_ONLY === 'true' && e.DOCS_VALIDATED !== 'true')) {
              throw new Error('Missing, failed or wrong-source documentation decision');
            }
            await core.summary.addHeading('Required check decision').addRaw(
              e.DOCS_ONLY === 'true'
                ? `Validated scoped documentation and locked Prettier at ${e.DOCS_TARGET}; code tests are not applicable and were not run. This is not a copied prior test result.`
                : `Full code checks required at ${e.DOCS_TARGET}; original job steps follow.`
            ).write();

      - name: Checkout code
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        uses: actions/checkout@v5

      - name: Validate GitHub Actions workflows
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" actionlint
          "${install_dir}/actionlint" -no-color -config-file .github/actionlint.yaml

      - name: Setup Node.js
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies (workspace-aware)
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Check code style
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        working-directory: ./desktop-app-vue
        # No `|| echo`: an ESLint **error** must fail the job so the required
        # "Lint & Format Check" status actually gates merges. As of 2026-06-06
        # the suite is 0 errors / ~2440 warnings — warnings don't fail eslint
        # by default, so this stays green now and only trips on new errors.
        run: npm run lint

  test-database:
    needs: [docs-scope]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
    name: Database Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Run database tests
        working-directory: ./desktop-app-vue
        # No `|| echo` / continue-on-error: a test:db failure must fail the job so
        # the required "Database Tests" status actually gates merges. Verified
        # genuinely green in CI run 27056644357 (2026-06-06) before requiring it.
        run: npm run test:db

  build-check:
    needs: [docs-scope]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            desktop-app-vue/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps
        with:
          install-desktop-app-vue: "true"

      - name: Build main process
        working-directory: ./desktop-app-vue
        run: npm run build:main

      - name: Build renderer
        working-directory: ./desktop-app-vue
        run: npm run build:renderer

      - name: Check build artifacts
        working-directory: ./desktop-app-vue
        run: |
          if [ -f "dist/main/index.js" ]; then
            echo "✅ Main process build successful"
          else
            echo "❌ Main process build failed"
            exit 1
          fi

  # 后端服务检查
  backend-java-check:
    needs: [docs-scope, detect-changes]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' && (needs.detect-changes.outputs.backend-java == 'true' || github.event_name == 'push') }}
    name: Java Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Project Service
        working-directory: ./backend/project-service
        run: mvn clean compile -DskipTests
        continue-on-error: true

      - name: Run tests
        working-directory: ./backend/project-service
        run: mvn test
        continue-on-error: true

  # Python AI 服务检查
  backend-python-check:
    needs: [docs-scope, detect-changes]
    if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' && (needs.detect-changes.outputs.backend-python == 'true' || github.event_name == 'push') }}
    name: Python Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./backend/ai-service
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
        continue-on-error: true

      - name: Lint Python code
        run: |
          pip install flake8
          cd backend/ai-service
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        continue-on-error: true

  # 汇总报告
  quality-gate:
    needs: [docs-scope, validate-rules, security-audit, build-check]
    if: ${{ always() && !cancelled() }}
    name: Quality Gate
    runs-on: ubuntu-latest
    # Continue to fail closed for completed prerequisites, while preserving an
    # operator-requested workflow cancellation as cancelled instead of failure.

    steps:
      - name: Enforce exact-source documentation decision
        if: always()
        uses: actions/github-script@v8
        env:
          DOCS_RESULT: ${{ needs.docs-scope.result }}
          DOCS_ONLY: ${{ needs.docs-scope.outputs.docs_only }}
          DOCS_VALIDATED: ${{ needs.docs-scope.outputs.docs_validated }}
          DOCS_TARGET: ${{ needs.docs-scope.outputs.target_sha }}
          EXPECTED_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const e = process.env;
            if (e.DOCS_RESULT !== 'success' || e.DOCS_TARGET !== e.EXPECTED_TARGET ||
                !['true', 'false'].includes(e.DOCS_ONLY) ||
                (e.DOCS_ONLY === 'true' && e.DOCS_VALIDATED !== 'true')) {
              throw new Error('Missing, failed or wrong-source documentation decision');
            }
            await core.summary.addHeading('Required check decision').addRaw(
              e.DOCS_ONLY === 'true'
                ? `Validated scoped documentation and locked Prettier at ${e.DOCS_TARGET}; code tests are not applicable and were not run. This is not a copied prior test result.`
                : `Full code checks required at ${e.DOCS_TARGET}; original job steps follow.`
            ).write();

      - name: Check quality gate status
        if: ${{ needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'false' }}
        run: |
          if [ "${{ needs.validate-rules.result }}" != "success" ]; then
            echo "❌ Rules validation failed"
            exit 1
          fi

          if [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "⚠️ Security audit has warnings"
          fi

          if [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ Build check failed"
            exit 1
          fi

          echo "✅ Quality gate passed"
