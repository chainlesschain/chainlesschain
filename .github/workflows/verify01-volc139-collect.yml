name: VERIFY01 collect full Volcengine 139 results

on:
  push:
    tags: [verify01-volc139-collect-*]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Prepare operator workspace dependency
        run: >-
          npm ci --workspace @chainlesschain/context-memory-kernel
          --include-workspace-root=false --omit=dev --ignore-scripts
          --legacy-peer-deps --no-audit --no-fund
      - name: Bind collection to the recorded completed model run
        id: round
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const d = JSON.parse(fs.readFileSync('docs/research/cli/verify01-volcengine-139-20261103/dispatch.json', 'utf8'));
          assert.equal(d.submitted, true);
          assert.ok(Number.isSafeInteger(d.runId) && d.runId > 0);
          assert.match(d.source, /^[a-f0-9]{40}$/u);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${d.runId}\nsource=${d.source}\n`);
          NODE
      - name: Collect original deliveries and independent receipts without model credentials or model calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node packages/cli/scripts/verify01-volcengine-fresh-collect.mjs
          --run-id "${{ steps.round.outputs.run_id }}" --source "${{ steps.round.outputs.source }}"
          --output-dir "${{ runner.temp }}/verify01-volc139-collected"
      - name: Preserve full-round report and independent acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-volc139-collected-${{ steps.round.outputs.source }}
          path: ${{ runner.temp }}/verify01-volc139-collected/
          if-no-files-found: error
          retention-days: 14
