name: Product UI Captures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-ui-captures.yml
      - scripts/capture-mobile-product.py

permissions:
  contents: read

concurrency:
  group: product-ui-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Capture published Android product
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download and verify the fixed public APK
        run: python3 scripts/capture-mobile-product.py download
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the unmodified release in a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Exercise Android 12's native splash path. Installation still fails
          # if this image cannot translate the public APK's ARM libraries.
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/capture-mobile-product.py capture
      - name: Save captures and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-product-captures-${{ github.sha }}
          path: .work/product-ui-captures/
          if-no-files-found: error
          retention-days: 30
