name: CLI Native Release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: cli-native-release-stable
  cancel-in-progress: false

env:
  # Keep tag-triggered publication fail-closed until native ARM execution,
  # macOS notarization/Gatekeeper, installer recovery and updater crash tests
  # have produced exact-commit evidence on this workflow.
  CLI_NATIVE_RELEASE_IMPLEMENTATION_STATUS: blocked-pending-native-host-matrix

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Require completed native host release evidence
        shell: bash
        env:
          UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.CLI_UPDATE_ED25519_PRIVATE_KEY_B64 }}
          WINDOWS_CERT_B64: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PASSWORD }}
          MAC_CERT_B64: ${{ secrets.CLI_MACOS_SIGNING_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.CLI_MACOS_SIGNING_CERT_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.CLI_MACOS_SIGNING_IDENTITY }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.CLI_MACOS_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.CLI_MACOS_NOTARY_TEAM_ID }}
          MAC_NOTARY_APP_PASSWORD: ${{ secrets.CLI_MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$CLI_NATIVE_RELEASE_IMPLEMENTATION_STATUS" != "ready" ]; then
            echo "Native CLI publication is blocked pending ARM execution, macOS notarization and transactional updater evidence." >&2
            exit 1
          fi
          for name in \
            UPDATE_PUBLIC_KEY_B64 UPDATE_PRIVATE_KEY_B64 \
            WINDOWS_CERT_B64 WINDOWS_CERT_PASSWORD \
            MAC_CERT_B64 MAC_CERT_PASSWORD MAC_SIGNING_IDENTITY \
            MAC_NOTARY_APPLE_ID MAC_NOTARY_TEAM_ID MAC_NOTARY_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Native CLI publication prerequisite is missing: $name" >&2
              exit 1
            fi
          done

  exact-sha-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
      - name: Verify required three-platform workflows for exact SHA
        run: node packages/cli/scripts/verify-release-gates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CC_RELEASE_GATE_OUTPUT: cli-native-release-gate.json
          CC_RELEASE_GATE_WAIT_MS: "2700000"
          CC_RELEASE_GATE_POLL_MS: "30000"
      - uses: actions/upload-artifact@v6
        with:
          name: cli-native-release-gate-${{ github.sha }}
          path: cli-native-release-gate.json
          if-no-files-found: error
          retention-days: 90

  build:
    needs: [release-readiness, exact-sha-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            file: chainlesschain-node22-linux-x64
            pkg_platform: linux
            platform_signature: sigstore-keyless
            expected_platform: linux
            expected_arch: x64
          - os: ubuntu-24.04-arm
            target: node22-linux-arm64
            file: chainlesschain-node22-linux-arm64
            pkg_platform: linux
            platform_signature: sigstore-keyless
            expected_platform: linux
            expected_arch: arm64
          - os: windows-latest
            target: node22-win-x64
            file: chainlesschain-node22-win-x64.exe
            pkg_platform: win
            platform_signature: authenticode+sigstore
            expected_platform: win32
            expected_arch: x64
          - os: windows-11-arm
            target: node22-win-arm64
            file: chainlesschain-node22-win-arm64.exe
            pkg_platform: win
            platform_signature: authenticode+sigstore
            expected_platform: win32
            expected_arch: arm64
          - os: macos-15-intel
            target: node22-macos-x64
            file: chainlesschain-node22-macos-x64
            pkg_platform: macos
            platform_signature: codesign+notarized+sigstore
            expected_platform: darwin
            expected_arch: x64
          - os: macos-15
            target: node22-macos-arm64
            file: chainlesschain-node22-macos-arm64
            pkg_platform: macos
            platform_signature: codesign+notarized+sigstore
            expected_platform: darwin
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
      - name: Verify real native target host
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { EXPECTED_PLATFORM, EXPECTED_ARCH, EXPECTED_TARGET } = process.env;
          if (process.platform !== EXPECTED_PLATFORM || process.arch !== EXPECTED_ARCH) {
            throw new Error(
              `native target ${EXPECTED_TARGET} requires ${EXPECTED_PLATFORM}/${EXPECTED_ARCH}; runner is ${process.platform}/${process.arch}`,
            );
          }
          process.stdout.write(
            `${EXPECTED_TARGET} host verified: ${process.platform}/${process.arch}\n`,
          );
          NODE
      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps
      - name: Materialize trusted update public key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_PUBLIC_KEY_B64"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PUBLIC_KEY_B64, "base64"))' "$RUNNER_TEMP/cli-update-public-key.pem"
      - name: Require a published pkg base binary
        shell: bash
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}/pkg-cache
        run: |
          node node_modules/@yao-pkg/pkg-fetch/lib-es5/bin.js \
            --node-range node22 \
            --platform "${{ matrix.pkg_platform }}" \
            --arch "${{ matrix.expected_arch }}" \
            --force-fetch
      - name: Build standalone CLI with trusted update key
        shell: bash
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}/pkg-cache
        run: |
          set -euo pipefail
          node packages/cli/bin/chainlesschain.js pack \
            --cwd packages/cli \
            --no-project \
            --targets "${{ matrix.target }}" \
            --output "native-dist/chainlesschain-${{ matrix.target }}" \
            --update-manifest-url "https://github.com/${{ github.repository }}/releases/download/cli-stable/chainlesschain-update.json" \
            --update-public-key "$RUNNER_TEMP/cli-update-public-key.pem" \
            --no-smoke-test

      - name: Authenticode sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_B64: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_B64) { throw "CLI_WINDOWS_SIGNING_CERT_PFX_B64 is required" }
          $cert = Join-Path $env:RUNNER_TEMP "cli-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $cert /p $env:WINDOWS_CERT_PASSWORD "native-dist/${{ matrix.file }}"
          & $signtool.FullName verify /pa /v "native-dist/${{ matrix.file }}"

      - name: Code-sign macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_B64: ${{ secrets.CLI_MACOS_SIGNING_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.CLI_MACOS_SIGNING_CERT_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.CLI_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MAC_CERT_B64"
          test -n "$MAC_SIGNING_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/cli-signing.keychain-db"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CERT_B64, "base64"))' "$RUNNER_TEMP/cli-signing.p12"
          security create-keychain -p temporary "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$RUNNER_TEMP/cli-signing.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --force --timestamp --options runtime --sign "$MAC_SIGNING_IDENTITY" "native-dist/${{ matrix.file }}"
          codesign --verify --strict --verbose=2 "native-dist/${{ matrix.file }}"

      - name: Notarize and assess macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_NOTARY_APPLE_ID: ${{ secrets.CLI_MACOS_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.CLI_MACOS_NOTARY_TEAM_ID }}
          MAC_NOTARY_APP_PASSWORD: ${{ secrets.CLI_MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAC_NOTARY_APPLE_ID"
          test -n "$MAC_NOTARY_TEAM_ID"
          test -n "$MAC_NOTARY_APP_PASSWORD"
          ARTIFACT="native-dist/${{ matrix.file }}"
          ARCHIVE="$RUNNER_TEMP/${{ matrix.file }}.zip"
          RESULT="native-dist/${{ matrix.file }}.notarization.json"
          LOG="native-dist/${{ matrix.file }}.notarization-log.json"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT" "$ARCHIVE"
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$MAC_NOTARY_APPLE_ID" \
            --team-id "$MAC_NOTARY_TEAM_ID" \
            --password "$MAC_NOTARY_APP_PASSWORD" \
            --wait --output-format json > "$RESULT"
          SUBMISSION_ID=$(node --input-type=module - "$RESULT" <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (result.status !== "Accepted" || !/^[0-9a-f-]{36}$/i.test(result.id || "")) {
            throw new Error(`macOS notarization was not accepted: ${JSON.stringify(result)}`);
          }
          process.stdout.write(result.id);
          NODE
          )
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$MAC_NOTARY_APPLE_ID" \
            --team-id "$MAC_NOTARY_TEAM_ID" \
            --password "$MAC_NOTARY_APP_PASSWORD" \
            "$LOG"
          codesign --verify --strict --verbose=2 "$ARTIFACT"
          spctl --assess --type execute --verbose=4 "$ARTIFACT"
          rm -f "$ARCHIVE"

      - uses: sigstore/cosign-installer@v3
      - name: Attach keyless Sigstore signature
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "native-dist/${{ matrix.file }}.sigstore.json" \
            "native-dist/${{ matrix.file }}"
          node packages/cli/scripts/finalize-native-artifact.mjs \
            "native-dist/${{ matrix.file }}" \
            "${{ matrix.target }}" \
            "native-dist/${{ matrix.file }}.sigstore.json" \
            "${{ matrix.platform_signature }}"

      - name: Smoke-test executable on its matching real host
        shell: bash
        run: |
          node --input-type=module - "${{ matrix.target }}" "native-dist/${{ matrix.file }}" <<'NODE'
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          const [target, file] = process.argv.slice(2);
          const os = { linux: "linux", darwin: "macos", win32: "win" }[process.platform];
          const arch = process.arch === "arm64" ? "arm64" : "x64";
          if (target !== `node22-${os}-${arch}`) {
            throw new Error(
              `native artifact ${target} cannot be tested on ${process.platform}/${process.arch}`,
            );
          }
          const executable = path.resolve(file);
          function run(args) {
            const result = spawnSync(executable, args, {
              encoding: "utf8",
              stdio: "pipe",
              windowsHide: true,
            });
            if (result.error || result.status !== 0) {
              throw result.error || new Error(result.stderr || `exit ${result.status}`);
            }
            return String(result.stdout);
          }
          const version = run(["--version"]).trim();
          const status = JSON.parse(run(["status", "--json"]));
          if (status.schema !== "chainlesschain.status.v1" || status.version !== version) {
            throw new Error("native binary status probe returned the wrong schema or version");
          }
          process.stdout.write(`${version}\n`);
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: cli-native-${{ matrix.target }}-${{ github.sha }}
          path: native-dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [release-readiness, exact-sha-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_PRIVATE_KEY_B64: ${{ secrets.CLI_UPDATE_ED25519_PRIVATE_KEY_B64 }}
      UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
      - uses: actions/download-artifact@v6
        with:
          pattern: cli-native-*-${{ github.sha }}
          path: native-assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3

      - name: Create and sign aggregate update manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          test -n "$TAG"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          test "$TAG" = "cli-v$VERSION"
          test -n "$UPDATE_PRIVATE_KEY_B64"
          test -n "$UPDATE_PUBLIC_KEY_B64"
          test "$(find native-assets -name '*.pack-manifest.json' | wc -l)" -eq 6
          test "$(find native-assets -name '*.sigstore.json' | wc -l)" -eq 6
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          PUBLISHED_AT=$(git show -s --format=%cI "${{ github.sha }}")
          npm sbom --package-lock-only --sbom-format cyclonedx > native-assets/chainlesschain-cli-sbom.cdx.json
          # npm's CycloneDX writer emits a wall-clock timestamp and random UUID.
          # Bind both to the exact commit before hashing so an exact-SHA rebuild
          # can reproduce the same SBOM identity instead of looking malicious.
          node --input-type=module - native-assets/chainlesschain-cli-sbom.cdx.json "${{ github.sha }}" "$PUBLISHED_AT" <<'NODE'
          import fs from "node:fs";
          const [file, commit, publishedAt] = process.argv.slice(2);
          const sbom = JSON.parse(fs.readFileSync(file, "utf8"));
          const uuid = Buffer.from(commit.slice(0, 32), "hex");
          if (uuid.length !== 16) throw new Error("release SHA cannot derive SBOM UUID");
          uuid[6] = (uuid[6] & 0x0f) | 0x50;
          uuid[8] = (uuid[8] & 0x3f) | 0x80;
          const hex = uuid.toString("hex");
          sbom.serialNumber = `urn:uuid:${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
          sbom.metadata ||= {};
          sbom.metadata.timestamp = publishedAt;
          fs.writeFileSync(file, `${JSON.stringify(sbom, null, 2)}\n`, "utf8");
          NODE
          SBOM_SHA256=$(sha256sum native-assets/chainlesschain-cli-sbom.cdx.json | cut -d' ' -f1)
          CC_RELEASE_CHANNEL="stable" \
          CC_RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG" \
          CC_RELEASE_SBOM_URL="$BASE_URL/chainlesschain-cli-sbom.cdx.json" \
          CC_RELEASE_SBOM_SHA256="$SBOM_SHA256" \
          CC_RELEASE_REQUIRED_TARGETS="node22-linux-x64,node22-linux-arm64,node22-win-x64,node22-win-arm64,node22-macos-x64,node22-macos-arm64" \
          node packages/cli/scripts/create-native-release-manifest.mjs \
            native-assets native-assets/chainlesschain-update.json "$BASE_URL"
          # Make an exact-commit rebuild capable of producing the same signed
          # manifest identity. Wall-clock time would make every safe retry look
          # like a same-version replacement even when every artifact is equal.
          node --input-type=module - native-assets/chainlesschain-update.json "$PUBLISHED_AT" <<'NODE'
          import fs from "node:fs";
          const [file, publishedAt] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          manifest.latest.publishedAt = publishedAt;
          fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PRIVATE_KEY_B64, "base64"))' "$RUNNER_TEMP/cli-update-private.pem"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PUBLIC_KEY_B64, "base64"))' "native-assets/cli-update-public-key.pem"
          node packages/cli/scripts/sign-pack-update-manifest.mjs \
            native-assets/chainlesschain-update.json "$RUNNER_TEMP/cli-update-private.pem" native-assets/cli-update-public-key.pem
          cp packages/cli/install/install.sh native-assets/install.sh
          cp packages/cli/install/install.ps1 native-assets/install.ps1
          node packages/cli/scripts/generate-package-manager-manifests.mjs \
            native-assets/chainlesschain-update.json native-assets
          cosign sign-blob --yes \
            --bundle native-assets/chainlesschain-update.json.sigstore.json \
            native-assets/chainlesschain-update.json
          for bootstrap in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json; do
            cosign sign-blob --yes --bundle "native-assets/$bootstrap.sigstore.json" "native-assets/$bootstrap"
          done
          (cd native-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cosign sign-blob --yes --bundle native-assets/SHA256SUMS.sigstore.json native-assets/SHA256SUMS

      - name: Publish only after every platform and signature succeeds
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if git rev-parse -q --verify "$TAG^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "${{ github.sha }}"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists but its tag was not checked out" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A versioned release is immutable. Before doing ANY upload for an
            # existing tag, authenticate its complete manifest and require an
            # exact same-version identity. Never repair/replace individual
            # versioned assets in place: a partial release needs a new version
            # (or explicit operator removal while it is still a draft).
            VERSIONED_DIR="$RUNNER_TEMP/cli-versioned-existing"
            VERSIONED_ASSET_DIR="$VERSIONED_DIR/assets"
            mkdir -p "$VERSIONED_ASSET_DIR"
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            HAS_MANIFEST=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json' || true)
            HAS_BUNDLE=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json.sigstore.json' || true)
            if [ "$HAS_MANIFEST" -ne 1 ] || [ "$HAS_BUNDLE" -ne 1 ]; then
              echo "Existing versioned release lacks one complete signed manifest pair; refusing in-place repair" >&2
              exit 1
            fi
            gh release download "$TAG" --dir "$VERSIONED_ASSET_DIR"
            cosign verify-blob \
              --bundle "$VERSIONED_ASSET_DIR/chainlesschain-update.json.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/cli-native-release.yml@refs/tags/cli-v' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$VERSIONED_ASSET_DIR/chainlesschain-update.json" >/dev/null
            VERSIONED_RESULT=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              "$VERSIONED_ASSET_DIR/chainlesschain-update.json" \
              native-assets/chainlesschain-update.json)
            printf '%s\n' "$VERSIONED_RESULT"
            node -e 'const result=JSON.parse(process.argv[1]); if(result.action!=="idempotent") throw new Error(`existing versioned release is not an exact replay: ${result.action}`)' "$VERSIONED_RESULT"
            find native-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$VERSIONED_DIR/expected-assets.txt"
            printf '%s\n' "$ASSETS" | sed '/^$/d' | LC_ALL=C sort > "$VERSIONED_DIR/existing-assets.txt"
            if ! cmp -s "$VERSIONED_DIR/expected-assets.txt" "$VERSIONED_DIR/existing-assets.txt"; then
              echo "Existing versioned release asset set is incomplete or contains unexpected assets" >&2
              diff -u "$VERSIONED_DIR/expected-assets.txt" "$VERSIONED_DIR/existing-assets.txt" >&2 || true
              exit 1
            fi
            while IFS= read -r asset; do
              if ! cmp -s "native-assets/$asset" "$VERSIONED_ASSET_DIR/$asset"; then
                echo "Existing versioned asset bytes differ: $asset" >&2
                exit 1
              fi
            done < "$VERSIONED_DIR/expected-assets.txt"
            echo "Versioned release $TAG is already complete and immutable; no upload needed."
          else
            gh release create "$TAG" --target "${{ github.sha }}" --draft --latest=false --title "ChainlessChain CLI $TAG" --notes "Signed standalone CLI release for exact commit ${{ github.sha }}."
            # Deliberately no overwrite flag: versioned asset names are write-once.
            gh release upload "$TAG" native-assets/*
          fi
          gh release edit "$TAG" --draft=false --latest=false

      - name: Promote signed manifest to isolated stable channel
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL_TAG="cli-stable"
          CHANNEL_DIR="$RUNNER_TEMP/cli-stable-existing"
          CHANNEL_ASSET_DIR="$CHANNEL_DIR/assets"
          mkdir -p "$CHANNEL_ASSET_DIR"
          ASSETS=""
          HAS_MANIFEST=0
          HAS_BUNDLE=0
          PROMOTION_ACTION="initialize"
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            ASSETS=$(gh release view "$CHANNEL_TAG" --json assets --jq '.assets[].name')
            HAS_MANIFEST=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json' || true)
            HAS_BUNDLE=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json.sigstore.json' || true)
            # The recovery protocol publishes the bundle first and the
            # manifest last, so bundle-only is an expected fail-closed state
            # after interruption. Manifest-only can never be produced by this
            # workflow and therefore requires operator investigation.
            if [ "$HAS_MANIFEST" -eq 1 ] && [ "$HAS_BUNDLE" -ne 1 ]; then
              echo "Stable channel has a manifest without its signature bundle" >&2
              exit 1
            fi
            if [ "$HAS_MANIFEST" -eq 1 ] && [ "$HAS_BUNDLE" -eq 1 ]; then
              gh release download "$CHANNEL_TAG" --dir "$CHANNEL_ASSET_DIR"
              cosign verify-blob \
                --bundle "$CHANNEL_ASSET_DIR/chainlesschain-update.json.sigstore.json" \
                --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/cli-native-release.yml@refs/tags/cli-v' \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                "$CHANNEL_ASSET_DIR/chainlesschain-update.json" >/dev/null
              PROMOTION_RESULT=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
                "$CHANNEL_ASSET_DIR/chainlesschain-update.json" \
                native-assets/chainlesschain-update.json)
              printf '%s\n' "$PROMOTION_RESULT"
              PROMOTION_ACTION=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).action)' "$PROMOTION_RESULT")
            else
              # No active manifest means clients fail closed with 404. This is
              # either an empty channel or a recoverable interrupted promotion;
              # all partial assets are purged below before retrying.
              PROMOTION_RESULT=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
                - native-assets/chainlesschain-update.json)
              printf '%s\n' "$PROMOTION_RESULT"
            fi
          else
            gh release create "$CHANNEL_TAG" --target "${{ github.sha }}" \
              --latest=false --title "ChainlessChain CLI stable channel" \
              --notes "Rolling pointer to the latest verified cli-v* manifest. Versioned binaries remain immutable."
            node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              - native-assets/chainlesschain-update.json
          fi
          if [ "$PROMOTION_ACTION" = "idempotent" ]; then
            : > "$CHANNEL_DIR/expected-assets.txt"
            for asset in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json chainlesschain-update.json; do
              printf '%s\n%s\n' "$asset" "$asset.sigstore.json" >> "$CHANNEL_DIR/expected-assets.txt"
            done
            LC_ALL=C sort -o "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/expected-assets.txt"
            printf '%s\n' "$ASSETS" | sed '/^$/d' | LC_ALL=C sort > "$CHANNEL_DIR/existing-assets.txt"
            if ! cmp -s "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/existing-assets.txt"; then
              echo "Stable channel asset set differs from the exact idempotent candidate" >&2
              diff -u "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/existing-assets.txt" >&2 || true
              exit 1
            fi
            while IFS= read -r asset; do
              if ! cmp -s "native-assets/$asset" "$CHANNEL_ASSET_DIR/$asset"; then
                echo "Stable channel asset bytes differ from the exact idempotent candidate: $asset" >&2
                exit 1
              fi
            done < "$CHANNEL_DIR/expected-assets.txt"
            echo "Stable channel already has the exact signed manifest identity; no rolling assets changed."
            exit 0
          fi
          gh release edit "$CHANNEL_TAG" --latest=false

          # GitHub release assets cannot be swapped atomically. Make the
          # transition fail-closed and retryable: remove the active manifest
          # first, purge every old/partial rolling asset, upload auxiliary
          # pairs without clobber, then activate with bundle-first/manifest-last.
          # Any interruption leaves the fixed manifest URL absent (or a lone
          # bundle), never an old manifest mixed with new auxiliary assets.
          if [ "$HAS_MANIFEST" -eq 1 ]; then
            gh release delete-asset "$CHANNEL_TAG" chainlesschain-update.json --yes
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            [ "$asset" = "chainlesschain-update.json" ] && continue
            gh release delete-asset "$CHANNEL_TAG" "$asset" --yes
          done <<EOF
          $ASSETS
          EOF
          for asset in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json; do
            gh release upload "$CHANNEL_TAG" "native-assets/$asset" "native-assets/$asset.sigstore.json"
          done
          gh release upload "$CHANNEL_TAG" \
            native-assets/chainlesschain-update.json.sigstore.json
          gh release upload "$CHANNEL_TAG" \
            native-assets/chainlesschain-update.json
