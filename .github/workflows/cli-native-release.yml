name: CLI Native Release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: cli-native-release-stable
  cancel-in-progress: false

env:
  # Six-target unsigned build/execution evidence exists. Keep tag-triggered
  # publication fail-closed until signing credentials, signed-artifact
  # install/upgrade/rollback, package-manager publication and public readback
  # have produced exact-commit evidence on this workflow.
  CLI_NATIVE_RELEASE_IMPLEMENTATION_STATUS: blocked-pending-signing-and-public-distribution-evidence

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    environment: native-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require completed native host release evidence
        shell: bash
        env:
          UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.CLI_UPDATE_ED25519_PRIVATE_KEY_B64 }}
          WINDOWS_CERT_B64: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PASSWORD }}
          MAC_CERT_B64: ${{ secrets.CLI_MACOS_SIGNING_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.CLI_MACOS_SIGNING_CERT_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.CLI_MACOS_SIGNING_IDENTITY }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.CLI_MACOS_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.CLI_MACOS_NOTARY_TEAM_ID }}
          MAC_NOTARY_APP_PASSWORD: ${{ secrets.CLI_MACOS_NOTARY_APP_PASSWORD }}
          WINDOWS_CERT_SHA256: ${{ vars.CLI_WINDOWS_SIGNING_CERT_SHA256 }}
          WINDOWS_CERT_SUBJECT: ${{ vars.CLI_WINDOWS_SIGNING_CERT_SUBJECT }}
          WINDOWS_CERT_PUBLISHER: ${{ vars.CLI_WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_TIMESTAMP_SUBJECT: ${{ vars.CLI_WINDOWS_TIMESTAMP_SUBJECT }}
          MAC_TEAM_IDENTIFIER: ${{ vars.CLI_MACOS_TEAM_IDENTIFIER }}
          MAC_DEVELOPER_ID_AUTHORITY: ${{ vars.CLI_MACOS_DEVELOPER_ID_AUTHORITY }}
          MAC_DESIGNATED_REQUIREMENT: ${{ vars.CLI_MACOS_DESIGNATED_REQUIREMENT }}
          PREVIOUS_RELEASE_TAG: ${{ vars.CLI_NATIVE_PREVIOUS_TAG }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REPOSITORY" != "chainlesschain/chainlesschain" ] || \
             [ "$RELEASE_REF_PROTECTED" != "true" ]; then
            echo "Native CLI publication requires the trusted repository and a protected cli-v* tag ruleset." >&2
            exit 1
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --input-type=module - "$RELEASE_TAG" "$VERSION" <<'NODE'
          import { assertNativeReleaseIdentity } from "./packages/cli/scripts/native-release-contract.mjs";
          assertNativeReleaseIdentity(process.argv[2], process.argv[3]);
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.test(process.argv[3])) {
            throw new Error("native stable release tags must use x.y.z without prerelease/build metadata");
          }
          NODE
          if [ "$CLI_NATIVE_RELEASE_IMPLEMENTATION_STATUS" != "ready" ]; then
            echo "Native CLI publication is blocked pending signing credentials, notarization, signed install/upgrade/rollback, package-manager publication and public readback evidence." >&2
            exit 1
          fi
          for name in \
            UPDATE_PUBLIC_KEY_B64 UPDATE_PRIVATE_KEY_B64 \
            WINDOWS_CERT_B64 WINDOWS_CERT_PASSWORD \
            MAC_CERT_B64 MAC_CERT_PASSWORD MAC_SIGNING_IDENTITY \
            MAC_NOTARY_APPLE_ID MAC_NOTARY_TEAM_ID MAC_NOTARY_APP_PASSWORD \
            WINDOWS_CERT_SHA256 WINDOWS_CERT_SUBJECT WINDOWS_CERT_PUBLISHER WINDOWS_TIMESTAMP_SUBJECT \
            MAC_TEAM_IDENTIFIER MAC_DEVELOPER_ID_AUTHORITY MAC_DESIGNATED_REQUIREMENT \
            PREVIOUS_RELEASE_TAG; do
            if [ -z "${!name:-}" ]; then
              echo "Native CLI publication prerequisite is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$WINDOWS_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MAC_TEAM_IDENTIFIER" =~ ^[A-Z0-9]{10}$ ]]
          test "$MAC_NOTARY_TEAM_ID" = "$MAC_TEAM_IDENTIFIER"
          node --input-type=module - "$PREVIOUS_RELEASE_TAG" "$VERSION" <<'NODE'
          import { compareVersions } from "./packages/cli/scripts/native-signed-install-gate.mjs";
          const [tag, currentVersion] = process.argv.slice(2);
          const match = /^cli-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/u.exec(tag);
          if (!match || compareVersions(match[1], currentVersion) >= 0) {
            throw new Error("CLI_NATIVE_PREVIOUS_TAG must identify an older stable native release");
          }
          NODE

  exact-sha-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Verify required three-platform workflows for exact SHA
        run: node packages/cli/scripts/verify-release-gates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CC_RELEASE_GATE_OUTPUT: cli-native-release-gate.json
          CC_RELEASE_GATE_WAIT_MS: "2700000"
          CC_RELEASE_GATE_POLL_MS: "30000"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-native-release-gate-${{ github.sha }}
          path: cli-native-release-gate.json
          if-no-files-found: error
          retention-days: 90

  build:
    needs: [release-readiness, exact-sha-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            file: chainlesschain-node22-linux-x64
            pkg_platform: linux
            platform_signature: sigstore-keyless
            expected_platform: linux
            expected_arch: x64
          - os: ubuntu-24.04-arm
            target: node22-linux-arm64
            file: chainlesschain-node22-linux-arm64
            pkg_platform: linux
            platform_signature: sigstore-keyless
            expected_platform: linux
            expected_arch: arm64
          - os: windows-latest
            target: node22-win-x64
            file: chainlesschain-node22-win-x64.exe
            pkg_platform: win
            platform_signature: authenticode+sigstore
            expected_platform: win32
            expected_arch: x64
          - os: windows-11-arm
            target: node22-win-arm64
            file: chainlesschain-node22-win-arm64.exe
            pkg_platform: win
            platform_signature: authenticode+sigstore
            expected_platform: win32
            expected_arch: arm64
          - os: macos-15-intel
            target: node22-macos-x64
            file: chainlesschain-node22-macos-x64
            pkg_platform: macos
            platform_signature: codesign+notarized+sigstore
            expected_platform: darwin
            expected_arch: x64
          - os: macos-15
            target: node22-macos-arm64
            file: chainlesschain-node22-macos-arm64
            pkg_platform: macos
            platform_signature: codesign+notarized+sigstore
            expected_platform: darwin
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    environment: native-production
    permissions:
      contents: read
      id-token: write
    env:
      UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Install exact-lock CLI build dependencies
        shell: bash
        run: npm ci --workspace packages/cli --include-workspace-root=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify real native target host
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected_platform }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { EXPECTED_PLATFORM, EXPECTED_ARCH, EXPECTED_TARGET } = process.env;
          if (process.platform !== EXPECTED_PLATFORM || process.arch !== EXPECTED_ARCH) {
            throw new Error(
              `native target ${EXPECTED_TARGET} requires ${EXPECTED_PLATFORM}/${EXPECTED_ARCH}; runner is ${process.platform}/${process.arch}`,
            );
          }
          process.stdout.write(
            `${EXPECTED_TARGET} host verified: ${process.platform}/${process.arch}\n`,
          );
          NODE
      - name: Materialize trusted update public key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATE_PUBLIC_KEY_B64"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PUBLIC_KEY_B64, "base64"))' "$RUNNER_TEMP/cli-update-public-key.pem"
      - name: Require a published pkg base binary
        shell: bash
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}/pkg-cache
        run: |
          node node_modules/@yao-pkg/pkg-fetch/lib-es5/bin.js \
            --node-range node22 \
            --platform "${{ matrix.pkg_platform }}" \
            --arch "${{ matrix.expected_arch }}" \
            --force-fetch
      - name: Build standalone CLI with trusted update key
        shell: bash
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}/pkg-cache
        run: |
          set -euo pipefail
          node packages/cli/bin/chainlesschain.js pack \
            --cwd packages/cli \
            --no-project \
            --targets "${{ matrix.target }}" \
            --output "native-dist/chainlesschain-${{ matrix.target }}" \
            --update-manifest-url "https://github.com/${{ github.repository }}/releases/download/cli-stable/chainlesschain-update.json" \
            --update-public-key "$RUNNER_TEMP/cli-update-public-key.pem" \
            --no-smoke-test

      - name: Authenticode sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_B64: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.CLI_WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_CERT_SHA256: ${{ vars.CLI_WINDOWS_SIGNING_CERT_SHA256 }}
          WINDOWS_CERT_SUBJECT: ${{ vars.CLI_WINDOWS_SIGNING_CERT_SUBJECT }}
          WINDOWS_CERT_PUBLISHER: ${{ vars.CLI_WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_TIMESTAMP_SUBJECT: ${{ vars.CLI_WINDOWS_TIMESTAMP_SUBJECT }}
        run: |
          if (-not $env:WINDOWS_CERT_B64) { throw "CLI_WINDOWS_SIGNING_CERT_PFX_B64 is required" }
          if ($env:WINDOWS_CERT_SHA256 -notmatch '^[0-9a-f]{64}$' -or -not $env:WINDOWS_CERT_SUBJECT -or -not $env:WINDOWS_CERT_PUBLISHER -or -not $env:WINDOWS_TIMESTAMP_SUBJECT) {
            throw "protected Windows signing policy is incomplete"
          }
          $cert = Join-Path $env:RUNNER_TEMP "cli-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $cert /p $env:WINDOWS_CERT_PASSWORD "native-dist/${{ matrix.file }}"
          & $signtool.FullName verify /pa /v "native-dist/${{ matrix.file }}"
          if ($LASTEXITCODE -ne 0) { throw "signtool verification failed" }
          $signature = Get-AuthenticodeSignature -LiteralPath "native-dist/${{ matrix.file }}"
          $sha256 = $signature.SignerCertificate.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              -not $signature.TimeStamperCertificate -or
              $sha256 -cne $env:WINDOWS_CERT_SHA256 -or
              $signature.SignerCertificate.Subject -cne $env:WINDOWS_CERT_SUBJECT -or
              $publisher -cne $env:WINDOWS_CERT_PUBLISHER -or
              $signature.TimeStamperCertificate.Subject -cne $env:WINDOWS_TIMESTAMP_SUBJECT) {
            throw "Authenticode certificate/timestamp does not match protected policy"
          }

      - name: Code-sign macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_B64: ${{ secrets.CLI_MACOS_SIGNING_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.CLI_MACOS_SIGNING_CERT_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.CLI_MACOS_SIGNING_IDENTITY }}
          MAC_TEAM_IDENTIFIER: ${{ vars.CLI_MACOS_TEAM_IDENTIFIER }}
          MAC_DEVELOPER_ID_AUTHORITY: ${{ vars.CLI_MACOS_DEVELOPER_ID_AUTHORITY }}
          MAC_DESIGNATED_REQUIREMENT: ${{ vars.CLI_MACOS_DESIGNATED_REQUIREMENT }}
        run: |
          set -euo pipefail
          test -n "$MAC_CERT_B64"
          test -n "$MAC_SIGNING_IDENTITY"
          test -n "$MAC_TEAM_IDENTIFIER"
          test -n "$MAC_DEVELOPER_ID_AUTHORITY"
          test -n "$MAC_DESIGNATED_REQUIREMENT"
          KEYCHAIN="$RUNNER_TEMP/cli-signing.keychain-db"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.MAC_CERT_B64, "base64"))' "$RUNNER_TEMP/cli-signing.p12"
          security create-keychain -p temporary "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$RUNNER_TEMP/cli-signing.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --force --timestamp --options runtime --sign "$MAC_SIGNING_IDENTITY" "native-dist/${{ matrix.file }}"
          codesign --verify --strict --verbose=2 "native-dist/${{ matrix.file }}"
          DETAILS=$(codesign -dvvv "native-dist/${{ matrix.file }}" 2>&1)
          TEAM=$(printf '%s\n' "$DETAILS" | sed -n 's/^TeamIdentifier=//p')
          AUTHORITY=$(printf '%s\n' "$DETAILS" | sed -n 's/^Authority=//p' | head -n 1)
          REQUIREMENT=$(codesign -dr - "native-dist/${{ matrix.file }}" 2>&1 | sed -n 's/^designated => //p')
          test "$TEAM" = "$MAC_TEAM_IDENTIFIER"
          test "$AUTHORITY" = "$MAC_DEVELOPER_ID_AUTHORITY"
          test "$REQUIREMENT" = "$MAC_DESIGNATED_REQUIREMENT"

      - name: Notarize and assess macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_NOTARY_APPLE_ID: ${{ secrets.CLI_MACOS_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.CLI_MACOS_NOTARY_TEAM_ID }}
          MAC_NOTARY_APP_PASSWORD: ${{ secrets.CLI_MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAC_NOTARY_APPLE_ID"
          test -n "$MAC_NOTARY_TEAM_ID"
          test -n "$MAC_NOTARY_APP_PASSWORD"
          ARTIFACT="native-dist/${{ matrix.file }}"
          ARCHIVE="$RUNNER_TEMP/${{ matrix.file }}.zip"
          RESULT="native-dist/${{ matrix.file }}.notarization.json"
          LOG="native-dist/${{ matrix.file }}.notarization-log.json"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT" "$ARCHIVE"
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$MAC_NOTARY_APPLE_ID" \
            --team-id "$MAC_NOTARY_TEAM_ID" \
            --password "$MAC_NOTARY_APP_PASSWORD" \
            --wait --output-format json > "$RESULT"
          SUBMISSION_ID=$(node --input-type=module - "$RESULT" <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (result.status !== "Accepted" || !/^[0-9a-f-]{36}$/i.test(result.id || "")) {
            throw new Error(`macOS notarization was not accepted: ${JSON.stringify(result)}`);
          }
          process.stdout.write(result.id);
          NODE
          )
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$MAC_NOTARY_APPLE_ID" \
            --team-id "$MAC_NOTARY_TEAM_ID" \
            --password "$MAC_NOTARY_APP_PASSWORD" \
            "$LOG"
          codesign --verify --strict --verbose=2 "$ARTIFACT"
          spctl --assess --type execute --verbose=4 "$ARTIFACT"
          rm -f "$ARCHIVE"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Attach keyless Sigstore signature
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "native-dist/${{ matrix.file }}.sigstore.json" \
            "native-dist/${{ matrix.file }}"
          node packages/cli/scripts/finalize-native-artifact.mjs \
            "native-dist/${{ matrix.file }}" \
            "${{ matrix.target }}" \
            "native-dist/${{ matrix.file }}.sigstore.json" \
            "${{ matrix.platform_signature }}"

      - name: Smoke-test executable on its matching real host
        shell: bash
        run: |
          node --input-type=module - "${{ matrix.target }}" "native-dist/${{ matrix.file }}" <<'NODE'
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          const [target, file] = process.argv.slice(2);
          const os = { linux: "linux", darwin: "macos", win32: "win" }[process.platform];
          const arch = process.arch === "arm64" ? "arm64" : "x64";
          if (target !== `node22-${os}-${arch}`) {
            throw new Error(
              `native artifact ${target} cannot be tested on ${process.platform}/${process.arch}`,
            );
          }
          const executable = path.resolve(file);
          function run(args) {
            const result = spawnSync(executable, args, {
              encoding: "utf8",
              stdio: "pipe",
              windowsHide: true,
            });
            if (result.error || result.status !== 0) {
              throw result.error || new Error(result.stderr || `exit ${result.status}`);
            }
            return String(result.stdout);
          }
          const version = run(["--version"]).trim();
          const status = JSON.parse(run(["status", "--json"]));
          if (status.schema !== "chainlesschain.status.v1" || status.version !== version) {
            throw new Error("native binary status probe returned the wrong schema or version");
          }
          process.stdout.write(`${version}\n`);
          NODE

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-native-${{ matrix.target }}-${{ github.sha }}
          path: native-dist/
          if-no-files-found: error
          retention-days: 90

  publish-versioned:
    needs: [release-readiness, exact-sha-gate, build]
    runs-on: ubuntu-latest
    environment: native-production
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      UPDATE_PUBLIC_KEY_B64: ${{ vars.CLI_UPDATE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - name: Install exact-lock CLI release dependencies
        run: npm ci --workspace packages/cli --include-workspace-root=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: cli-native-*-${{ github.sha }}
          path: native-assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Create and sign aggregate update manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.CLI_UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --input-type=module - "$TAG" "$VERSION" <<'NODE'
          import { assertNativeReleaseIdentity } from "./packages/cli/scripts/native-release-contract.mjs";
          assertNativeReleaseIdentity(process.argv[2], process.argv[3]);
          NODE
          test -n "$UPDATE_PRIVATE_KEY_B64"
          test -n "$UPDATE_PUBLIC_KEY_B64"
          test "$(find native-assets -name '*.pack-manifest.json' | wc -l)" -eq 6
          test "$(find native-assets -name '*.sigstore.json' | wc -l)" -eq 6
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          PUBLISHED_AT=$(git show -s --format=%cI "${{ github.sha }}")
          # Derive a runtime-only CycloneDX graph from the exact repository
          # lock used by npm ci. This path performs no registry resolution and
          # excludes unreferenced dev/test dependencies by graph reachability.
          SBOM_RESULT=$(node packages/cli/scripts/create-native-release-sbom.mjs \
            package-lock.json packages/cli/package.json "${{ github.sha }}" "$PUBLISHED_AT" \
            native-assets/chainlesschain-cli-sbom.cdx.json)
          node packages/cli/scripts/create-native-release-sbom.mjs \
            package-lock.json packages/cli/package.json "${{ github.sha }}" "$PUBLISHED_AT" \
            "$RUNNER_TEMP/chainlesschain-cli-sbom-rebuild.cdx.json" >/dev/null
          cmp native-assets/chainlesschain-cli-sbom.cdx.json \
            "$RUNNER_TEMP/chainlesschain-cli-sbom-rebuild.cdx.json"
          SBOM_LOCK_SHA256=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).lockSha256)' "$SBOM_RESULT")
          SBOM_RUNTIME_REFS_SHA256=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).runtimeRefsSha256)' "$SBOM_RESULT")
          SBOM_SHA256=$(sha256sum native-assets/chainlesschain-cli-sbom.cdx.json | cut -d' ' -f1)
          CC_RELEASE_CHANNEL="stable" \
          CC_RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG" \
          CC_RELEASE_SBOM_URL="$BASE_URL/chainlesschain-cli-sbom.cdx.json" \
          CC_RELEASE_SBOM_SHA256="$SBOM_SHA256" \
          CC_RELEASE_SBOM_LOCK_SHA256="$SBOM_LOCK_SHA256" \
          CC_RELEASE_SBOM_RUNTIME_REFS_SHA256="$SBOM_RUNTIME_REFS_SHA256" \
          CC_RELEASE_REQUIRED_TARGETS="node22-linux-x64,node22-linux-arm64,node22-win-x64,node22-win-arm64,node22-macos-x64,node22-macos-arm64" \
          node packages/cli/scripts/create-native-release-manifest.mjs \
            native-assets native-assets/chainlesschain-update.json "$BASE_URL"
          # Make an exact-commit rebuild capable of producing the same signed
          # manifest identity. Wall-clock time would make every safe retry look
          # like a same-version replacement even when every artifact is equal.
          node --input-type=module - native-assets/chainlesschain-update.json "$PUBLISHED_AT" <<'NODE'
          import fs from "node:fs";
          const [file, publishedAt] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          manifest.latest.publishedAt = publishedAt;
          fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PRIVATE_KEY_B64, "base64"))' "$RUNNER_TEMP/cli-update-private.pem"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.UPDATE_PUBLIC_KEY_B64, "base64"))' "native-assets/cli-update-public-key.pem"
          node packages/cli/scripts/sign-pack-update-manifest.mjs \
            native-assets/chainlesschain-update.json "$RUNNER_TEMP/cli-update-private.pem" native-assets/cli-update-public-key.pem
          rm -f "$RUNNER_TEMP/cli-update-private.pem"
          cp packages/cli/install/install.sh native-assets/install.sh
          cp packages/cli/install/install.ps1 native-assets/install.ps1
          node packages/cli/scripts/generate-package-manager-manifests.mjs \
            native-assets/chainlesschain-update.json native-assets
          cosign sign-blob --yes \
            --bundle native-assets/chainlesschain-update.json.sigstore.json \
            native-assets/chainlesschain-update.json
          for bootstrap in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.yaml ChainlessChain.ChainlessChainCLI.locale.en-US.yaml ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json; do
            cosign sign-blob --yes --bundle "native-assets/$bootstrap.sigstore.json" "native-assets/$bootstrap"
          done
          (cd native-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cosign sign-blob --yes --bundle native-assets/SHA256SUMS.sigstore.json native-assets/SHA256SUMS

      - name: Publish only after every platform and signature succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --input-type=module - "$TAG" "$VERSION" <<'NODE'
          import { assertNativeReleaseIdentity } from "./packages/cli/scripts/native-release-contract.mjs";
          assertNativeReleaseIdentity(process.argv[2], process.argv[3]);
          NODE
          if git rev-parse -q --verify "$TAG^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "${{ github.sha }}"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists but its tag was not checked out" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A versioned release is immutable. Before doing ANY upload for an
            # existing tag, authenticate its complete manifest and require an
            # exact same-version identity. Never repair/replace individual
            # versioned assets in place: a partial release needs a new version
            # (or explicit operator removal while it is still a draft).
            VERSIONED_DIR="$RUNNER_TEMP/cli-versioned-existing"
            VERSIONED_ASSET_DIR="$VERSIONED_DIR/assets"
            mkdir -p "$VERSIONED_ASSET_DIR"
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            HAS_MANIFEST=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json' || true)
            HAS_BUNDLE=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json.sigstore.json' || true)
            if [ "$HAS_MANIFEST" -ne 1 ] || [ "$HAS_BUNDLE" -ne 1 ]; then
              echo "Existing versioned release lacks one complete signed manifest pair; refusing in-place repair" >&2
              exit 1
            fi
            gh release download "$TAG" --dir "$VERSIONED_ASSET_DIR"
            cosign verify-blob \
              --bundle "$VERSIONED_ASSET_DIR/chainlesschain-update.json.sigstore.json" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/cli-native-release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository '${{ github.repository }}' \
              --certificate-github-workflow-ref "refs/tags/$TAG" \
              --certificate-github-workflow-sha '${{ github.sha }}' \
              --certificate-github-workflow-trigger push \
              "$VERSIONED_ASSET_DIR/chainlesschain-update.json" >/dev/null
            VERSIONED_RESULT=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              "$VERSIONED_ASSET_DIR/chainlesschain-update.json" \
              native-assets/chainlesschain-update.json)
            printf '%s\n' "$VERSIONED_RESULT"
            node -e 'const result=JSON.parse(process.argv[1]); if(result.action!=="idempotent") throw new Error(`existing versioned release is not an exact replay: ${result.action}`)' "$VERSIONED_RESULT"
            find native-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$VERSIONED_DIR/expected-assets.txt"
            printf '%s\n' "$ASSETS" | sed '/^$/d' | LC_ALL=C sort > "$VERSIONED_DIR/existing-assets.txt"
            if ! cmp -s "$VERSIONED_DIR/expected-assets.txt" "$VERSIONED_DIR/existing-assets.txt"; then
              echo "Existing versioned release asset set is incomplete or contains unexpected assets" >&2
              diff -u "$VERSIONED_DIR/expected-assets.txt" "$VERSIONED_DIR/existing-assets.txt" >&2 || true
              exit 1
            fi
            while IFS= read -r asset; do
              if ! cmp -s "native-assets/$asset" "$VERSIONED_ASSET_DIR/$asset"; then
                echo "Existing versioned asset bytes differ: $asset" >&2
                exit 1
              fi
            done < "$VERSIONED_DIR/expected-assets.txt"
            echo "Versioned release $TAG is already complete and immutable; no upload needed."
          else
            gh release create "$TAG" --target "${{ github.sha }}" --draft --latest=false --title "ChainlessChain CLI $TAG" --notes "Signed standalone CLI release for exact commit ${{ github.sha }}."
            # Deliberately no overwrite flag: versioned asset names are write-once.
            gh release upload "$TAG" native-assets/*
          fi
          gh release edit "$TAG" --draft=false --latest=false

      - name: Preserve the exact signed versioned asset set for gated stable promotion
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-native-release-assets-${{ github.sha }}
          path: native-assets/
          if-no-files-found: error
          retention-days: 90

  versioned-public-readback-gate:
    name: Required anonymous versioned readback before stable activation
    needs: publish-versioned
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/cli-native-release-readback.yml
    with:
      tag: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
      verify_stable: false

  signed-install-transaction:
    name: "Signed install/upgrade/rollback (${{ matrix.target }})"
    needs: versioned-public-readback-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            installer: install.sh
          - os: ubuntu-24.04-arm
            target: node22-linux-arm64
            installer: install.sh
          - os: windows-latest
            target: node22-win-x64
            installer: install.ps1
          - os: windows-11-arm
            target: node22-win-arm64
            installer: install.ps1
          - os: macos-15-intel
            target: node22-macos-x64
            installer: install.sh
          - os: macos-15
            target: node22-macos-arm64
            installer: install.sh
    runs-on: ${{ matrix.os }}
    environment: native-production
    permissions:
      contents: read
    env:
      CURRENT_TAG: ${{ github.ref_name }}
      PREVIOUS_TAG: ${{ vars.CLI_NATIVE_PREVIOUS_TAG }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      INSTALLER_NAME: ${{ matrix.installer }}
      NATIVE_TARGET: ${{ matrix.target }}
      EVIDENCE_FILE: ${{ runner.temp }}/native-signed-install-${{ matrix.target }}.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Download and authenticate the public versioned installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --input-type=module - "$CURRENT_TAG" "$VERSION" <<'NODE'
          import { assertNativeReleaseIdentity } from "./packages/cli/scripts/native-release-contract.mjs";
          assertNativeReleaseIdentity(process.argv[2], process.argv[3]);
          NODE
          test -n "$PREVIOUS_TAG"
          BASE_URL="https://github.com/$RELEASE_REPOSITORY/releases/download/$CURRENT_TAG"
          INSTALLER_PATH="$RUNNER_TEMP/$INSTALLER_NAME"
          BUNDLE_PATH="$INSTALLER_PATH.sigstore.json"
          curl --proto '=https' --tlsv1.2 -fL "$BASE_URL/$INSTALLER_NAME" -o "$INSTALLER_PATH"
          curl --proto '=https' --tlsv1.2 -fL "$BASE_URL/$INSTALLER_NAME.sigstore.json" -o "$BUNDLE_PATH"
          cosign verify-blob \
            --bundle "$BUNDLE_PATH" \
            --certificate-identity "https://github.com/$RELEASE_REPOSITORY/.github/workflows/cli-native-release.yml@refs/tags/$CURRENT_TAG" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository "$RELEASE_REPOSITORY" \
            --certificate-github-workflow-ref "refs/tags/$CURRENT_TAG" \
            --certificate-github-workflow-sha "$RELEASE_COMMIT" \
            --certificate-github-workflow-trigger push \
            "$INSTALLER_PATH" >/dev/null
          printf 'CC_NATIVE_PUBLIC_INSTALLER=%s\n' "$INSTALLER_PATH" >> "$GITHUB_ENV"

      - name: Prove signed fresh install, upgrade, and crash rollback
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node packages/cli/scripts/native-signed-install-gate.mjs \
            --installer "$CC_NATIVE_PUBLIC_INSTALLER" \
            --target "$NATIVE_TARGET" \
            --repository "$RELEASE_REPOSITORY" \
            --release-commit "$RELEASE_COMMIT" \
            --current-tag "$CURRENT_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --expected-version "$VERSION" \
            --output "$EVIDENCE_FILE"

      - name: Upload exact signed-install transaction evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-native-signed-install-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-signed-install-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

  signed-install-aggregate:
    name: Aggregate six-target signed install transactions
    needs: signed-install-transaction
    runs-on: ubuntu-latest
    environment: native-production
    permissions:
      contents: read
    env:
      CURRENT_TAG: ${{ github.ref_name }}
      PREVIOUS_TAG: ${{ vars.CLI_NATIVE_PREVIOUS_TAG }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      EVIDENCE_ROOT: ${{ runner.temp }}/native-signed-install-evidence
      AGGREGATE_FILE: ${{ runner.temp }}/native-signed-install-aggregate.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: cli-native-signed-install-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-signed-install-evidence
          merge-multiple: true

      - name: Verify one complete trusted workflow attempt
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node packages/cli/scripts/native-signed-install-gate.mjs \
            --verify-evidence-dir "$EVIDENCE_ROOT" \
            --repository "$RELEASE_REPOSITORY" \
            --release-commit "$RELEASE_COMMIT" \
            --current-tag "$CURRENT_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --expected-version "$VERSION" \
            --output "$AGGREGATE_FILE"

      - name: Upload immutable signed-install aggregate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-native-signed-install-aggregate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-signed-install-aggregate.json
          if-no-files-found: error
          retention-days: 90

  promote-stable:
    name: Promote verified versioned bytes to the stable pointer
    needs: signed-install-aggregate
    runs-on: ubuntu-latest
    environment: native-production
    outputs:
      mutation_started: ${{ steps.stable-activation.outputs.mutation_started }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: chainlesschain/chainlesschain
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.14.0"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cli-native-release-assets-${{ github.sha }}
          path: native-assets
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Authenticate the previous stable pointer and plan promotion
        id: stable-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --input-type=module - "$TAG" "$VERSION" <<'NODE'
          import { assertNativeReleaseIdentity } from "./packages/cli/scripts/native-release-contract.mjs";
          assertNativeReleaseIdentity(process.argv[2], process.argv[3]);
          NODE
          CHANNEL_TAG="cli-stable"
          CHANNEL_DIR="$RUNNER_TEMP/cli-stable-existing"
          CHANNEL_ASSET_DIR="$CHANNEL_DIR/assets"
          mkdir -p "$CHANNEL_ASSET_DIR"
          ASSETS=""
          HAS_MANIFEST=0
          HAS_BUNDLE=0
          CHANNEL_EXISTS=false
          PROMOTION_ACTION="initialize"
          CHANNEL_METADATA="$CHANNEL_DIR/release.json"
          CHANNEL_LOOKUP_ERROR="$CHANNEL_DIR/release-lookup.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHANNEL_TAG" \
            > "$CHANNEL_METADATA" 2> "$CHANNEL_LOOKUP_ERROR"; then
            CHANNEL_EXISTS=true
            ASSETS=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const names=Array.isArray(r.assets)?r.assets.map((a)=>a?.name):[]; if(r.tag_name!==process.argv[2]||!Array.isArray(r.assets)||names.some((name)=>typeof name!=="string"||!/^[A-Za-z0-9][A-Za-z0-9._+-]*$/.test(name))||new Set(names).size!==names.length) throw new Error("stable release metadata is invalid"); process.stdout.write(names.join("\n"))' "$CHANNEL_METADATA" "$CHANNEL_TAG")
            HAS_MANIFEST=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json' || true)
            HAS_BUNDLE=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json.sigstore.json' || true)
            # Never infer an empty channel from an interrupted rolling update.
            # Without a complete authenticated previous pointer there is no
            # trusted version floor, so automatic retry could downgrade stable.
            if [ "$HAS_MANIFEST" -ne 1 ] || [ "$HAS_BUNDLE" -ne 1 ]; then
              echo "Existing stable channel lacks one complete signed manifest pair; restore or remove the cli-stable release under operator control before retrying" >&2
              exit 1
            fi
            gh release download "$CHANNEL_TAG" --dir "$CHANNEL_ASSET_DIR"

            # The previous stable manifest is only an identity selector until
            # Cosign authenticates it. Bind that old bundle to its own stable
            # version, remote tag commit, workflow ref/SHA, repository and push
            # trigger; never reuse the candidate tag/SHA for old bytes.
            OLD_IDENTITY_JSON=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              --signing-identity "$CHANNEL_ASSET_DIR/chainlesschain-update.json")
            OLD_REPOSITORY=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).repository)' "$OLD_IDENTITY_JSON")
            OLD_TAG=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$OLD_IDENTITY_JSON")
            OLD_REF=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ref)' "$OLD_IDENTITY_JSON")
            OLD_COMMIT=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).commit)' "$OLD_IDENTITY_JSON")
            OLD_IDENTITY=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).identity)' "$OLD_IDENTITY_JSON")
            test "$OLD_REPOSITORY" = "$GITHUB_REPOSITORY"
            git fetch --no-tags --force "https://github.com/$OLD_REPOSITORY.git" "$OLD_REF"
            REMOTE_OLD_COMMIT=$(git rev-parse "FETCH_HEAD^{commit}")
            if [ "$REMOTE_OLD_COMMIT" != "$OLD_COMMIT" ]; then
              echo "Existing stable manifest commit does not match remote $OLD_TAG" >&2
              exit 1
            fi
            cosign verify-blob \
              --bundle "$CHANNEL_ASSET_DIR/chainlesschain-update.json.sigstore.json" \
              --certificate-identity "$OLD_IDENTITY" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "$OLD_REPOSITORY" \
              --certificate-github-workflow-ref "$OLD_REF" \
              --certificate-github-workflow-sha "$OLD_COMMIT" \
              --certificate-github-workflow-trigger push \
              "$CHANNEL_ASSET_DIR/chainlesschain-update.json" >/dev/null
            PROMOTION_RESULT=$(node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              "$CHANNEL_ASSET_DIR/chainlesschain-update.json" \
              native-assets/chainlesschain-update.json)
            printf '%s\n' "$PROMOTION_RESULT"
            PROMOTION_ACTION=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).action)' "$PROMOTION_RESULT")
          else
            if ! grep -q 'HTTP 404' "$CHANNEL_LOOKUP_ERROR"; then
              cat "$CHANNEL_LOOKUP_ERROR" >&2
              echo "Stable channel lookup failed without an authoritative not-found response" >&2
              exit 1
            fi
            node packages/cli/scripts/verify-stable-channel-promotion.mjs \
              - native-assets/chainlesschain-update.json
          fi
          printf '%s\n' "$ASSETS" | sed '/^$/d' > "$CHANNEL_DIR/assets-before.txt"
          if [ "$PROMOTION_ACTION" = "idempotent" ]; then
            : > "$CHANNEL_DIR/expected-assets.txt"
            for asset in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.yaml ChainlessChain.ChainlessChainCLI.locale.en-US.yaml ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json chainlesschain-update.json; do
              printf '%s\n%s\n' "$asset" "$asset.sigstore.json" >> "$CHANNEL_DIR/expected-assets.txt"
            done
            LC_ALL=C sort -o "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/expected-assets.txt"
            printf '%s\n' "$ASSETS" | sed '/^$/d' | LC_ALL=C sort > "$CHANNEL_DIR/existing-assets.txt"
            if ! cmp -s "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/existing-assets.txt"; then
              echo "Stable channel asset set differs from the exact idempotent candidate" >&2
              diff -u "$CHANNEL_DIR/expected-assets.txt" "$CHANNEL_DIR/existing-assets.txt" >&2 || true
              exit 1
            fi
            while IFS= read -r asset; do
              if ! cmp -s "native-assets/$asset" "$CHANNEL_ASSET_DIR/$asset"; then
                echo "Stable channel asset bytes differ from the exact idempotent candidate: $asset" >&2
                exit 1
              fi
            done < "$CHANNEL_DIR/expected-assets.txt"
            echo "Stable channel already has the exact signed manifest identity; no rolling assets changed."
            echo "action=idempotent" >> "$GITHUB_OUTPUT"
            echo "channel_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "action=$PROMOTION_ACTION" >> "$GITHUB_OUTPUT"
          echo "channel_exists=$CHANNEL_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Activate the preflighted stable pointer
        id: stable-activation
        if: steps.stable-preflight.outputs.action != 'idempotent'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          PROMOTION_ACTION: ${{ steps.stable-preflight.outputs.action }}
          CHANNEL_EXISTS: ${{ steps.stable-preflight.outputs.channel_exists }}
        run: |
          set -euo pipefail
          CHANNEL_TAG="cli-stable"
          CHANNEL_DIR="$RUNNER_TEMP/cli-stable-existing"
          case "$PROMOTION_ACTION:$CHANNEL_EXISTS" in
            initialize:false|promote:true) ;;
            *) echo "Stable activation received an invalid preflight plan" >&2; exit 1 ;;
          esac
          # Persist this output before the first remote mutation. If any API
          # call has an outcome-unknown failure, the containment job withdraws
          # any active manifest before the workflow can terminate.
          echo "mutation_started=true" >> "$GITHUB_OUTPUT"
          if [ "$PROMOTION_ACTION" = "initialize" ]; then
            gh release create "$CHANNEL_TAG" --target "$RELEASE_COMMIT" \
              --latest=false --title "ChainlessChain CLI stable channel" \
              --notes "Rolling pointer to the latest verified cli-v* manifest. Versioned binaries remain immutable."
          else
            gh release edit "$CHANNEL_TAG" --latest=false
            gh release delete-asset "$CHANNEL_TAG" chainlesschain-update.json --yes
          fi

          # GitHub release assets cannot be swapped atomically. Make the
          # transition fail-closed: remove the active manifest
          # first, purge every old/partial rolling asset, upload auxiliary
          # pairs without clobber, then activate with bundle-first/manifest-last.
          # Any interruption leaves the fixed manifest URL absent (or a lone
          # bundle), never an old manifest mixed with new auxiliary assets. A
          # subsequent run refuses that incomplete state until an operator
          # restores a trusted pair or removes the rolling release explicitly.
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            [ "$asset" = "chainlesschain-update.json" ] && continue
            gh release delete-asset "$CHANNEL_TAG" "$asset" --yes
          done < "$CHANNEL_DIR/assets-before.txt"
          for asset in install.sh install.ps1 chainlesschain.rb ChainlessChain.ChainlessChainCLI.yaml ChainlessChain.ChainlessChainCLI.locale.en-US.yaml ChainlessChain.ChainlessChainCLI.installer.yaml cli-update-public-key.pem chainlesschain-cli-sbom.cdx.json; do
            gh release upload "$CHANNEL_TAG" "native-assets/$asset" "native-assets/$asset.sigstore.json"
          done
          gh release upload "$CHANNEL_TAG" \
            native-assets/chainlesschain-update.json.sigstore.json
          gh release upload "$CHANNEL_TAG" \
            native-assets/chainlesschain-update.json

  stable-public-readback-gate:
    name: Required anonymous stable readback after activation
    needs: promote-stable
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/cli-native-release-readback.yml
    with:
      tag: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
      verify_stable: true

  stable-readback-failure-containment:
    name: Withdraw active stable manifest when activation or readback fails
    needs: [promote-stable, stable-public-readback-gate]
    if: ${{ always() && needs.promote-stable.outputs.mutation_started == 'true' && (needs.promote-stable.result != 'success' || needs.stable-public-readback-gate.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove any potentially active unverified stable pointer and fail closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chainlesschain/chainlesschain"
          test "$GITHUB_REF_PROTECTED" = "true"
          [[ "$GITHUB_REF" =~ ^refs/tags/cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          CHANNEL_TAG="cli-stable"
          if ! ASSETS=$(gh release view "$CHANNEL_TAG" --json assets --jq '.assets[].name'); then
            echo "Stable activation/readback failed before a rolling release could be inspected; no active pointer is trusted." >&2
            exit 1
          fi
          HAS_MANIFEST=$(printf '%s\n' "$ASSETS" | grep -cx 'chainlesschain-update.json' || true)
          if [ "$HAS_MANIFEST" -eq 1 ]; then
            mkdir -p "$RUNNER_TEMP/containment-versioned" "$RUNNER_TEMP/containment-stable"
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/containment-versioned" \
              --pattern chainlesschain-update.json
            gh release download "$CHANNEL_TAG" --dir "$RUNNER_TEMP/containment-stable" \
              --pattern chainlesschain-update.json
            if ! cmp -s \
              "$RUNNER_TEMP/containment-versioned/chainlesschain-update.json" \
              "$RUNNER_TEMP/containment-stable/chainlesschain-update.json"; then
              echo "cli-stable changed outside this transaction; refusing to withdraw another release pointer" >&2
              exit 1
            fi
            gh release delete-asset "$CHANNEL_TAG" chainlesschain-update.json --yes
            echo "Stable activation/readback failed; the active cli-stable manifest was withdrawn." >&2
          elif [ "$HAS_MANIFEST" -eq 0 ]; then
            echo "Stable activation/readback failed; cli-stable already has no active manifest." >&2
          else
            echo "Stable activation/readback failed and cli-stable has an ambiguous manifest set." >&2
          fi
          exit 1
