name: Desktop Signed Skill Qualification

on:
  push:
    paths:
      - ".github/workflows/desktop-signed-skill-qualification.yml"
      - ".github/workflows/desktop-signed-skill-platform.yml"
      - "desktop-app-vue/electron-builder.yml"
      - "desktop-app-vue/build/entitlements.mac*.plist"
      - "desktop-app-vue/scripts/create-signed-desktop-skill-evidence.mjs"
      - "desktop-app-vue/scripts/record-signed-desktop-install.mjs"
      - "desktop-app-vue/scripts/record-signed-desktop-signature.mjs"
      - "desktop-app-vue/scripts/signed-desktop-skill-journey.mjs"
      - "desktop-app-vue/scripts/verify-signed-desktop-skill-matrix.mjs"
      - "desktop-app-vue/scripts/verify-signed-desktop-workflow-trust.mjs"
      - "desktop-app-vue/src/main/signed-desktop-launch-probe.js"
      - "desktop-app-vue/src/main/__tests__/signed-desktop-launch-probe.test.js"
      - "desktop-app-vue/scripts/__tests__/verify-signed-desktop-skill-matrix.test.mjs"
      - "desktop-app-vue/scripts/__tests__/create-signed-desktop-skill-evidence.test.mjs"
      - "desktop-app-vue/scripts/__tests__/verify-signed-desktop-workflow-trust.test.mjs"
      - "scripts/verify-github-live-main.mjs"
      - "scripts/__tests__/verify-github-live-main.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/desktop-signed-skill-qualification.yml"
      - ".github/workflows/desktop-signed-skill-platform.yml"
      - "desktop-app-vue/electron-builder.yml"
      - "desktop-app-vue/build/entitlements.mac*.plist"
      - "desktop-app-vue/scripts/create-signed-desktop-skill-evidence.mjs"
      - "desktop-app-vue/scripts/record-signed-desktop-install.mjs"
      - "desktop-app-vue/scripts/record-signed-desktop-signature.mjs"
      - "desktop-app-vue/scripts/signed-desktop-skill-journey.mjs"
      - "desktop-app-vue/scripts/verify-signed-desktop-skill-matrix.mjs"
      - "desktop-app-vue/scripts/verify-signed-desktop-workflow-trust.mjs"
      - "desktop-app-vue/src/main/signed-desktop-launch-probe.js"
      - "desktop-app-vue/src/main/__tests__/signed-desktop-launch-probe.test.js"
      - "desktop-app-vue/scripts/__tests__/verify-signed-desktop-skill-matrix.test.mjs"
      - "desktop-app-vue/scripts/__tests__/create-signed-desktop-skill-evidence.test.mjs"
      - "desktop-app-vue/scripts/__tests__/verify-signed-desktop-workflow-trust.test.mjs"
      - "scripts/verify-github-live-main.mjs"
      - "scripts/__tests__/verify-github-live-main.test.mjs"
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit shared by all three platform evidence records
        required: true
        type: string
      platform_workflow_ref:
        description: Trusted producer workflow ref recorded in platform evidence
        required: true
        type: string
      evidence_run_id:
        description: Producer run ID; empty uses the current caller run
        required: false
        type: string
        default: ""
      evidence_run_attempt:
        description: Producer run attempt; empty uses the current caller attempt
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
        type: string
      platform_workflow_ref:
        description: Trusted producer workflow ref recorded in platform evidence
        required: true
        type: string
      evidence_run_id:
        description: Completed Desktop platform producer run ID
        required: true
        type: string
      evidence_run_attempt:
        description: Exact attempt of the completed Desktop platform producer run
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-signed-skill-qualification-${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && 'authoritative' || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate qualification contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.12.0

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run verifier self-tests
        run: |
          node --test \
            scripts/__tests__/verify-github-live-main.test.mjs \
            desktop-app-vue/scripts/__tests__/verify-signed-desktop-skill-matrix.test.mjs \
            desktop-app-vue/scripts/__tests__/create-signed-desktop-skill-evidence.test.mjs \
            desktop-app-vue/scripts/__tests__/verify-signed-desktop-workflow-trust.test.mjs

  aggregate:
    name: Require trusted Linux, macOS, and Windows evidence
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Validate exact commit input
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_REF: ${{ inputs.platform_workflow_ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "$SOURCE_SHA"
          test "$SOURCE_REF" = "refs/heads/main"
          test "$REF_PROTECTED" = "true"
          [[ "${EVIDENCE_RUN_ID:-$CURRENT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVIDENCE_RUN_ATTEMPT:-$CURRENT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_WORKFLOW_REF" = \
            "$EXPECTED_REPOSITORY/.github/workflows/desktop-signed-skill-platform.yml@refs/heads/main" || {
            echo "untrusted Desktop platform workflow ref" >&2
            exit 1
          }
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$main_sha" = "$EXPECTED_SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup pinned Node.js for trust verification
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"

      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify protected live main after candidate checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-github-live-main.mjs
          --expected-sha "${{ inputs.commit_sha }}"
          --event-sha "${{ github.sha }}"
          --event-ref "${{ github.ref }}"
          --ref-protected "${{ github.ref_protected }}"
          --repository "${{ github.repository }}"
          --server-url "${{ github.server_url }}"
          --api-url "${{ github.api_url }}"

      - name: Verify producer run identity
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id || github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt || github.run_attempt }}
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/desktop-producer-run.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}" \
            > "$run_file"
          chmod a-w "$run_file"
          require_success=false
          if [ "$SOURCE_RUN_ID" != "$GITHUB_RUN_ID" ]; then
            require_success=true
          fi
          node desktop-app-vue/scripts/verify-signed-desktop-workflow-trust.mjs \
            verify-run --run "$run_file" \
            --commit "$EXPECTED_SHA" --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --require-success "$require_success"

      - name: Download same-run signed Desktop evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-signed-skill-evidence-*-${{ inputs.evidence_run_attempt || github.run_attempt }}-${{ inputs.commit_sha }}
          path: signed-desktop-evidence
          run-id: ${{ inputs.evidence_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify each platform evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id || github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt || github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find signed-desktop-evidence -type f -name '*.json' -print | sort)
          test "${#evidence_files[@]}" -eq 3
          signer="${GITHUB_SERVER_URL#*://}/${GITHUB_REPOSITORY}/.github/workflows/desktop-signed-skill-platform.yml"
          require_success=false
          if [ "$SOURCE_RUN_ID" != "$GITHUB_RUN_ID" ]; then
            require_success=true
          fi
          index=0
          for evidence_file in "${evidence_files[@]}"; do
            attestation_file="$RUNNER_TEMP/desktop-attestation-$index.json"
            gh attestation verify "$evidence_file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --signer-digest "$EXPECTED_SHA" \
              --source-ref refs/heads/main \
              --source-digest "$EXPECTED_SHA" \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --deny-self-hosted-runners \
              --format json > "$attestation_file"
            chmod a-w "$attestation_file"
            node desktop-app-vue/scripts/verify-signed-desktop-workflow-trust.mjs \
              verify-attestation --attestation "$attestation_file" \
              --run "$RUNNER_TEMP/desktop-producer-run.json" \
              --commit "$EXPECTED_SHA" --repository "$GITHUB_REPOSITORY" \
              --server-url "$GITHUB_SERVER_URL" --run-id "$SOURCE_RUN_ID" \
              --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --require-success "$require_success"
            index=$((index + 1))
          done

      - name: Aggregate exact-SHA qualification evidence
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_REF: ${{ inputs.platform_workflow_ref }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id || github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt || github.run_attempt }}
        run: |
          set -euo pipefail
          node desktop-app-vue/scripts/verify-signed-desktop-skill-matrix.mjs \
            --verify-evidence-dir signed-desktop-evidence \
            --expected-sha "$EXPECTED_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --workflow-ref "$EXPECTED_WORKFLOW_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --output signed-desktop-matrix.json

      - name: Upload aggregate matrix
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-signed-skill-matrix-${{ inputs.commit_sha }}-${{ github.run_attempt }}
          path: signed-desktop-matrix.json
          if-no-files-found: error
          retention-days: 30

      - name: Revalidate protected live main before aggregate attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-github-live-main.mjs
          --expected-sha "${{ inputs.commit_sha }}"
          --event-sha "${{ github.sha }}"
          --event-ref "${{ github.ref }}"
          --ref-protected "${{ github.ref_protected }}"
          --repository "${{ github.repository }}"
          --server-url "${{ github.server_url }}"
          --api-url "${{ github.api_url }}"

      - name: Attest aggregate matrix to this workflow identity
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: signed-desktop-matrix.json
