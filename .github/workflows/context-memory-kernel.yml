name: Context Memory Kernel CI

on:
  workflow_dispatch:
  push:
    # Release tags use their dedicated publishing workflows.
    branches: ["**"]
    paths:
      - ".github/workflows/context-memory-*.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "scripts/lib/verify01-gradle-bootstrap.mjs"
      - "scripts/lib/verify01-diagnostic-process.mjs"
      - "scripts/__tests__/verify01-gradle-bootstrap.test.mjs"
      - "packages/context-memory-kernel/**"
      - "packages/agent-protocol/**"
      - "packages/agent-sdk/**"
      - "packages/agent-sdk-python/**"
      - "packages/session-core/lib/**"
      - "packages/cli/src/**"
      - "packages/cli/test-node/context-memory-kernel.node-test.mjs"
      - "packages/cli/test-node/local-memory-semantic.node-test.mjs"
      - "packages/cli/test-node/fixtures/context-memory-crash-child.mjs"
      - "packages/cli/test-node/fixtures/context-memory-compaction-restart-child.mjs"
      - "desktop-app-vue/package.json"
      - "desktop-app-vue/src/**"
      - "desktop-app-vue/vitest.context-memory.config.mjs"
      - "packages/vscode-extension/src/**"
      - "packages/vscode-extension/test/app-server-pilot.test.cjs"
      - "packages/vscode-extension/test/context-memory-authority.test.cjs"
      - "packages/jetbrains-plugin/src/main/**"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/ContextMemoryProjectionTest.java"
  pull_request:
    paths:
      - ".github/workflows/context-memory-*.yml"
      - ".github/actions/setup-node-deps/action.yml"
      - "scripts/lib/verify01-gradle-bootstrap.mjs"
      - "scripts/lib/verify01-diagnostic-process.mjs"
      - "scripts/__tests__/verify01-gradle-bootstrap.test.mjs"
      - "packages/context-memory-kernel/**"
      - "packages/agent-protocol/**"
      - "packages/agent-sdk/**"
      - "packages/agent-sdk-python/**"
      - "packages/session-core/lib/**"
      - "packages/cli/src/**"
      - "packages/cli/test-node/context-memory-kernel.node-test.mjs"
      - "packages/cli/test-node/local-memory-semantic.node-test.mjs"
      - "packages/cli/test-node/fixtures/context-memory-crash-child.mjs"
      - "packages/cli/test-node/fixtures/context-memory-compaction-restart-child.mjs"
      - "desktop-app-vue/package.json"
      - "desktop-app-vue/src/**"
      - "desktop-app-vue/vitest.context-memory.config.mjs"
      - "packages/vscode-extension/src/**"
      - "packages/vscode-extension/test/app-server-pilot.test.cjs"
      - "packages/vscode-extension/test/context-memory-authority.test.cjs"
      - "packages/jetbrains-plugin/src/main/**"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/ContextMemoryProjectionTest.java"

permissions:
  contents: read

# Supersede obsolete PR/feature checks; preserve main and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && format('branch-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') }}

jobs:
  context-memory:
    name: Context/Memory (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          # The locked Electron node-gyp fork supports VS2022, not VS2026.
          # Keep a native Windows build rather than skipping SQLite scripts.
          - os: windows-2022
            platform: windows
          - os: macos-latest
            platform: macos
    env:
      CONTEXT_MEMORY_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # This Node-only matrix aliases Electron to a mock in the Desktop Vitest
      # config; it never launches Electron. Retain native dependency install
      # scripts (including SQLite), and skip only the unused Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}

      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CONTEXT_MEMORY_CANDIDATE_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        id: kernel-python
        with:
          python-version: "3.12"

      - name: Bind native builds to the selected Python
        shell: bash
        env:
          KERNEL_PYTHON: ${{ steps.kernel-python.outputs.python-path }}
        run: |
          node --input-type=module -e 'import {appendFileSync,realpathSync} from "node:fs"; const python=realpathSync(process.env.KERNEL_PYTHON); if (/[\r\n]/u.test(python)) throw new Error("Invalid Python executable"); appendFileSync(process.env.GITHUB_ENV, "NODE_GYP_FORCE_PYTHON=" + python + "\n");'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/setup-node-deps

      - name: Require a loadable native SQLite driver for this Node runtime
        run: >-
          node --input-type=module -e 'import {createRequire} from "node:module";
          import path from "node:path";
          const require=createRequire(path.resolve("packages/context-memory-kernel/package.json"));
          const Database=require("better-sqlite3");
          const db=new Database(":memory:");
          try { const version=db.prepare("SELECT sqlite_version() AS version").get().version;
          console.log(JSON.stringify({node:process.version,abi:process.versions.modules,sqlite:version,
          driver:require("better-sqlite3/package.json").version,python:process.env.NODE_GYP_FORCE_PYTHON})); }
          finally { db.close(); }'

      - name: Verify canonical Kernel, inventory, privacy, and release evidence
        run: npm --prefix packages/context-memory-kernel test

      - name: Probe canonical and fenced runtime writers
        run: >-
          node packages/context-memory-kernel/scripts/context-memory-writer-probe.mjs
          --candidate-sha "${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}"
          --output "${{ runner.temp }}/context-memory-writer-probe-${{ matrix.platform }}.json"

      - name: Verify CLI migration, shadow, provider, purge, and crash recovery
        run: npm --prefix packages/cli run test:context-memory-kernel

      - name: Verify local Memory semantic source contracts (no model download)
        env:
          CC_MEMORY_SEMANTIC_REAL_TEST: "0"
        run: node --test packages/cli/test-node/local-memory-semantic.node-test.mjs

      - name: Verify Agent Protocol schema and generated bindings
        run: npm --prefix packages/agent-protocol run check

      - name: Verify Agent Protocol conformance
        run: npm --prefix packages/agent-protocol test

      - name: Verify Desktop and VS Code shared projection
        run: node --test packages/context-memory-kernel/test/desktop-surface-conformance.test.js packages/vscode-extension/test/app-server-pilot.test.cjs packages/vscode-extension/test/context-memory-authority.test.cjs

      - name: Verify Desktop canonical memory IPC adapter
        run: npm --prefix desktop-app-vue run test:context-memory

      - name: Verify TypeScript SDK
        run: npm --prefix packages/agent-sdk test

      - name: Build TypeScript SDK
        run: npm --prefix packages/agent-sdk run build

      - name: Verify Python SDK
        working-directory: packages/agent-sdk-python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x packages/jetbrains-plugin/gradlew

      - name: Bootstrap pinned Gradle distribution before projection tests
        run: >-
          node scripts/lib/verify01-gradle-bootstrap.mjs
          --project-dir packages/jetbrains-plugin
          --artifact-dir "${{ runner.temp }}/context-memory-gradle-bootstrap"

      - name: Verify JetBrains canonical projection (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/jetbrains-plugin
        run: .\gradlew.bat test --tests com.chainlesschain.ide.ContextMemoryProjectionTest --no-daemon

      - name: Verify JetBrains canonical projection (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/jetbrains-plugin
        run: ./gradlew test --tests com.chainlesschain.ide.ContextMemoryProjectionTest --no-daemon

      - name: Run bounded quick soak
        run: node packages/context-memory-kernel/scripts/context-memory-soak.mjs --profile quick --candidate-sha "${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}" --output "${{ runner.temp }}/context-memory-soak-${{ matrix.platform }}.json"

      - name: Run full capacity benchmark (Linux)
        if: runner.os == 'Linux'
        run: >-
          node packages/context-memory-kernel/scripts/context-memory-benchmark.mjs
          --profile release
          --candidate-sha "${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}"
          --output "${{ runner.temp }}/context-memory-benchmark-${{ matrix.platform }}.json"

      - name: Run bounded capacity benchmark (Windows/macOS)
        if: runner.os != 'Linux'
        run: >-
          node packages/context-memory-kernel/scripts/context-memory-benchmark.mjs
          --profile quick
          --candidate-sha "${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}"
          --output "${{ runner.temp }}/context-memory-benchmark-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: context-memory-${{ matrix.platform }}-${{ env.CONTEXT_MEMORY_CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/context-memory-soak-${{ matrix.platform }}.json
            ${{ runner.temp }}/context-memory-writer-probe-${{ matrix.platform }}.json
            ${{ runner.temp }}/context-memory-benchmark-${{ matrix.platform }}.json
            ${{ runner.temp }}/context-memory-gradle-bootstrap/
            packages/jetbrains-plugin/build/test-results/test/
          if-no-files-found: error
          retention-days: 30
