name: CLI CI

on:
  push:
    branches: [main]
    tags:
      # The release gate only consumes CLI and native-release tags.  Broad
      # `v*` also matched IDE tags, scheduling a duplicate 60+ job matrix on
      # the same SHA and starving the npm release gate behind runner queues.
      - "v-npm-*"
      - "cli-v*"
    paths:
      - "packages/cli/**"
      - "packages/core-db/**"
      - "packages/session-core/**"
      - "package-lock.json"
      - "packages/context-memory-kernel/**"
      - "packages/agent-protocol/**"
      - ".github/workflows/context-memory-*.yml"
      - "packages/agent-sdk/__fixtures__/protocol/**"
      - "tests/fixtures/claude-2.1.221-238-security-map.json"
      - "tests/fixtures/claude-code-increment-audit-contract.json"
      - "docs/cli/COMMAND_LIFECYCLE_TELEMETRY.md"
      # 76+ vscode-ext-*.test.js suites in packages/cli/__tests__/unit import the
      # extension sources (and its manifest / l10n bundles) directly — an
      # extension-only commit must still run them.
      - "packages/vscode-extension/src/**"
      - "packages/vscode-extension/package.json"
      - "packages/vscode-extension/package.nls*.json"
      - "packages/vscode-extension/l10n/**"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/MiniJson.java"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/SessionProjection.java"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/SessionProjectionAuditProbe.java"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/claude-code-increment-audit.yml"
      - ".github/workflows/cli-reliability-soak.yml"
      - ".github/workflows/app-server-overload-soak.yml"
      - ".github/workflows/cli-native-release.yml"
      - ".github/workflows/cli-native-release-readback.yml"
      - ".github/workflows/cli-native-validation.yml"
      - ".github/workflows/_cli-test.yml"
      - ".github/actions/setup-node-deps/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/core-db/**"
      - "packages/session-core/**"
      - "package-lock.json"
      - "packages/context-memory-kernel/**"
      - "packages/agent-protocol/**"
      - ".github/workflows/context-memory-*.yml"
      - "packages/agent-sdk/__fixtures__/protocol/**"
      - "tests/fixtures/claude-2.1.221-238-security-map.json"
      - "tests/fixtures/claude-code-increment-audit-contract.json"
      - "docs/cli/COMMAND_LIFECYCLE_TELEMETRY.md"
      - "packages/vscode-extension/src/**"
      - "packages/vscode-extension/package.json"
      - "packages/vscode-extension/package.nls*.json"
      - "packages/vscode-extension/l10n/**"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/MiniJson.java"
      - "packages/jetbrains-plugin/src/main/java/com/chainlesschain/ide/SessionProjection.java"
      - "packages/jetbrains-plugin/src/test/java/com/chainlesschain/ide/SessionProjectionAuditProbe.java"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/claude-code-increment-audit.yml"
      - ".github/workflows/cli-reliability-soak.yml"
      - ".github/workflows/app-server-overload-soak.yml"
      - ".github/workflows/cli-native-release.yml"
      - ".github/workflows/cli-native-release-readback.yml"
      - ".github/workflows/cli-native-validation.yml"
      - ".github/workflows/_cli-test.yml"
      - ".github/actions/setup-node-deps/action.yml"
  workflow_dispatch:

# Cancel older runs of this workflow on the same branch/PR when a newer push
# arrives. The 36+ matrix jobs make stacking expensive.
concurrency:
  # A main push followed by its immutable release tag has the same SHA.
  # Keep one authoritative matrix for that source revision rather than
  # spending runner capacity on an identical second matrix.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Per-OS test fan-out via the shared reusable workflow.
  # Each call spawns its own (suite × shard) matrix internally — see _cli-test.yml.
  test-ubuntu:
    uses: ./.github/workflows/_cli-test.yml
    with:
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      runs-on: ubuntu-latest

  test-windows:
    uses: ./.github/workflows/_cli-test.yml
    with:
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      runs-on: windows-latest
      unit-shards: 16

  test-macos:
    uses: ./.github/workflows/_cli-test.yml
    with:
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      runs-on: macos-latest

  verify-cli:
    needs: [test-ubuntu, test-windows, test-macos]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-node-deps
      - name: Run exact-SHA PM exploration recovery drill
        shell: bash
        run: >-
          node packages/cli/scripts/pm-exploration-recovery-drill.mjs
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "${RUNNER_TEMP}/pm-exploration-recovery-${RUNNER_OS}.json"
      - name: Upload exact-SHA PM exploration recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pm-exploration-recovery-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pm-exploration-recovery-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify asynchronous PR recovery without GitHub writes
        run: node packages/cli/scripts/pr-recovery-smoke.mjs
      # These independently published dependencies must pass on the same
      # three platforms and exact SHA as the CLI, before any npm publication.
      - name: Test Core DB release payload source
        working-directory: packages/core-db
        run: npm test -- --maxWorkers=1
      - name: Test Session Core release payload source
        working-directory: packages/session-core
        run: npm test -- --maxWorkers=1
      - name: Run mapped Claude security delta tests
        shell: bash
        run: >-
          node packages/cli/scripts/run-claude-security-map-tests.mjs
          --output "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"
      - name: Produce advisory canonical SEC-DELTA fragment
        shell: bash
        run: >-
          node packages/cli/scripts/verify-claude-security-map.mjs
          --release-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --test-report "${RUNNER_TEMP}/claude-security-map-tests-${RUNNER_OS}.json"
          --disposition advisory
          --artifact-name "claude-security-map-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}"
          --output "${RUNNER_TEMP}/claude-security-map-${RUNNER_OS}.json"
      - name: Upload Claude security delta evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-security-map-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/claude-security-map-tests-${{ runner.os }}.json
            ${{ runner.temp }}/claude-security-map-${{ runner.os }}.json
          if-no-files-found: error
      - name: Produce required canonical RC-DEFAULT fragment
        shell: bash
        run: >-
          node packages/cli/scripts/verify-rc-default-audit.mjs
          --required
          --release-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --artifact-name "rc-default-audit-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}"
          --output "${RUNNER_TEMP}/rc-default-audit-${RUNNER_OS}.json"
      - name: Upload RC-DEFAULT audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc-default-audit-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rc-default-audit-${{ runner.os }}.json
          if-no-files-found: error
      - name: Verify 32-process cross-session message fabric
        shell: bash
        env:
          CC_XSESSION_WORKFLOW_ID: ${{ github.workflow_ref }}
          CC_XSESSION_RUN_ID: ${{ github.run_id }}
          CC_XSESSION_JOB_ID: verify-cli-${{ runner.os }}
          CC_XSESSION_ARTIFACT_NAME: session-message-fabric-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node packages/cli/scripts/verify-session-message-fabric.mjs
          --release-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --output "${RUNNER_TEMP}/session-message-fabric-${RUNNER_OS}.json"
      - name: Upload cross-session message fabric evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: session-message-fabric-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/session-message-fabric-${{ runner.os }}.json
          if-no-files-found: error
      - name: Produce canonical MCP lifecycle compatibility evidence
        shell: bash
        run: |
          attempts=1
          if [ "${RUNNER_OS}" = "Windows" ]; then attempts=2; fi
          for attempt in $(seq 1 "${attempts}"); do
            if node packages/cli/scripts/verify-mcp-lifecycle-increments.mjs \
              ${{ github.event_name != 'pull_request' && '--required' || '' }} \
              --release-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
              --artifact-name "mcp-lifecycle-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}" \
              --output "${RUNNER_TEMP}/mcp-lifecycle-${RUNNER_OS}/mcp-lifecycle-audit-fragment.json"; then
              exit 0
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then exit 1; fi
            echo "::warning::Windows hosted-runner MCP lifecycle profile missed its recovery-latency SLO; retrying once"
            sleep 2
          done
      - name: Upload MCP lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-lifecycle-cli-ci-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mcp-lifecycle-${{ runner.os }}/mcp-lifecycle-audit-fragment.json
          if-no-files-found: error
      - name: Verify CLI --version
        working-directory: packages/cli
        run: node bin/chainlesschain.js --version
      - name: Verify CLI --help
        working-directory: packages/cli
        run: node bin/chainlesschain.js --help
      - name: Verify command surface and top-level growth gate
        working-directory: packages/cli
        run: npm run commands:manifest:check
      - name: Verify command lifecycle evidence contract
        working-directory: packages/cli
        run: npm run commands:lifecycle:report:check
      - name: Verify generated command help index
        working-directory: packages/cli
        run: npm run commands:help-index:check
      - name: Verify generated shell completions
        working-directory: packages/cli
        run: npm run commands:completions:check
      - name: Verify canonical Agent stream causal conformance
        working-directory: packages/cli
        run: npx vitest run __tests__/unit/team-agent-stream.test.js src/runtime/__tests__/coding-agent-events.test.js
      - name: Verify CLI startup SLOs
        working-directory: packages/cli
        run: npm run startup:check

  pm-exploration-recovery-aggregate:
    name: Test-only PM exploration recovery three-OS aggregate
    if: always()
    needs: verify-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_PM_RECOVERY_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Refuse an incomplete PM recovery platform matrix
        if: needs.verify-cli.result != 'success'
        shell: bash
        run: |
          echo "::error::At least one test-only PM recovery platform failed or did not finish"
          exit 1

      - name: Checkout exact PM recovery commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CC_PM_RECOVERY_EXPECTED_SHA }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CC_PM_RECOVERY_EXPECTED_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      - name: Download exact-SHA PM recovery evidence
        uses: actions/download-artifact@v7
        with:
          pattern: pm-exploration-recovery-*-${{ env.CC_PM_RECOVERY_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pm-exploration-recovery-evidence
          merge-multiple: true

      - name: Verify complete test-only PM recovery evidence matrix
        shell: bash
        run: >-
          node packages/cli/scripts/pm-exploration-recovery-drill.mjs
          --verify-evidence-dir "$RUNNER_TEMP/pm-exploration-recovery-evidence"
          --release-commit "$CC_PM_RECOVERY_EXPECTED_SHA"
          --output "$RUNNER_TEMP/pm-exploration-recovery-aggregate.json"

      - name: Upload immutable test-only PM recovery aggregate
        uses: actions/upload-artifact@v6
        with:
          name: pm-exploration-recovery-test-only-aggregate-${{ env.CC_PM_RECOVERY_EXPECTED_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pm-exploration-recovery-aggregate.json
          if-no-files-found: error
          retention-days: 90

  # Phase 4a: validate `cc pack` end-to-end on Linux without running pkg.
  # Dry-run exercises precheck → web-panel → config-template → native-prebuilds
  # → pkg-config synthesis, which is where most platform regressions surface.
  # A full pkg + smoke run would need CC_PACK_E2E=1 and ~30s of pkg download
  # on every PR — out of scope for this job; use the manual e2e suite instead.
  pack-linux-dryrun:
    needs: [test-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps

      - name: Ensure web-panel dist exists (stub)
        working-directory: packages/cli
        run: |
          # packer's ensureWebPanel rejects a dist with < 2 files, so write
          # index.html PLUS a stub asset (the real build is skipped here).
          mkdir -p src/assets/web-panel/assets
          echo '<!doctype html><title>stub</title>' > src/assets/web-panel/index.html
          echo '/* stub */' > src/assets/web-panel/assets/stub.js

      - name: cc pack --dry-run for linux-x64
        working-directory: packages/cli
        run: |
          node bin/chainlesschain.js pack \
            --dry-run \
            --targets node22-linux-x64 \
            --allow-dirty \
            --skip-web-panel-build \
            --no-smoke-test

  dry-run-publish:
    needs: [test-ubuntu]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (workspace-aware)
        uses: ./.github/actions/setup-node-deps

      - name: Dry-run publish
        working-directory: packages/cli
        run: npm publish --dry-run
