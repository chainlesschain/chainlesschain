name: VERIFY01 First Run CLI Diagnostic

# Only an explicit paid marker on this exact feature branch or dispatch opt-in.
# Ordinary PRs, schedules, pushes and workflow completion never call a provider.
on:
  push:
    branches: [feature/cli-ide-gap-20261011]
    paths:
      - "packages/cli/scripts/verify01-first-run-cli-diagnostic.mjs"
      - ".github/workflows/verify01-first-run-cli-diagnostic.yml"
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Paid authentication + one verify-04 task ($0.25 estimated tool stop, not a hard quota; authentication cost unknown)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify01-first-run-cli-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_live == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/cli-ide-gap-20261011' &&
      contains(github.event.head_commit.message, '[volcengine-first-run-diagnostic]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Validate diagnostic without account access
        run: >-
          node --test
          packages/cli/test-node/verify01-first-run-cli-diagnostic.node-test.mjs
          packages/cli/test-node/verify01-public-install-diagnostic.node-test.mjs
          packages/cli/test-node/verify01-workspace.node-test.mjs
      - name: Pin checker image before starting the journey clock
        run: |
          docker pull node:22.12.0-bookworm
          echo "REVIEW_IMAGE_ID=$(docker image inspect node:22.12.0-bookworm --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Run five actual first-run stages on public CLI 0.166.97
        env:
          VOLCENGINE_API_KEY: ${{ secrets.CC_LLM_API_KEY }}
          EXECUTION_SOURCE_SHA: ${{ github.sha }}
        run: >-
          node packages/cli/scripts/verify01-first-run-cli-diagnostic.mjs
          --confirm-live
          --source-sha "$EXECUTION_SOURCE_SHA"
          --image-id "$REVIEW_IMAGE_ID"
          --output-dir "$RUNNER_TEMP/verify01-first-run-cli-diagnostic"
      - name: Preserve workflow context even after preflight failure
        if: always()
        env:
          DIAGNOSTIC_JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.join(process.env.RUNNER_TEMP, 'verify01-first-run-cli-workflow');
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(path.join(root, 'workflow.json'), JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME,
            status: process.env.DIAGNOSTIC_JOB_STATUS,
            formalSample: false,
            independentHumanReview: false,
            billingVerified: false,
            releaseEligible: false,
            formalStatus: 'NOT_RUN',
            observationsProduced: 0
          }, null, 2) + '\n');
          NODE
      - name: Preserve redacted stages, failures, candidate and checker receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-first-run-cli-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify01-first-run-cli-diagnostic/
            ${{ runner.temp }}/verify01-first-run-cli-workflow/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
