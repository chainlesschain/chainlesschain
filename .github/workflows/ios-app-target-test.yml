name: iOS App Remote Session Recovery

# 一次性 / 偶尔用 — workflow_dispatch trigger，跑 xcodebuild app target
# unsigned simulator build，验证 commit 159fc2403 加进 pbxproj 的 SPM
# wiring 是否真让 app target 编译过。
#
# 镜像 release.yml build-ios 的 unsigned 路径，但不打 release / 不上传
# artifact 到 release-assets / 不影响版本号。仅 print 编译结果 + 上传
# 一份 simulator zip 做 7 天保留 artifact (CI 内可下载查看)。
#
# 等下次真发版（release.yml）确认能产 .ipa/.zip 后，这个 workflow 可删。

on:
  pull_request:
    paths:
      - ".github/workflows/ios-app-target-test.yml"
      - "ios-app/Package.swift"
      - "ios-app/Package.resolved"
      - "ios-app/ChainlessChain.xcodeproj/**"
      - "ios-app/Modules/CoreP2P/Sources/Pairing/RemoteSessionClient.swift"
      - "ios-app/Modules/CoreP2P/Sources/Pairing/URLSessionRemoteSessionWebSocket.swift"
      - "ios-app/Tests/CoreP2PTests/RemoteSessionClientTests.swift"
      - "packages/cli/__tests__/unit/ide-roadmap-ios-recovery.test.js"
      - "ios-app/ChainlessChain/Features/Pairing/PairingDependencies.swift"
      - "ios-app/ChainlessChain/Features/Pairing/Views/PairingHomeView.swift"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-app-target-test.yml"
      - "ios-app/Package.swift"
      - "ios-app/Package.resolved"
      - "ios-app/ChainlessChain.xcodeproj/**"
      - "ios-app/Modules/CoreP2P/Sources/Pairing/RemoteSessionClient.swift"
      - "ios-app/Modules/CoreP2P/Sources/Pairing/URLSessionRemoteSessionWebSocket.swift"
      - "ios-app/Tests/CoreP2PTests/RemoteSessionClientTests.swift"
      - "packages/cli/__tests__/unit/ide-roadmap-ios-recovery.test.js"
      - "ios-app/ChainlessChain/Features/Pairing/PairingDependencies.swift"
      - "ios-app/ChainlessChain/Features/Pairing/Views/PairingHomeView.swift"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact full commit SHA to test (blank uses selected ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  IOS_RECOVERY_COMMIT: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  test-app-target-build:
    name: Remote Session tests + unsigned simulator app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact recovery candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.IOS_RECOVERY_COMMIT }}

      - name: Verify exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${IOS_RECOVERY_COMMIT}" ]; then
            echo "::error::Checkout ${actual} does not match ${IOS_RECOVERY_COMMIT}"
            exit 1
          fi

      - name: Show toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ChainlessChain.xcodeproj \
            -scheme ChainlessChain \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Test transient resume, retry exhaustion, and revocation
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          swift test --filter RemoteSessionClientTests 2>&1 | tee build-swift-test.log

      - name: Build iOS app for Simulator (unsigned)
        working-directory: ios-app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          # Raw xcodebuild output (no xcpretty filter — xcpretty silent-drops
          # some error formats; see release.yml signed-archive path).
          xcodebuild build \
            -project ChainlessChain.xcodeproj \
            -scheme ChainlessChain \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-build-unsigned.log

      - name: Upload xcodebuild log (diagnostics, always)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-remote-session-recovery-logs-${{ env.IOS_RECOVERY_COMMIT }}-${{ github.run_attempt }}
          path: |
            ios-app/build-swift-test.log
            ios-app/build/xcodebuild-build-unsigned.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and package .app bundle
        working-directory: ios-app
        shell: bash
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/ChainlessChain.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build claimed success but $APP_PATH not produced"
            exit 1
          fi
          APP_SIZE=$(du -k "$APP_PATH" | cut -f1)
          if [ "$APP_SIZE" -lt 1024 ]; then
            echo "::error::$APP_PATH is only ${APP_SIZE} KB — likely broken bundle (v5.0.3.55 had 2.4KB破壳同款)"
            exit 1
          fi
          echo "✅ ChainlessChain.app size: ${APP_SIZE} KB"
          mkdir -p build/output
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r ../../../../output/ChainlessChain-ios-simulator-test.zip ChainlessChain.app
          ls -la ../../../../output/

      - name: Upload simulator zip (test artifact)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-simulator-recovery-build-${{ env.IOS_RECOVERY_COMMIT }}-${{ github.run_attempt }}
          path: ios-app/build/output/*.zip
          if-no-files-found: error
          retention-days: 7
