name: _CLI Test (reusable)

# Reusable workflow for the chainlesschain CLI test suite.
# Uses vitest's native --shard=k/n (file-balanced) plus a GitHub Actions matrix
# so each suite × shard runs in its own runner, in parallel.
#
# Why this exists (do not revert to the old `[a-m]*/[n-z]*` glob batches):
#   The previous strategy alphabetically split test files into two halves and
#   added --no-file-parallelism on top to keep things linear. That broke every
#   time a heavy new test landed in one half (e.g. the original
#   mtc-federation-governance-cli, ~85s/41 tests, since split into three
#   smaller files per issue #4). vitest's --shard splits files by hash → each shard is
#   ~25% of the work, balanced automatically as new tests land, AND file
#   parallelism inside the shard can come back.
#
# Required flags (DO NOT DROP):
#   --shard=k/n              balanced file split (replaces glob batching)
#   --silent=passed-only     suppresses passed-test stdout capture going over
#                            the vitest worker→main RPC pipe. Without this,
#                            a 4366-test shard exits 1 with "Timeout calling
#                            onTaskUpdate" even though every test passes.
#                            Note: `--silent=true` (alias of `passed-only`)
#                            still works; we use the explicit name for clarity.
#                            Note: vitest CAC parser requires the explicit
#                            `=value` form when positional file args follow.
#   --reporter=default       v4 dropped the `basic` reporter (replaced by
#                            default + silent=passed-only).
#
# Inputs:
#   commit_sha — exact caller commit to checkout and verify
#   runs-on    — runner OS (default ubuntu-latest)
#   shards      — number of E2E shards (default 4; must match its matrix below)
#   unit-shards — number of unit shards (4 or 8; Windows CI uses 8)
#   include-e2e — set false to skip the e2e suite (e.g. for fast PR feedback)

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Exact full caller commit SHA"
        required: true
        type: string
      runs-on:
        description: "Runner OS"
        required: false
        type: string
        default: "ubuntu-latest"
      shards:
        description: "Number of E2E shards (must equal the E2E matrix length below)"
        required: false
        type: number
        default: 4
      unit-shards:
        description: "Number of unit shards (supported values: 4 or 8)"
        required: false
        type: number
        default: 4
      include-e2e:
        description: "Include the e2e suite"
        required: false
        type: boolean
        default: true

jobs:
  unit:
    name: "unit (${{ inputs.runs-on }}, shard ${{ matrix.shard }}/${{ inputs.unit-shards }})"
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # Four Windows shards can keep a two-fork Vitest worker alive for more
        # than 17 minutes. On hosted Windows runners that has repeatedly ended
        # with a teardown EPIPE before JUnit is flushed, leaving no safe proof
        # for the bounded infrastructure retry. Eight shards shorten the IPC
        # lifetime without weakening assertion or report requirements.
        shard: ${{ inputs.unit-shards == 8 && fromJSON('[1,2,3,4,5,6,7,8]') || fromJSON('[1,2,3,4]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      # A unit shard can complete every recorded assertion and still lose a
      # hosted forks worker during teardown. Retry once without file
      # parallelism only when the Vitest worker signature and a clean,
      # non-empty JUnit report both prove that exact infrastructure failure;
      # assertion failures remain hard failures.
      - name: vitest unit shard ${{ matrix.shard }}/${{ inputs.unit-shards }}
        working-directory: packages/cli
        run: node scripts/run-vitest-with-worker-retry.mjs -- run --shard=${{ matrix.shard }}/${{ inputs.unit-shards }} --reporter=default --reporter=junit --outputFile.junit=test-results/unit-${{ matrix.shard }}.xml --silent=passed-only __tests__/unit/
      - name: Upload failed unit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ inputs.runs-on }}-unit-${{ matrix.shard }}-results
          path: packages/cli/test-results/unit-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  integration:
    # Integration runs 8 shards because shard 4 (at the 4-shard layout)
    # hashed to a combination heavy enough to push wall-time past the 60s
    # onTaskUpdate heartbeat on all 3 OS. 8 shards halved the per-shard
    # wall-time and the file split below removed the heaviest single file.
    #
    # Issue #4 history: the original mtc-federation-governance-cli.test.js
    # (1334 lines / 41 tests / ~200s on Windows CI) was split into three
    # focused suites — *-core-cli.test.js (13 tests), *-sync-cli.test.js
    # (13 tests), *-trust-cli.test.js (15 tests) — sharing a helper module
    # under __tests__/integration/_helpers/. On vitest v3 the split alone
    # wasn't enough on Windows: birpc's hardcoded 60s onTaskUpdate timeout
    # tripped even with 13 tests in the forks pool. We worked around it
    # via `poolMatchGlobs → threads:singleThread`. Vitest v4 (#8297) makes
    # birpc respect user-configured timeouts, so the workaround is gone.
    name: "integration (${{ inputs.runs-on }}, shard ${{ matrix.shard }}/8)"
    runs-on: ${{ inputs.runs-on }}
    env:
      # Hosted Windows runners can take more than the production default to
      # cold-start the fail-closed PowerShell ACL preflight under shard load.
      # secure-fs accepts this as an upper allowance and never lets it lower
      # the production timeout.
      CC_SECURE_FS_WINDOWS_ACL_TIMEOUT_MS: ${{ startsWith(inputs.runs-on, 'windows') && '60000' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      # Retry the whole shard once without file parallelism only when Vitest
      # itself reports a forks worker exit AND its JUnit report proves that
      # recorded assertions had no failures/errors. Assertion failures,
      # missing reports, and a failed retry remain hard failures. This contains
      # hosted-runner false reds without weakening the test gate.
      - name: vitest integration shard ${{ matrix.shard }}/8
        working-directory: packages/cli
        run: node scripts/run-vitest-with-worker-retry.mjs -- run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=junit --outputFile.junit=test-results/integration-${{ matrix.shard }}.xml --silent=passed-only __tests__/integration/
      - name: Upload failed integration report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ inputs.runs-on }}-integration-${{ matrix.shard }}-results
          path: packages/cli/test-results/integration-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: "e2e (${{ inputs.runs-on }}, shard ${{ matrix.shard }}/${{ inputs.shards }})"
    if: ${{ inputs.include-e2e }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      # --retry=2: e2e files spawn real `cc` children and bind real ports. Even
      # with singleFork (serial within a shard), the rare server-startup / port
      # race is genuinely non-deterministic; vitest re-runs only the failed test.
      # This is a bounded retry, NOT continue-on-error — a test that fails all 3
      # attempts still fails the job.
      - name: vitest e2e shard ${{ matrix.shard }}/${{ inputs.shards }}
        working-directory: packages/cli
        run: npx vitest run --config vitest.e2e.config.js --shard=${{ matrix.shard }}/${{ inputs.shards }} --retry=2 --reporter=default --reporter=junit --outputFile.junit=test-results/e2e-${{ matrix.shard }}.xml --silent=passed-only __tests__/e2e/
      - name: Upload failed e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ inputs.runs-on }}-e2e-${{ matrix.shard }}-results
          path: packages/cli/test-results/e2e-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7
