name: CLI Windows Diagnostics

on:
  workflow_dispatch:
    inputs:
      acl_progress_only:
        description: "Only run zero-model Windows x64 ACL progress diagnostics at the selected ref (not a release gate)"
        type: boolean
        default: false
      source_sha:
        description: "Exact full production commit to diagnose"
        type: string
        default: "1fe7a46c0f97b93fb5110ea3427cc8551d0dab37"
      full_updater_suite:
        description: "Run the entire updater test file with original assertions/deadlines"
        type: boolean
        default: false
      gate_context:
        description: "Use Git Bash, full installer predecessor, then all updater tests (forces full suite)"
        type: boolean
        default: false
      trace_journal:
        description: "Time generated journal helper internals and post-test PowerShell probes (diagnostic only)"
        type: boolean
        default: false
      run_parent_worker:
        description: "Also run the historical Windows worker diagnostic"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cli-windows-diagnostics-${{ github.sha }}
  cancel-in-progress: false

jobs:
  acl-progress-diagnostic:
    if: ${{ inputs.acl_progress_only }}
    name: "diagnostic only: Windows x64 ACL progress (zero model calls)"
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          architecture: x64

      - name: Verify source identity and run bounded zero-model diagnostics
        shell: pwsh
        env:
          CC_ACL_DIAGNOSTIC_SHA: ${{ github.sha }}
          CC_ACL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/acl-progress-diagnostic
        run: |
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const output = process.env.CC_ACL_DIAGNOSTIC_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          const head = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8', timeout: 10000, maxBuffer: 4096, windowsHide: true });
          if (head.status !== 0 || head.stdout.trim() !== process.env.CC_ACL_DIAGNOSTIC_SHA) throw new Error('Exact diagnostic SHA mismatch');
          if (process.platform !== 'win32' || process.arch !== 'x64' || process.version !== 'v22.12.0') throw new Error('Unexpected diagnostic host');
          const receipt = { schema: 1, sourceCommit: head.stdout.trim(), node: process.version, platform: process.platform, arch: process.arch, diagnosticOnly: true, releaseGate: false, modelCalls: 0, commands: [] };
          fs.writeFileSync(path.join(output, 'execution.json'), JSON.stringify(receipt, null, 2));
          const commands = [
            ['focused-tests', ['--test', 'packages/cli/test-node/windows-acl-progress.node-test.mjs'], 30000],
            ['native-probes', ['packages/cli/scripts/windows-acl-progress-probe.mjs', '--output', path.join(output, 'acl-progress.json')], 225000],
          ];
          for (const [name, args, timeout] of commands) {
            const result = spawnSync(process.execPath, args, { encoding: 'utf8', windowsHide: true, timeout, maxBuffer: 128 * 1024 });
            for (const stream of ['stdout', 'stderr']) {
              fs.writeFileSync(path.join(output, name + '.' + stream + '.log'), Buffer.from(result[stream] || '').subarray(0, 64 * 1024));
            }
            receipt.commands.push({ name, status: result.status, signal: result.signal, processError: Boolean(result.error) });
            fs.writeFileSync(path.join(output, 'execution.json'), JSON.stringify(receipt, null, 2));
            if (result.error || result.status !== 0) { process.exitCode = 1; break; }
          }
          '@ | node -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload bounded diagnostic evidence (not task acceptance)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acl-progress-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/acl-progress-diagnostic
          if-no-files-found: error
          retention-days: 30

  updater-arm64-diagnostic:
    if: ${{ !inputs.acl_progress_only }}
    name: Windows ARM64 updater diagnosis (not a release gate)
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic driver
        uses: actions/checkout@v5
        with:
          path: driver
          persist-credentials: false

      - name: Checkout frozen production source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          architecture: arm64
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: ./source/.github/actions/setup-node-deps
        with:
          working-directory: source
          install-command: npm ci --workspace packages/cli --include-workspace-root=false --legacy-peer-deps --ignore-scripts
          install-workspace: packages/cli

      - name: Run diagnostic on unchanged source and original deadlines
        if: ${{ !inputs.gate_context }}
        shell: pwsh
        env:
          CC_UPDATER_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
          CC_UPDATER_DIAGNOSTIC_FULL_SUITE: ${{ inputs.full_updater_suite }}
          CC_UPDATER_DIAGNOSTIC_TRACE_JOURNAL: ${{ inputs.trace_journal }}
        run: |
          node driver/scripts/diagnostics/updater-arm64/run.mjs source "$env:RUNNER_TEMP/updater-arm64-diagnostic"

      - name: Run original gate shell and installer/updater sequence
        if: ${{ inputs.gate_context }}
        shell: bash
        env:
          CLI_NATIVE_VALIDATION_SHA: ${{ inputs.source_sha }}
          CC_UPDATER_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
          CC_UPDATER_DIAGNOSTIC_GATE_CONTEXT: "true"
          CC_UPDATER_DIAGNOSTIC_LAUNCH_SHELL: "bash"
          CC_UPDATER_DIAGNOSTIC_TRACE_JOURNAL: ${{ inputs.trace_journal }}
        run: |
          set -euo pipefail
          node driver/scripts/diagnostics/updater-arm64/run.mjs source "$RUNNER_TEMP/updater-arm64-diagnostic"

      - name: Upload diagnostic observations regardless of test outcome
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: updater-arm64-diagnostic-${{ inputs.source_sha }}-${{ github.sha }}
          path: ${{ runner.temp }}/updater-arm64-diagnostic
          if-no-files-found: error
          retention-days: 30

  parent-worker-diagnostic:
    if: ${{ !inputs.acl_progress_only && inputs.run_parent_worker }}
    name: "diagnostic only: Windows x64 full unit shard 14/16"
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CC_SECURE_FS_WINDOWS_ACL_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1fe7a46c0f97b93fb5110ea3427cc8551d0dab37
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .worker-diagnostic-driver
          sparse-checkout: packages/cli/scripts
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-node-deps
      - name: Run original retry wrapper and JUnit-only full shard with parent observations
        run: node .worker-diagnostic-driver/packages/cli/scripts/run-parent-diagnostic.mjs
      - name: Upload diagnostic evidence (never a release gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-worker-parent-1fe7-shard14
          path: .work/worker-parent-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
