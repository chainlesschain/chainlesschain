name: Emergency rollback CLI 0.166.45

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type rollback-0.166.45 to deprecate 0.166.45 and restore latest to 0.166.44"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact rollback confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "rollback-0.166.45"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
          registry-url: "https://registry.npmjs.org"

      - name: Deprecate broken release and restore last known good latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm view chainlesschain@0.166.44 version | grep -Fx '0.166.44'
          npm view chainlesschain@0.166.45 version | grep -Fx '0.166.45'
          npm dist-tag add chainlesschain@0.166.44 latest
          if ! npm deprecate chainlesschain@0.166.45 \
            "IDE and default agent startup require an unavailable Evolution deployment. Use 0.166.44 until the compatibility fix is published."; then
            echo "::warning::The publishing token cannot set deprecation metadata; latest was still rolled back."
          fi

      - name: Verify public rollback state
        run: |
          set -euo pipefail
          test "$(npm view chainlesschain dist-tags.latest)" = "0.166.44"
          echo "chainlesschain latest is 0.166.44; 0.166.45 is no longer selected by default"
