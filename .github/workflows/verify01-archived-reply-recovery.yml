name: VERIFY01 Archived Reply Recovery (no model)

on:
  # Register the manual entry on feature branches. Registration has no jobs or
  # provider requests; only an explicit workflow_dispatch runs the recovery.
  push:
    branches: ["feature/**"]
    paths: [".github/workflows/verify01-archived-reply-recovery.yml"]
  workflow_dispatch:
    inputs:
      versions_file:
        description: Committed public package manifest binding the approved 0.4.167 ZIP
        required: true
        default: docs/research/cli/verify01-package-sets/2026-10-18-task-quality-105.json
        type: string

permissions:
  contents: read

jobs:
  archived-reply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-archived-reply
      REPLAY_VERSIONS_FILE: ${{ inputs.versions_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set isolated replay paths
        run: |
          echo "REPLAY_OUTPUT=$RUNNER_TEMP/verify-33-archived-recovery" >> "$GITHUB_ENV"
          echo "REPLAY_ZIP=$RUNNER_TEMP/chainlesschain-jetbrains.zip" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install repository CLI dependencies for canonical history only
        timeout-minutes: 10
        run: npm ci --workspace packages/cli --include-workspace-root=false --omit=optional --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Verify local replay and canonical persistence regressions
        timeout-minutes: 5
        run: node --test packages/jetbrains-plugin/scripts/archived-reply-evidence.test.mjs
      - name: Download exact approved public plugin and verify byte binding
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { validateNativePackageSetFile } from './packages/cli/scripts/verify01-native-retest-plan.mjs';
          import { validatePublicPlugin } from './packages/jetbrains-plugin/scripts/archived-reply-evidence.mjs';
          const selected = validateNativePackageSetFile(process.env.REPLAY_VERSIONS_FILE);
          const manifest = JSON.parse(selected.bytes);
          assert.equal(manifest.versions.jetbrains, '0.4.167');
          const origin = manifest.origin?.jetbrains;
          assert.equal(origin.approved, true); assert.equal(origin.listed, true); assert.equal(origin.hidden, false);
          assert.ok(Number.isSafeInteger(origin.updateId) && origin.updateId > 0);
          assert.equal(origin.file, `32208/${origin.updateId}/chainlesschain-ide-bridge-0.4.167.zip`);
          const response = await fetch(`https://plugins.jetbrains.com/files/${origin.file}`, { signal: AbortSignal.timeout(120000) });
          assert.equal(response.status, 200);
          const parts = []; let size = 0;
          for await (const part of response.body) { size += part.length; assert.ok(size <= 256 * 1024 * 1024); parts.push(part); }
          fs.writeFileSync(process.env.REPLAY_ZIP, Buffer.concat(parts), { flag: 'wx' });
          console.log(JSON.stringify(validatePublicPlugin(process.env.REPLAY_VERSIONS_FILE, process.env.REPLAY_ZIP)));
          NODE
      - name: Prepare fixed host toolchain and display
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          chmod +x packages/jetbrains-plugin/gradlew
          node scripts/lib/verify01-gradle-bootstrap.mjs --project-dir packages/jetbrains-plugin --artifact-dir "$RUNNER_TEMP/archived-reply-gradle"
      - name: Replay archived verify-33 through public .167 and restart the real IDE
        timeout-minutes: 30
        # No provider credentials are configured. The runner passes an explicit
        # credential-free environment and a fixed deterministic CLI peer.
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            node packages/jetbrains-plugin/scripts/verify01-archived-reply-recovery.mjs \
            --versions-file "$REPLAY_VERSIONS_FILE" --plugin-archive "$REPLAY_ZIP" --output "$REPLAY_OUTPUT"
      - name: Preserve independent recovery proof and failures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: verify33-archived-recovery-linux-2025.2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verify-33-archived-recovery/
            ${{ runner.temp }}/archived-reply-gradle/
            packages/jetbrains-plugin/build/reports/tests/uiSmokeTest/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
