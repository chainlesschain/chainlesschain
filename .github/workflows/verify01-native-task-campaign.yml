name: VERIFY01 Native 36 Plus 9 Task Campaign

# Register on the evaluation branch; paid execution requires workflow_dispatch.

on:
  push:
    branches: [feature/verify01-task-completion-20261017]
    paths:
      - .github/workflows/verify01-native-task-campaign.yml
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Run original 36 project tasks plus nine independent first runs through public native CLI and IDEs"
        type: boolean
        required: true
        default: false
      hosts:
        description: "Run all hosts or repeat a host after an infrastructure correction"
        type: choice
        required: true
        default: all
        options: [all, windows, linux, macos]
      entries:
        description: "Run all entries or repeat a corrected native adapter"
        type: choice
        required: true
        default: all
        options: [all, cli, vscode, jetbrains]
      accept_existing_run:
        description: "Optional completed delivery artifact run ID; performs acceptance only without paid model calls"
        type: string
        default: ""
      accept_existing_commit:
        description: "Exact delivery execution commit, required together with the existing run ID"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: verify01-native-36-plus-9-${{ inputs.hosts || 'all' }}-${{ inputs.entries || 'all' }}-${{ inputs.accept_existing_run || 'generate' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_live == true
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Validate exact sample selection, candidate binding and host controls
        run: >-
          node --test
          packages/cli/test-node/verify01-native-task-campaign.node-test.mjs
          packages/cli/test-node/verify01-native-task-checker.node-test.mjs
          packages/cli/test-node/verify01-vscode-composer.node-test.mjs
          packages/cli/test-node/verify01-volcengine-diagnostic-broker.node-test.mjs
      - name: Select requested native hosts
        id: select
        shell: bash
        env:
          HOST_SELECTION: ${{ inputs.hosts || 'all' }}
          ENTRY_SELECTION: ${{ inputs.entries || 'all' }}
          DELIVERY_RUN: ${{ inputs.accept_existing_run }}
          DELIVERY_COMMIT: ${{ inputs.accept_existing_commit }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const run = process.env.DELIVERY_RUN, commit = process.env.DELIVERY_COMMIT;
            if (!!run !== !!commit || (run && (!/^[1-9][0-9]+$/.test(run) || !/^[a-f0-9]{40}$/.test(commit)))) throw new Error("paired exact delivery run and commit required");
            const hosts = {windows: ["win32", "windows-latest"], linux: ["linux", "ubuntu-24.04"], macos: ["darwin", "macos-15"]};
            const selected = process.env.HOST_SELECTION;
            if (selected !== "all" && !Object.hasOwn(hosts, selected)) throw new Error("unknown host");
            const entries = ["cli", "vscode", "jetbrains"].filter(entry => process.env.ENTRY_SELECTION === "all" || process.env.ENTRY_SELECTION === entry);
            if (!entries.length) throw new Error("unknown entry");
            const rows = Object.entries(hosts).filter(([name]) => selected === "all" || name === selected).flatMap(([, [platform, os]]) => entries.map(entry => ({group: `${platform}-${entry}`, os, entry})));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include: rows})}\ngroups=${JSON.stringify(rows.map(row => row.group))}\n`);
          '

  generate:
    needs: validate
    if: inputs.accept_existing_run == ''
    name: Native ${{ matrix.group }} (five independent samples)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-native-tasks
    steps:
      - name: Preserve source byte identity on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - uses: actions/setup-java@v5
        if: matrix.entry == 'jetbrains'
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare exact VS Code host and local UI driver dependencies
        if: matrix.entry == 'vscode'
        working-directory: packages/vscode-extension
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @vscode/test-electron@3.1.0 ws@8.21.2
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode({version:'1.132.0',cachePath:require('node:path').resolve('.vscode-test')}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Install Linux virtual display
        if: runner.os == 'Linux' && matrix.entry != 'cli'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Prepare JetBrains Gradle wrapper
        if: matrix.entry == 'jetbrains' && runner.os != 'Windows'
        run: chmod +x packages/jetbrains-plugin/gradlew
      - name: Bootstrap exact Gradle
        if: matrix.entry == 'jetbrains'
        run: >-
          node scripts/lib/verify01-gradle-bootstrap.mjs
          --project-dir packages/jetbrains-plugin
          --artifact-dir "${{ runner.temp }}/verify01-native-gradle"
      - name: Run original project tasks through public native entry
        shell: bash
        env:
          VOLCENGINE_API_KEY: ${{ secrets.CC_LLM_API_KEY }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          EXECUTION_SOURCE_SHA: ${{ github.sha }}
        run: |
          display=()
          if [[ "$RUNNER_OS" == "Linux" && "$NATIVE_ENTRY" != "cli" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/cli/scripts/verify01-native-task-campaign.mjs \
            --entry "$NATIVE_ENTRY" --source-sha "$EXECUTION_SOURCE_SHA" \
            --confirm-live --output-dir "$RUNNER_TEMP/verify01-native-tasks"
      - name: Preserve all candidates, native traces, UI and broker failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-native-delivery-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/verify01-native-tasks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  accept:
    needs: [validate, generate]
    if: always() && needs.validate.result == 'success'
    name: Linux acceptance of ${{ matrix.group }} deliveries
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        group: ${{ fromJSON(needs.validate.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.accept_existing_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - uses: actions/download-artifact@v7
        with:
          name: verify01-native-delivery-${{ matrix.group }}-${{ inputs.accept_existing_commit || github.sha }}
          path: ${{ runner.temp }}/native-delivery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.accept_existing_run || github.run_id }}
      - name: Pin independent Linux checker image
        run: |
          docker pull node:22.12.0-bookworm
          echo "REVIEW_IMAGE_ID=$(docker image inspect node:22.12.0-bookworm --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Check source and candidate binding then execute baseline and behavioral controls
        env:
          EXECUTION_SOURCE_SHA: ${{ inputs.accept_existing_commit || github.sha }}
        run: >-
          node packages/cli/scripts/verify01-native-task-checker.mjs
          --input-dir "$RUNNER_TEMP/native-delivery"
          --output-dir "$RUNNER_TEMP/native-acceptance"
          --source-sha "$EXECUTION_SOURCE_SHA" --image-id "$REVIEW_IMAGE_ID"
      - name: Preserve independent checker receipts including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-native-acceptance-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
