name: VERIFY01 Native 36 Plus 9 Task Campaign

# Register on the evaluation branch; paid execution requires workflow_dispatch.

on:
  push:
    branches: [feature/verify01-task-completion-20261017]
    paths:
      - .github/workflows/verify01-native-task-campaign.yml
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Run original 36 project tasks plus nine independent first runs through public native CLI and IDEs"
        type: boolean
        required: true
        default: false
      provider:
        description: "Diagnostic provider; OpenAI starts a separate cohort and requires the dedicated OPENAI_API_KEY secret"
        type: choice
        required: true
        default: volcengine
        options: [volcengine, openai]
      hosts:
        description: "Run all hosts or repeat a host after an infrastructure correction"
        type: choice
        required: true
        default: all
        options: [all, windows, linux, macos]
      entries:
        description: "Run all entries or repeat a corrected native adapter"
        type: choice
        required: true
        default: all
        options: [all, cli, vscode, jetbrains]
      package_set:
        description: "Latest public packages for unfinished tasks; frozen is only for account-free historical acceptance"
        type: choice
        required: true
        default: latest
        options: [latest, frozen, prerelease]
      package_set_file:
        description: "Committed exact package-set manifest for this round; keep prior manifests unchanged"
        type: string
        default: "docs/research/cli/verify01-package-sets/2026-10-18-latest.json"
      sample_ids:
        description: "Optional comma-separated unfinished sample IDs; requires one host and one entry. Subset artifacts stay separate from full 36+9 rounds."
        type: string
        default: ""
      project_revision_file:
        description: "Optional committed repaired-source follow-up identity; old frozen scores remain unchanged"
        type: string
        default: ""
      fetch_diagnostics:
        description: "Passive fetch error capture for one host, CLI entry and explicit unfinished sample IDs only"
        type: boolean
        required: false
        default: false
      review_changes:
        description: "Opt in to generic change review within the existing model/request budgets; not acceptance evidence"
        type: boolean
        required: false
        default: false
      accept_existing_run:
        description: "Optional completed delivery artifact run ID; performs acceptance only without paid model calls"
        type: string
        default: ""
      accept_existing_commit:
        description: "Exact delivery execution commit, required together with the existing run ID"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  NATIVE_PROVIDER: ${{ inputs.provider || 'volcengine' }}
  NATIVE_PACKAGE_SET: ${{ inputs.package_set || 'latest' }}
  NATIVE_PACKAGE_SET_FILE: ${{ inputs.package_set_file || 'docs/research/cli/verify01-package-sets/2026-10-18-latest.json' }}

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_live == true
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      groups: ${{ steps.select.outputs.groups }}
      sample_key: ${{ steps.select.outputs.sample_key }}
      acceptance_matrix: ${{ steps.select.outputs.acceptance_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Prepare operator workspace dependency
        # Source capability contracts; public CLI installs remain independent.
        run: >-
          npm ci --workspace @chainlesschain/context-memory-kernel
          --include-workspace-root=false --omit=dev --ignore-scripts
          --legacy-peer-deps --no-audit --no-fund
      - name: Validate exact sample selection, candidate binding and host controls
        # Fixtures select their own provider/package identity. Operator inputs
        # remain available to the actual selection and execution steps below.
        env:
          NATIVE_PROVIDER: ""
          NATIVE_PACKAGE_SET: ""
          NATIVE_PACKAGE_SET_FILE: ""
          NATIVE_PROJECT_REVISION_FILE: ""
        run: >-
          node --test
          packages/cli/test-node/verify01-native-task-campaign.node-test.mjs
          packages/cli/test-node/verify01-project-revision.node-test.mjs
          packages/cli/test-node/verify01-prerelease-package-set.node-test.mjs
          packages/cli/test-node/verify01-release-candidate-replay.node-test.mjs
          packages/cli/test-node/verify01-native-plugin-artifact.node-test.mjs
          packages/cli/test-node/verify01-public-generator-binding.node-test.mjs
          packages/cli/test-node/verify01-public-planning-window.node-test.mjs
          packages/cli/test-node/verify01-native-subset.node-test.mjs
          packages/cli/test-node/verify01-native-retest-plan.node-test.mjs
          packages/cli/test-node/verify01-native-retest-round.node-test.mjs
          packages/cli/test-node/verify01-native-retest-supersession.node-test.mjs
          packages/cli/test-node/verify01-native-task-checker.node-test.mjs
          packages/cli/test-node/verify01-fetch-diagnostics.node-test.mjs
          packages/cli/test-node/verify01-legacy-windows-tar.node-test.mjs
          packages/cli/test-node/verify01-vscode-composer.node-test.mjs
          packages/cli/test-node/verify01-ide-terminal.node-test.mjs
          packages/cli/test-node/verify01-volcengine-diagnostic-broker.node-test.mjs
          packages/cli/test-node/verify01-openai-diagnostic-broker.node-test.mjs
          packages/cli/test-node/verify01-openai-transport-preload.node-test.mjs
          packages/cli/test-node/verify01-native-provider-profile.node-test.mjs
          packages/cli/test-node/verify01-native-round-matrix.node-test.mjs
          packages/jetbrains-plugin/scripts/verify01-native-task-adapter.test.mjs
      - name: Select requested native hosts
        id: select
        shell: bash
        env:
          HOST_SELECTION: ${{ inputs.hosts || 'all' }}
          ENTRY_SELECTION: ${{ inputs.entries || 'all' }}
          DELIVERY_RUN: ${{ inputs.accept_existing_run }}
          DELIVERY_COMMIT: ${{ inputs.accept_existing_commit }}
          SAMPLE_SELECTION: ${{ inputs.sample_ids }}
          PACKAGE_SET_SELECTION: ${{ inputs.package_set || 'latest' }}
          FETCH_DIAGNOSTICS: ${{ inputs.fetch_diagnostics && 'true' || 'false' }}
          NATIVE_PROJECT_REVISION_FILE: ${{ inputs.project_revision_file || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
        run: |
          node --input-type=module <<'NODE'
            import fs from "node:fs";
            import {parseNativeSampleIds, selectNativeSamples, validateNativeProjectSelection} from "./packages/cli/scripts/verify01-native-task-campaign.mjs";
            import {loadNativeProjectRevision} from "./packages/cli/scripts/verify01-project-revision.mjs";
            import {DIAGNOSTIC} from "./packages/cli/scripts/verify01-volcengine-task-diagnostic.mjs";
            import {validateNativePackageSetFile, assertUnfinishedNativeSamples} from "./packages/cli/scripts/verify01-native-retest-plan.mjs";
            import {nativeProviderCells} from "./packages/cli/scripts/verify01-native-round-matrix.mjs";
            import {nativeProviderProfile} from "./packages/cli/scripts/verify01-native-provider-profile.mjs";
            import {prereleasePackageBinding} from "./packages/cli/scripts/verify01-prerelease-package-set.mjs";
            import {loadPublicGeneratorProof} from "./packages/cli/scripts/verify01-public-generator-binding.mjs";
            const provider = nativeProviderProfile(process.env.NATIVE_PROVIDER || "volcengine").provider;
            const run = process.env.DELIVERY_RUN, commit = process.env.DELIVERY_COMMIT;
            if (!!run !== !!commit || (run && (!/^[1-9][0-9]+$/.test(run) || !/^[a-f0-9]{40}$/.test(commit)))) throw new Error("paired exact delivery run and commit required");
            const packageSet = process.env.PACKAGE_SET_SELECTION || "latest";
            if (!["latest", "frozen", "prerelease"].includes(packageSet)) throw new Error("unknown package set");
            if (!run && !["latest", "prerelease"].includes(packageSet)) throw new Error("Further model execution requires explicitly selected public or prerelease packages");
            const packageBinding = packageSet !== "frozen" ? validateNativePackageSetFile(process.env.NATIVE_PACKAGE_SET_FILE || undefined) : null;
            const candidate = packageBinding ? prereleasePackageBinding(JSON.parse(packageBinding.bytes.toString("utf8"))) : null;
            if ((packageSet === "prerelease") !== Boolean(candidate)) throw new Error("prerelease selection requires an explicit committed candidate package identity");
            const basePlanDir = "docs/research/cli/verify01-plan-2026-10-13-volcengine";
            const project = loadNativeProjectRevision({
              revisionFile: process.env.NATIVE_PROJECT_REVISION_FILE || undefined,
              plan: JSON.parse(fs.readFileSync(`${basePlanDir}/plan.json`, "utf8")),
              catalog: JSON.parse(fs.readFileSync(`${basePlanDir}/tasks.json`, "utf8")),
              bindings: JSON.parse(fs.readFileSync(`${basePlanDir}/comparison-bindings.json`, "utf8")),
              baseProjectCommit: DIAGNOSTIC.projectCommit, basePlanDigest: DIAGNOSTIC.planDigest,
            });
            validateNativeProjectSelection(project.revisionBinding, parseNativeSampleIds(process.env.SAMPLE_SELECTION));
            if (project.revisionBinding && provider !== "openai") throw new Error("repaired-source follow-up requires the explicit OpenAI diagnostic cohort");
            if (provider === "openai") {
              if (!["latest", "prerelease"].includes(packageSet)) throw new Error("OpenAI cohort requires an explicit public or prerelease package set");
              const cli = JSON.parse(fs.readFileSync("packages/cli/package.json", "utf8")).version;
              const vscode = JSON.parse(fs.readFileSync("packages/vscode-extension/package.json", "utf8")).version;
              const jetbrains = fs.readFileSync("packages/jetbrains-plugin/src/main/resources/META-INF/plugin.xml", "utf8").match(/^\s*<version>([^<]+)<\/version>\s*$/m)?.[1];
              if (candidate) {
                if (!project.revisionBinding || candidate.sourceCommit !== project.projectCommit) throw new Error("Candidate engine and maintained project must use the same explicit repaired source");
                for (const [name, version] of Object.entries({cli, vscode, jetbrains})) if (!version || packageBinding.versions[name] !== version) throw new Error("Candidate versions must match the checked-out prepared release");
              } else if (project.revisionBinding) {
                const manifest = JSON.parse(packageBinding.bytes.toString("utf8"));
                const {binding} = loadPublicGeneratorProof(manifest, {repositoryRoot: process.cwd()});
                if (binding.jetbrainsMarketplacePending && binding.distribution !== "mixed-public-and-official-artifact") throw new Error("Pending IDE requires the exact official artifact");
                const response = await fetch("https://registry.npmjs.org/chainlesschain/latest", {signal: AbortSignal.timeout(30000), headers: {"cache-control":"no-cache"}});
                if (!response.ok || (await response.json()).version !== packageBinding.versions.cli) throw new Error("Repaired-source generator CLI must still be the latest public npm release");
              } else {
                for (const [name, version] of Object.entries({cli, vscode, jetbrains})) if (!version || packageBinding.versions[name] !== version) throw new Error("OpenAI cohort requires the exact current CLI and both IDE versions");
              }
              if (!run && !process.env.OPENAI_API_KEY?.trim()) throw new Error("Dedicated repository OPENAI_API_KEY is required; the Volcengine credential must not be reused");
              if (!run && Number(process.env.GITHUB_RUN_ATTEMPT || "1") !== 1) throw new Error("Reconcile the previous live attempt before a new OpenAI dispatch");
            }
            const hosts = {windows: ["win32", "windows-latest"], linux: ["linux", "ubuntu-24.04"], macos: ["darwin", "macos-15"]};
            const selected = process.env.HOST_SELECTION;
            if (selected !== "all" && !Object.hasOwn(hosts, selected)) throw new Error("unknown host");
            const entries = ["cli", "vscode", "jetbrains"].filter(entry => process.env.ENTRY_SELECTION === "all" || process.env.ENTRY_SELECTION === entry);
            if (!entries.length) throw new Error("unknown entry");
            let rows = Object.entries(hosts).filter(([name]) => selected === "all" || name === selected).flatMap(([, [platform, os]]) => entries.map(entry => ({group: `${platform}-${entry}`, os, entry})));
            const ids = parseNativeSampleIds(process.env.SAMPLE_SELECTION);
            const sampleKey = ids ? [...ids].sort().join("-") : "all";
            if (sampleKey.length > 160 || !/^[a-z0-9-]+$/.test(sampleKey)) throw new Error("sample concurrency key exceeds canonical bounds");
            if (provider === "volcengine" && !run && entries.includes("jetbrains") && (!ids || ids.length !== 1)) throw new Error("JetBrains generation requires exactly one explicit sample per dispatch");
            const fetchDiagnostics = process.env.FETCH_DIAGNOSTICS || "false";
            if (!["true", "false"].includes(fetchDiagnostics)) throw new Error("invalid fetch diagnostics flag");
            if (fetchDiagnostics === "true" && (run || rows.length !== 1 || rows[0].entry !== "cli" || !ids)) throw new Error("fetch diagnostics require new CLI generation, exactly one host and explicit sample IDs");
            if (ids) {
              if (rows.length !== 1) throw new Error("explicit sample IDs require exactly one host and one entry");
              const plan = JSON.parse(fs.readFileSync("docs/research/cli/verify01-plan-2026-10-13-volcengine/plan.json", "utf8"));
              selectNativeSamples(plan, rows[0].group.split("-")[0], rows[0].entry, ids);
            }
            if (!run && provider === "volcengine") {
              assertUnfinishedNativeSamples(ids, {versionsFile: process.env.NATIVE_PACKAGE_SET_FILE || undefined});
            }
            const taskPlan = JSON.parse(fs.readFileSync("docs/research/cli/verify01-plan-2026-10-13-volcengine/plan.json", "utf8"));
            rows = nativeProviderCells(rows, taskPlan, ids, provider);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include: rows})}\ngroups=${JSON.stringify([...new Set(rows.map(row => row.group))])}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `acceptance_matrix=${JSON.stringify({include: rows.map(({group, cell_id, sample_ids}) => ({group, cell_id, sample_ids}))})}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sample_key=${sampleKey}\n`);
          NODE

  generate:
    needs: validate
    if: inputs.accept_existing_run == ''
    name: Native ${{ matrix.cell_id || matrix.group }} (${{ (matrix.sample_ids != '' || inputs.sample_ids != '') && 'selected samples' || 'five independent samples' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 145
    # Run identity prevents GitHub replacing a pending dispatch, even when an
    # operator accidentally repeats the same canonical sample selection.
    concurrency:
      group: native-${{ matrix.cell_id || matrix.group }}-${{ needs.validate.outputs.sample_key }}-${{ github.run_id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-native-tasks
    steps:
      - name: Preserve source byte identity on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Prepare operator workspace dependency
        run: >-
          npm ci --workspace @chainlesschain/context-memory-kernel
          --include-workspace-root=false --omit=dev --ignore-scripts
          --legacy-peer-deps --no-audit --no-fund
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Verify Unicode frozen archive extraction before model execution
        if: runner.os == 'Windows'
        run: |
          python -X utf8 -m unittest discover -s packages/cli/test-python -p test_verify01_extract_windows_archive.py
          node --test --test-name-pattern="native extraction" packages/cli/test-node/verify01-native-task-campaign.node-test.mjs
      - uses: actions/setup-java@v5
        if: matrix.entry == 'jetbrains'
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare exact VS Code host and local UI driver dependencies
        if: matrix.entry == 'vscode'
        working-directory: packages/vscode-extension
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @vscode/test-electron@3.1.0 ws@8.21.2
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode({version:'1.132.0',cachePath:require('node:path').resolve('.vscode-test')}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Install Linux virtual display
        if: runner.os == 'Linux' && matrix.entry != 'cli'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Prepare JetBrains Gradle wrapper
        if: matrix.entry == 'jetbrains' && runner.os != 'Windows'
        run: chmod +x packages/jetbrains-plugin/gradlew
      - name: Bootstrap exact Gradle
        if: matrix.entry == 'jetbrains'
        run: >-
          node scripts/lib/verify01-gradle-bootstrap.mjs
          --project-dir packages/jetbrains-plugin
          --artifact-dir "${{ runner.temp }}/verify01-native-gradle"
      - name: Download exact tested JetBrains build when explicitly selected
        if: matrix.entry == 'jetbrains' && inputs.package_set == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          node packages/cli/scripts/verify01-native-plugin-artifact.mjs
          "$NATIVE_PACKAGE_SET_FILE" "$RUNNER_TEMP/verify01-jetbrains-build"
      - name: Download and verify explicitly selected prerelease CLI and IDE packages
        if: inputs.package_set == 'prerelease'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node packages/cli/scripts/verify01-prerelease-package-set.mjs
          "$NATIVE_PACKAGE_SET_FILE" "${{ runner.temp }}/verify01-prerelease-packages"
      - name: Run original project tasks through installed native entry
        timeout-minutes: 115
        shell: bash
        env:
          VOLCENGINE_API_KEY: ${{ inputs.provider != 'openai' && secrets.CC_LLM_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          NATIVE_ENTRY: ${{ matrix.entry }}
          EXECUTION_SOURCE_SHA: ${{ github.sha }}
          NATIVE_SAMPLES: ${{ matrix.sample_ids || inputs.sample_ids }}
          FETCH_DIAGNOSTICS: ${{ inputs.fetch_diagnostics && 'true' || 'false' }}
          REVIEW_CHANGES: ${{ inputs.review_changes && 'true' || 'false' }}
          NATIVE_PROJECT_REVISION_FILE: ${{ inputs.project_revision_file || '' }}
        run: |
          display=()
          selection=()
          package=()
          diagnostics=()
          review=()
          revision=()
          if [[ -n "$NATIVE_PROJECT_REVISION_FILE" ]]; then
            revision=(--project-revision-file "$NATIVE_PROJECT_REVISION_FILE")
          fi
          if [[ "$REVIEW_CHANGES" == "true" ]]; then
            review=(--review-changes)
          fi
          if [[ "$FETCH_DIAGNOSTICS" == "true" ]]; then
            diagnostics=(--fetch-diagnostics)
          fi
          if [[ "$NATIVE_PACKAGE_SET" == "latest" || "$NATIVE_PACKAGE_SET" == "prerelease" ]]; then
            package=(--versions-file "$NATIVE_PACKAGE_SET_FILE")
          fi
          if [[ -n "$NATIVE_SAMPLES" ]]; then
            selection=(--samples "$NATIVE_SAMPLES")
          fi
          if [[ "$RUNNER_OS" == "Linux" && "$NATIVE_ENTRY" != "cli" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/cli/scripts/verify01-native-task-campaign.mjs \
            --entry "$NATIVE_ENTRY" --source-sha "$EXECUTION_SOURCE_SHA" \
            --provider "$NATIVE_PROVIDER" \
            --confirm-live --output-dir "$RUNNER_TEMP/verify01-native-tasks" "${selection[@]}" "${package[@]}" "${diagnostics[@]}" "${review[@]}" "${revision[@]}"
      - name: Preserve all candidates, native traces, UI and broker failures
        timeout-minutes: 15
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-native-${{ inputs.sample_ids != '' && 'subset-delivery' || 'delivery' }}-${{ matrix.cell_id || matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/verify01-native-tasks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  accept:
    needs: [validate, generate]
    if: always() && needs.validate.result == 'success'
    name: Linux acceptance of ${{ matrix.cell_id || matrix.group }} deliveries
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.validate.outputs.acceptance_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Prepare operator workspace dependency
        run: >-
          npm ci --workspace @chainlesschain/context-memory-kernel
          --include-workspace-root=false --omit=dev --ignore-scripts
          --legacy-peer-deps --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          name: verify01-native-${{ inputs.sample_ids != '' && 'subset-delivery' || 'delivery' }}-${{ matrix.cell_id || matrix.group }}-${{ inputs.accept_existing_commit || github.sha }}
          path: ${{ runner.temp }}/native-delivery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.accept_existing_run || github.run_id }}
      - name: Bind OpenAI delivery identity before acceptance
        if: inputs.provider == 'openai'
        env:
          EXPECTED_DELIVERY_SHA: ${{ inputs.accept_existing_commit || github.sha }}
          NATIVE_PROJECT_REVISION_FILE: ${{ inputs.project_revision_file || '' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
            import fs from "node:fs";
            import path from "node:path";
            import {assertNativeProviderIdentity} from "./packages/cli/scripts/verify01-native-provider-profile.mjs";
            import {validateNativePackageSetFile} from "./packages/cli/scripts/verify01-native-retest-plan.mjs";
            import {loadNativeProjectRevision} from "./packages/cli/scripts/verify01-project-revision.mjs";
            import {DIAGNOSTIC} from "./packages/cli/scripts/verify01-volcengine-task-diagnostic.mjs";
            const summary = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "native-delivery", "summary.json"), "utf8"));
            const packageBinding = validateNativePackageSetFile(process.env.NATIVE_PACKAGE_SET_FILE);
            const basePlanDir = "docs/research/cli/verify01-plan-2026-10-13-volcengine";
            const project = loadNativeProjectRevision({
              revisionFile: process.env.NATIVE_PROJECT_REVISION_FILE || undefined,
              plan: JSON.parse(fs.readFileSync(`${basePlanDir}/plan.json`, "utf8")),
              catalog: JSON.parse(fs.readFileSync(`${basePlanDir}/tasks.json`, "utf8")),
              bindings: JSON.parse(fs.readFileSync(`${basePlanDir}/comparison-bindings.json`, "utf8")),
              baseProjectCommit: DIAGNOSTIC.projectCommit, basePlanDigest: DIAGNOSTIC.planDigest,
            });
            assertNativeProviderIdentity(summary, "openai", process.env.EXPECTED_DELIVERY_SHA, packageBinding, project);
          NODE
      - name: Pin independent Linux checker image
        run: |
          docker pull node:22.12.0-bookworm
          echo "REVIEW_IMAGE_ID=$(docker image inspect node:22.12.0-bookworm --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Check source and candidate binding then execute baseline and behavioral controls
        env:
          EXECUTION_SOURCE_SHA: ${{ inputs.accept_existing_commit || github.sha }}
          CHECKER_SOURCE_SHA: ${{ github.sha }}
          NATIVE_SAMPLES: ${{ matrix.sample_ids || inputs.sample_ids }}
          NATIVE_PROJECT_REVISION_FILE: ${{ inputs.project_revision_file || '' }}
        shell: bash
        run: |
          selection=()
          package=()
          revision=()
          if [[ -n "$NATIVE_PROJECT_REVISION_FILE" ]]; then
            revision=(--project-revision-file "$NATIVE_PROJECT_REVISION_FILE")
          fi
          if [[ "$NATIVE_PACKAGE_SET" == "latest" || "$NATIVE_PACKAGE_SET" == "prerelease" ]]; then
            package=(--versions-file "$NATIVE_PACKAGE_SET_FILE")
          fi
          if [[ -n "$NATIVE_SAMPLES" ]]; then
            selection=(--samples "$NATIVE_SAMPLES")
          fi
          node packages/cli/scripts/verify01-native-task-checker.mjs \
            --input-dir "$RUNNER_TEMP/native-delivery" \
            --output-dir "$RUNNER_TEMP/native-acceptance" \
            --source-sha "$EXECUTION_SOURCE_SHA" --checker-source-sha "$CHECKER_SOURCE_SHA" \
            --image-id "$REVIEW_IMAGE_ID" "${selection[@]}" "${package[@]}" "${revision[@]}"
      - name: Preserve independent checker receipts including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-native-${{ inputs.sample_ids != '' && 'subset-acceptance' || 'acceptance' }}-${{ matrix.cell_id || matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
