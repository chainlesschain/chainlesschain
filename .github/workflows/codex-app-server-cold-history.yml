# Independent strict observations; failures remain visible.
# This workflow never changes experimental or production admission.
name: Codex App Server Cold History
"on":
  workflow_dispatch: null
  push:
    branches:
      - main
      - feature/**
    paths:
      - packages/cli/src/lib/codex-app-server-adapter.js
      - packages/cli/src/lib/codex-app-server-support.js
      - packages/cli/scripts/codex-app-server-support.mjs
      - packages/cli/__tests__/unit/codex-app-server-support.test.js
      - docs/cli/CODEX_APP_SERVER_SUPPORT.generated.md
      - packages/cli/src/lib/external-agent-adapters.js
      - packages/cli/scripts/codex-app-server-compatibility.mjs
      - packages/cli/scripts/verify-codex-app-server-schema.mjs
      - packages/cli/scripts/codex-app-server-turn-probe.mjs
      - packages/cli/scripts/codex-app-server-history-probe.mjs
      - packages/cli/__tests__/unit/codex-app-server-history-probe.test.js
      - packages/cli/__tests__/unit/codex-app-server-turn-probe.test.js
      - packages/cli/__tests__/fixtures/external-agent/codex-app-server*
      - packages/cli/__tests__/unit/codex-app-server-official-schema.test.js
      - packages/cli/__tests__/unit/codex-app-server-adapter.test.js
      - packages/cli/__tests__/unit/external-agent-adapters.test.js
      - .github/workflows/codex-app-server-compatibility.yml
      - .github/workflows/codex-app-server-cold-history.yml
  pull_request:
    paths:
      - packages/cli/src/lib/codex-app-server-adapter.js
      - packages/cli/src/lib/codex-app-server-support.js
      - packages/cli/scripts/codex-app-server-support.mjs
      - packages/cli/__tests__/unit/codex-app-server-support.test.js
      - docs/cli/CODEX_APP_SERVER_SUPPORT.generated.md
      - packages/cli/src/lib/external-agent-adapters.js
      - packages/cli/scripts/codex-app-server-compatibility.mjs
      - packages/cli/scripts/verify-codex-app-server-schema.mjs
      - packages/cli/scripts/codex-app-server-turn-probe.mjs
      - packages/cli/scripts/codex-app-server-history-probe.mjs
      - packages/cli/__tests__/unit/codex-app-server-history-probe.test.js
      - packages/cli/__tests__/unit/codex-app-server-turn-probe.test.js
      - packages/cli/__tests__/fixtures/external-agent/codex-app-server*
      - packages/cli/__tests__/unit/codex-app-server-official-schema.test.js
      - packages/cli/__tests__/unit/codex-app-server-adapter.test.js
      - packages/cli/__tests__/unit/external-agent-adapters.test.js
      - .github/workflows/codex-app-server-compatibility.yml
      - .github/workflows/codex-app-server-cold-history.yml
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
env:
  COMPAT_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
jobs:
  support-config:
    name: Read shared compatibility manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compatibility: "${{ steps.matrix.outputs.compatibility }}"
      schema: "${{ steps.matrix.outputs.schema }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.COMPAT_SHA }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
      - name: Verify exact source identity
        shell: bash
        run: 'test "$(git rev-parse HEAD)" = "${COMPAT_SHA}"'
      - id: matrix
        run: node packages/cli/scripts/codex-app-server-support.mjs --github-output
      - name: Check generated support documentation
        run: >-
          node packages/cli/scripts/codex-app-server-support.mjs --check
          docs/cli/CODEX_APP_SERVER_SUPPORT.generated.md
  cold-history:
    name: "Codex ${{ matrix.codex_version }} first cold scans (${{ matrix.runner }}, no admission)"
    needs: support-config
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.support-config.outputs.schema) }}"
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 15
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ env.COMPAT_SHA }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
      - name: Install locked CLI schema-validator dependencies
        run: npm ci --ignore-scripts --workspace=packages/cli --include-workspace-root=false --no-audit --no-fund
      - name: Install pinned schema generator and compare its unmodified output
        shell: bash
        run: >
          test "$(git rev-parse HEAD)" = "${COMPAT_SHA}"

          npm install --prefix "${RUNNER_TEMP}/codex-schema-install" --no-package-lock --no-save
          --ignore-scripts --no-audit --no-fund "@openai/codex@${{ matrix.codex_version }}"

          CODEX_GENERATOR="${RUNNER_TEMP}/codex-schema-install/node_modules/@openai/codex/bin/codex.js"

          test "$(node "${CODEX_GENERATOR}" --version)" = "codex-cli ${{ matrix.codex_version }}"

          node "${CODEX_GENERATOR}" app-server generate-json-schema --out
          "${RUNNER_TEMP}/codex-generated-schema"

          node packages/cli/scripts/verify-codex-app-server-schema.mjs --schema-dir
          "${RUNNER_TEMP}/codex-generated-schema" --version "${{ matrix.codex_version }}"
      - name: Require complete first asc and desc scans in independent unindexed homes
        shell: bash
        run: >-
          node packages/cli/scripts/codex-app-server-history-probe.mjs --version "${{ matrix.codex_version }}"
          --commit-sha "${COMPAT_SHA}" --codex-js
          "${RUNNER_TEMP}/codex-schema-install/node_modules/@openai/codex/bin/codex.js" --output
          "${RUNNER_TEMP}/codex-turn-probe/history.json" --scope scan-repair
      - name: Retain first-scan failures and later repair observations
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: >-
            codex-cold-history-${{ matrix.codex_version }}-${{ matrix.runner }}-${{ env.COMPAT_SHA }}-${{
            github.run_attempt }}
          path: "${{ runner.temp }}/codex-turn-probe/"
          if-no-files-found: error
          retention-days: 90
