name: MCP Reference Interoperability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/cli/src/harness/mcp-client.js"
      - "packages/cli/scripts/mcp-reference-*.mjs"
      - "packages/cli/scripts/interop/mcp-reference/**"
      - ".github/workflows/mcp-reference-interop.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "packages/cli/src/harness/mcp-client.js"
      - "packages/cli/scripts/mcp-reference-*.mjs"
      - "packages/cli/scripts/interop/mcp-reference/**"
      - ".github/workflows/mcp-reference-interop.yml"

permissions:
  contents: read

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
      - uses: ./.github/actions/setup-node-deps
      - name: Install locked reference server and SDK
        run: npm ci --prefix packages/cli/scripts/interop/mcp-reference --ignore-scripts --no-audit --no-fund
      - name: Exercise real server with explicit response-loss injection
        shell: bash
        run: >-
          node packages/cli/scripts/mcp-reference-interop.mjs
          --server-root packages/cli/scripts/interop/mcp-reference/node_modules/@modelcontextprotocol/server-everything
          --output "$RUNNER_TEMP/mcp-reference.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-reference-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mcp-reference.json
          if-no-files-found: error
