name: Publish workspace packages to npm

on:
  push:
    tags:
      - "v-packages-*"
      - "v[0-9]*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific workspace package, e.g. "@chainlesschain/core-db@0.1.4". The CLI, Agent SDK, and Context Memory Kernel are released only by npm-publish.yml.'
        required: false
        type: string
      dry-run:
        description: "Dry run (npm publish --dry-run, no actual publish)"
        required: false
        type: boolean
        default: false
      force:
        description: "Force publish even if version already exists on npm"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # npm Trusted Publishing requires Node.js 22.14.0 or newer.
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Enable npm Trusted Publishing support
        run: |
          npm install --global npm@11.18.0
          npm --version

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Detect packages to publish
        id: detect
        run: node scripts/ci/detect-publishable-packages.mjs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          GITHUB_REF: ${{ github.ref }}

      - name: Build packages
        if: steps.detect.outputs.has_packages == 'true'
        shell: bash
        run: |
          while IFS= read -r pkg_dir; do
            [ -z "$pkg_dir" ] && continue
            npm run build --if-present --workspace="./packages/$pkg_dir"
          done < .publish-order.txt

      # setup-node writes a token placeholder to its temporary npmrc. Remove it
      # after dependency installation so live publishing can only authenticate
      # with the short-lived GitHub OIDC identity. Each existing npm package
      # must trust this workflow filename before its next live release.
      - name: Enforce tokenless OIDC publishing
        if: steps.detect.outputs.has_packages == 'true'
        run: npm config delete //registry.npmjs.org/:_authToken --location=user

      - name: Publish packages in dependency order
        if: steps.detect.outputs.has_packages == 'true'
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -e
          echo "=== Publish order ==="
          cat .publish-order.txt
          echo "====================="

          while IFS= read -r pkg_dir; do
            [ -z "$pkg_dir" ] && continue
            echo ""
            echo "▶ Publishing packages/$pkg_dir ..."

            PKG_NAME=$(node -p "require('./packages/$pkg_dir/package.json').name")
            PKG_VER=$(node -p "require('./packages/$pkg_dir/package.json').version")
            echo "  → $PKG_NAME@$PKG_VER"

            # The CLI, Agent SDK, and its Context Memory Kernel dependency share
            # a separate exact-SHA, three-platform release workflow and npm
            # Trusted Publisher identity. Keep this second check in the publish
            # loop so a detector regression cannot bypass that authority or
            # select an untrusted workflow identity.
            if [ "$pkg_dir" = "cli" ] || [ "$PKG_NAME" = "chainlesschain" ] || \
               [ "$pkg_dir" = "agent-sdk" ] || [ "$PKG_NAME" = "@chainlesschain/agent-sdk" ] || \
               [ "$pkg_dir" = "context-memory-kernel" ] || [ "$PKG_NAME" = "@chainlesschain/context-memory-kernel" ]; then
              echo "  ✗ Refusing protected CLI/Agent SDK/Context Memory package; use npm-publish.yml" >&2
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              (cd "packages/$pkg_dir" && npm publish --dry-run --access public) || { echo "  ✗ Dry-run failed for $PKG_NAME"; exit 1; }
              echo "  ✓ Dry-run OK for $PKG_NAME@$PKG_VER"
            else
              (cd "packages/$pkg_dir" && npm publish --access public --provenance) || { echo "  ✗ Publish FAILED for $PKG_NAME"; exit 1; }
              echo "  ✓ Published $PKG_NAME@$PKG_VER"
              sleep 3  # allow registry propagation before next package installs it
            fi
          done < .publish-order.txt

          echo ""
          echo "=== All packages processed successfully ==="

      - name: Job Summary
        if: always()
        run: |
          echo "## npm Publish Result" >> $GITHUB_STEP_SUMMARY
          if [ -f .publish-order.txt ] && [ -s .publish-order.txt ]; then
            echo "### Published packages:" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r pkg_dir; do
              [ -z "$pkg_dir" ] && continue
              NAME=$(node -p "require('./packages/$pkg_dir/package.json').name")
              VER=$(node -p "require('./packages/$pkg_dir/package.json').version")
              echo "- \`$NAME@$VER\`" >> $GITHUB_STEP_SUMMARY
            done < .publish-order.txt
          else
            echo "No packages needed publishing." >> $GITHUB_STEP_SUMMARY
          fi
