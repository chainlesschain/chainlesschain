name: IDE Extensions

# Builds the two IDE-bridge editor extensions and uploads their artifacts.
# Publishing to the marketplaces happens ONLY on a dedicated tag. A normal
# push just builds + uploads.
#
#   tag ide-vscode-v*     -> publish the VS Code extension to Open VSX
#                                                            (needs OVSX_PAT)
#   manual exact VS tag   -> backfill Microsoft Marketplace (needs OVSX_PAT +
#                                                             VSCE_PAT)
#   tag ide-jetbrains-v*  -> publish the JetBrains plugin     (needs publish
#                                                             token; signing
#                                                             is recommended)

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode-extension/**"
      - "packages/jetbrains-plugin/**"
      - "packages/agent-sdk/**"
      - "packages/agent-protocol/**"
      - "desktop-app-vue/src/renderer/utils/keyboard-shortcuts.ts"
      - "desktop-app-vue/src/renderer/components/common/CommandPalette.vue"
      - "packages/cli/src/lib/capability-manifest.js"
      - "packages/cli/src/lib/public-ide-capability-*.js"
      - "packages/cli/src/lib/browser-evidence.js"
      - "packages/cli/src/lib/chrome-connector.js"
      - "packages/cli/src/lib/artifact-store.js"
      - "packages/cli/src/lib/secret-scan.js"
      - "packages/cli/src/lib/credential-guard.js"
      - "packages/cli/src/lib/with-file-lock.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/runtime/coding-agent-contract-shared.cjs"
      - "packages/cli/scripts/ide-roadmap-browser-evidence.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-browser-evidence.mjs"
      - "packages/cli/__tests__/unit/browser-evidence.test.js"
      - "packages/cli/__tests__/unit/ide-roadmap-browser-evidence.test.js"
      - "packages/cli/__tests__/unit/chrome-connector-actions.test.js"
      - "packages/cli/__tests__/unit/browser-act-tool.test.js"
      - "packages/cli/__tests__/unit/browser-state-tool.test.js"
      - "packages/cli/__tests__/unit/chrome-connector.test.js"
      - "packages/cli/__tests__/unit/artifact-store.test.js"
      - "packages/cli/__tests__/unit/coding-agent-contract.test.js"
      - "packages/cli/package.json"
      - "package-lock.json"
      - "packages/cli/src/command-manifest.json"
      - "packages/cli/src/command-help-index.json"
      - "packages/cli/scripts/gen-public-ide-capability-manifest.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/__tests__/unit/verify-ide-roadmap-fixtures.test.js"
      - "docs/cli/PUBLIC_IDE_CAPABILITY_MANIFEST.generated.json"
      - "package.json"
      - "scripts/ide-journey-evidence.mjs"
      - "packages/vscode-extension/test/remote-ssh-container/**"
      - "packages/vscode-extension/test/remote-ssh-container.test.cjs"
      - "scripts/verify-ide-marketplace.mjs"
      - "tests/fixtures/ide-roadmap/**"
      - ".github/workflows/ide-extensions.yml"
    tags:
      - "ide-vscode-v*"
      - "ide-jetbrains-v*"
  pull_request:
    paths:
      - "packages/vscode-extension/**"
      - "packages/jetbrains-plugin/**"
      - "packages/agent-sdk/**"
      - "packages/agent-protocol/**"
      - "desktop-app-vue/src/renderer/utils/keyboard-shortcuts.ts"
      - "desktop-app-vue/src/renderer/components/common/CommandPalette.vue"
      - "packages/cli/src/lib/capability-manifest.js"
      - "packages/cli/src/lib/public-ide-capability-*.js"
      - "packages/cli/src/lib/browser-evidence.js"
      - "packages/cli/src/lib/chrome-connector.js"
      - "packages/cli/src/lib/artifact-store.js"
      - "packages/cli/src/lib/secret-scan.js"
      - "packages/cli/src/lib/credential-guard.js"
      - "packages/cli/src/lib/with-file-lock.js"
      - "packages/cli/src/runtime/agent-core.js"
      - "packages/cli/src/runtime/coding-agent-contract-shared.cjs"
      - "packages/cli/scripts/ide-roadmap-browser-evidence.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-browser-evidence.mjs"
      - "packages/cli/__tests__/unit/browser-evidence.test.js"
      - "packages/cli/__tests__/unit/ide-roadmap-browser-evidence.test.js"
      - "packages/cli/__tests__/unit/chrome-connector-actions.test.js"
      - "packages/cli/__tests__/unit/browser-act-tool.test.js"
      - "packages/cli/__tests__/unit/browser-state-tool.test.js"
      - "packages/cli/__tests__/unit/chrome-connector.test.js"
      - "packages/cli/__tests__/unit/artifact-store.test.js"
      - "packages/cli/__tests__/unit/coding-agent-contract.test.js"
      - "packages/cli/package.json"
      - "package-lock.json"
      - "packages/cli/src/command-manifest.json"
      - "packages/cli/src/command-help-index.json"
      - "packages/cli/scripts/gen-public-ide-capability-manifest.mjs"
      - "packages/cli/scripts/verify-ide-roadmap-fixtures.mjs"
      - "packages/cli/__tests__/unit/verify-ide-roadmap-fixtures.test.js"
      - "docs/cli/PUBLIC_IDE_CAPABILITY_MANIFEST.generated.json"
      - "package.json"
      - "scripts/ide-journey-evidence.mjs"
      - "packages/vscode-extension/test/remote-ssh-container/**"
      - "packages/vscode-extension/test/remote-ssh-container.test.cjs"
      - "scripts/verify-ide-marketplace.mjs"
      - "tests/fixtures/ide-roadmap/**"
      - ".github/workflows/ide-extensions.yml"
  workflow_dispatch:
    inputs:
      publish_vscode_marketplace:
        description: >-
          Backfill the official VS Code Marketplace (needs VSCE_PAT). This is
          accepted only when the workflow is dispatched against the exact
          existing ide-vscode-v* tag; Open VSX is replayed with
          --skip-duplicate and strictly verified before the official publish.
        type: boolean
        default: false

permissions:
  contents: read

env:
  IDE_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  CC_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capability-manifest:
    name: Public IDE capability manifest (drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Verify IDE roadmap fixture contract
        run: node packages/cli/scripts/verify-ide-roadmap-fixtures.mjs
      - name: Verify commands, actions, Doctor and CLI floor
        run: node packages/cli/scripts/gen-public-ide-capability-manifest.mjs --check

  browser-evidence-producer:
    name: Browser evidence (${{ matrix.slug }})
    needs: capability-manifest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
          - os: windows-latest
            slug: windows
          - os: macos-latest
            slug: macos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Fetch executed browser workflow authority
        shell: bash
        # Keep the exact head's first parent available: browser evidence
        # derives its diff baseline when workflow_dispatch has no event.before.
        run: git fetch --no-tags --depth=2 origin "$GITHUB_WORKFLOW_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Install browser evidence dependencies
        run: >-
          npm ci --workspace packages/cli --include-workspace-root=false
          --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Playwright driver
        run: >-
          npm exec --workspace packages/cli -- playwright --version
      - name: Run browser evidence contract tests
        run: >-
          npm exec --workspace packages/cli -- vitest run
          __tests__/unit/browser-evidence.test.js
          __tests__/unit/ide-roadmap-browser-evidence.test.js
          __tests__/unit/chrome-connector-actions.test.js
          __tests__/unit/chrome-connector.test.js
          __tests__/unit/browser-act-tool.test.js
          __tests__/unit/browser-state-tool.test.js
          __tests__/unit/artifact-store.test.js
          __tests__/unit/coding-agent-contract.test.js
      - name: Install Chromium with target-side dependencies (Linux)
        if: runner.os == 'Linux'
        run: npm exec -- playwright install --with-deps chromium
      - name: Install Chromium (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm exec -- playwright install chromium
      - name: Run real local two-origin browser evidence journey
        shell: bash
        run: >-
          node packages/cli/scripts/ide-roadmap-browser-evidence.mjs
          --artifact-dir build/reports/browser-evidence/${{ matrix.slug }}
          --head-sha ${{ env.IDE_RELEASE_COMMIT }}
          --base-sha ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          --os ${{ matrix.slug }}
          --artifact-name browser-evidence-${{ matrix.slug }}-${{ env.IDE_RELEASE_COMMIT }}-${{ github.run_attempt }}
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --workflow-sha "$GITHUB_WORKFLOW_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --job-id browser-evidence-producer-${{ matrix.slug }}
      - name: Upload exact-head browser evidence fragment
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-${{ matrix.slug }}-${{ env.IDE_RELEASE_COMMIT }}-${{ github.run_attempt }}
          path: build/reports/browser-evidence/${{ matrix.slug }}/
          if-no-files-found: error

  browser-evidence-aggregate:
    name: Browser evidence (three-OS required aggregate)
    needs: browser-evidence-producer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Fetch executed browser workflow authority
        shell: bash
        # Preserve the first-parent history required by exact-head evidence.
        run: git fetch --no-tags --depth=2 origin "$GITHUB_WORKFLOW_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Install browser evidence aggregate dependencies
        run: >-
          npm ci --workspace packages/cli --include-workspace-root=false
          --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Download exact-run browser evidence producers
        uses: actions/download-artifact@v6
        with:
          pattern: browser-evidence-*-${{ env.IDE_RELEASE_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-evidence-producers
      - name: Rehash producer source and artifact evidence
        run: >-
          node packages/cli/scripts/verify-ide-roadmap-browser-evidence.mjs
          --input-dir "${{ runner.temp }}/browser-evidence-producers"
          --head-sha ${{ env.IDE_RELEASE_COMMIT }}
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --workflow-sha "$GITHUB_WORKFLOW_SHA"
          --output build/reports/browser-evidence-aggregate.json
      - name: Upload required browser evidence aggregate
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-aggregate-${{ env.IDE_RELEASE_COMMIT }}-${{ github.run_attempt }}
          path: build/reports/browser-evidence-aggregate.json
          if-no-files-found: error

  vscode-package:
    name: VS Code extension (immutable candidate)
    needs: capability-manifest
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/ide-jetbrains-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_vscode_marketplace)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}

      - name: Reject unsafe VS Code Marketplace backfill
        if: github.event_name == 'workflow_dispatch' && inputs.publish_vscode_marketplace
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/ide-vscode-v?*) ;;
            *)
              echo "::error::Marketplace backfill must be dispatched against the exact existing ide-vscode-v* tag, not '$GITHUB_REF'."
              exit 1
              ;;
          esac
          echo "Validated tagged Marketplace backfill ref: $GITHUB_REF"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Validate VS Code release tag version
        if: startsWith(github.ref, 'refs/tags/ide-vscode-v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="ide-vscode-v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$package_version' (expected '$expected_tag')."
            exit 1
          fi
          echo "Validated release tag: $expected_tag"

      - name: Unit tests
        run: npm run test:unit

      - name: Verify Marketplace Overview coherence
        run: npm run check:marketplace-overview

      - name: Verify vendored Agent SDK freshness
        run: npm run check:agent-sdk

      - name: Marketplace verifier self-test
        run: node ../../scripts/verify-ide-marketplace.mjs --self-test

      - name: Package .vsix candidate
        run: |
          node scripts/sync-elicitation-schema.mjs --check
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out chainlesschain-ide.vsix

      - name: Verify .vsix metadata
        run: |
          node scripts/verify-vsix.selftest.mjs
          node scripts/verify-vsix.mjs chainlesschain-ide.vsix

      - name: Create immutable candidate manifest
        run: >-
          node scripts/vsix-release-artifact.mjs create
          chainlesschain-ide.vsix manifest.json

      - name: Upload immutable .vsix candidate
        uses: actions/upload-artifact@v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: |
            packages/vscode-extension/chainlesschain-ide.vsix
            packages/vscode-extension/manifest.json
          if-no-files-found: error
          overwrite: true

  vscode-windows-smoke:
    name: VS Code extension (Windows host gate)
    needs: vscode-package
    if: ${{ !startsWith(github.ref, 'refs/tags/ide-jetbrains-v') }}
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Download immutable .vsix candidate
        uses: actions/download-artifact@v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: packages/vscode-extension

      - name: Verify immutable candidate manifest
        run: >-
          node scripts/vsix-release-artifact.mjs verify
          chainlesschain-ide.vsix manifest.json

      # Windows is a release gate because the bridge lockfile uses a native
      # owner-only DACL. Exercise an ordered two-root workspace in both the
      # latest editor and engines.vscode's minimum supported release from the
      # immutable candidate.

      - name: Install Extension Host test runtime
        run: >-
          npm install --no-save --no-package-lock
          @vscode/test-electron@3.1.0 ws@8.21.2

      - name: Extension Host multi-root + multi-window journey (Windows stable)
        timeout-minutes: 25
        run: >-
          node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir build/reports/extension-host/windows-stable

      - name: Extension Host multi-root + multi-window journey (Windows minimum 1.85.2)
        timeout-minutes: 25
        run: >-
          node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix
          --vscode-version 1.85.2
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir build/reports/extension-host/windows-minimum

      - name: Upload Windows host journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vscode-windows-host-evidence-${{ github.run_attempt }}
          path: packages/vscode-extension/build/reports/extension-host/
          if-no-files-found: error

  vscode-macos-smoke:
    name: VS Code extension (macOS host gate)
    needs: vscode-package
    if: ${{ !startsWith(github.ref, 'refs/tags/ide-jetbrains-v') }}
    # Keep the complete real-DOM Extension Host gate on the stable macOS 15
    # Intel image. A launch-token-gated fixed driver command foregrounds the
    # signed host and crosses VS Code's own Webview message boundary; this path
    # opens no debugger or remote-debugging transport.
    runs-on: macos-15-intel
    timeout-minutes: 70
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Download immutable .vsix candidate
        uses: actions/download-artifact@v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: packages/vscode-extension
      - name: Verify immutable candidate manifest
        run: >-
          node scripts/vsix-release-artifact.mjs verify
          chainlesschain-ide.vsix manifest.json
      - name: Install Extension Host test runtime
        run: >-
          npm install --no-save --no-package-lock
          @vscode/test-electron@3.1.0
      - name: Extension Host multi-root + multi-window journey (macOS stable)
        timeout-minutes: 25
        run: >-
          node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir build/reports/extension-host/macos-stable
      - name: Extension Host multi-root + multi-window journey (macOS minimum 1.85.2)
        if: always()
        timeout-minutes: 25
        run: >-
          node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix
          --vscode-version 1.85.2
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir build/reports/extension-host/macos-minimum
      - name: Upload macOS host journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vscode-macos-host-evidence-${{ github.run_attempt }}
          path: packages/vscode-extension/build/reports/extension-host/
          if-no-files-found: error

  vscode-remote-ssh-container:
    name: VS Code Remote-SSH container (scoped trusted cell)
    needs: vscode-package
    if: ${{ !startsWith(github.ref, 'refs/tags/ide-jetbrains-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/vscode-extension
    env:
      CC_REMOTE_EVIDENCE_ARTIFACT: vscode-remote-ssh-container-evidence-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
      - name: Download immutable .vsix candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: ${{ runner.temp }}/cc-vscode-candidate
      - name: Verify immutable candidate manifest
        run: >-
          node scripts/vsix-release-artifact.mjs verify
          "$RUNNER_TEMP/cc-vscode-candidate/chainlesschain-ide.vsix"
          "$RUNNER_TEMP/cc-vscode-candidate/manifest.json"
      - name: Verify Remote-SSH driver contract
        run: node --test test/remote-ssh-container.test.cjs
      - name: Install exact host-test runtime and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install --no-save --no-package-lock @vscode/test-electron@3.1.0
      - name: Download and verify official Remote-SSH transport and install bytes
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-vscode-remote/vsextensions/remote-ssh/0.120.0/vspackage'
          curl --fail --location --silent --show-error \
            "$source_url" --output "$RUNNER_TEMP/remote-ssh-0.120.0.vsix.gz"
          echo "4caa944dc6c81c8e1a345f3aefed2c0b8efacfe91ba46dff04cb6da2238b949e  $RUNNER_TEMP/remote-ssh-0.120.0.vsix.gz" | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/remote-ssh-0.120.0.vsix.gz" > "$RUNNER_TEMP/remote-ssh-0.120.0.vsix"
          echo "0fd6262ca183b486f6c067cb3516dccea2f87f32c049b642ff9eb77b0cea195d  $RUNNER_TEMP/remote-ssh-0.120.0.vsix" | sha256sum --check --strict
      - name: Run installed VSIX in a genuine Remote-SSH container extension host
        timeout-minutes: 30
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node test/remote-ssh-container/run.cjs \
              --vsix "$RUNNER_TEMP/cc-vscode-candidate/chainlesschain-ide.vsix" \
              --candidate-manifest "$RUNNER_TEMP/cc-vscode-candidate/manifest.json" \
              --remote-ssh-payload "$RUNNER_TEMP/remote-ssh-0.120.0.vsix.gz" \
              --remote-ssh-vsix "$RUNNER_TEMP/remote-ssh-0.120.0.vsix" \
              --artifact-dir build/reports/remote-ssh-container/journey \
              --release-commit "$IDE_RELEASE_COMMIT" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --workflow-sha "$GITHUB_WORKFLOW_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job "$GITHUB_JOB" \
              --artifact-name "$CC_REMOTE_EVIDENCE_ARTIFACT" \
              --event-name "$GITHUB_EVENT_NAME" \
              --server-url "$GITHUB_SERVER_URL"
      - name: Bridge rehashed journey bytes into the scoped roadmap envelope
        run: |
          node ../../packages/cli/scripts/verify-ide-roadmap-fixtures.mjs \
            --bridge-journey-evidence build/reports/remote-ssh-container/journey/journey-evidence.json \
            --bridge-case q4a-vscode-remote-ssh-container \
            --output build/reports/remote-ssh-container/roadmap-runtime-evidence.json \
            --release-commit "$IDE_RELEASE_COMMIT" \
            --trusted-repository "$GITHUB_REPOSITORY" \
            --trusted-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --trusted-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --trusted-run-id "$GITHUB_RUN_ID" \
            --trusted-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-job "$GITHUB_JOB" \
            --trusted-artifact-name "$CC_REMOTE_EVIDENCE_ARTIFACT" \
            --trusted-event-name "$GITHUB_EVENT_NAME"
      - name: Upload Remote-SSH diagnostics and trusted evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.CC_REMOTE_EVIDENCE_ARTIFACT }}
          path: packages/vscode-extension/build/reports/remote-ssh-container/
          if-no-files-found: error

  ide-roadmap-evidence-aggregate:
    name: IDE roadmap evidence (trusted scoped aggregate)
    needs: vscode-remote-ssh-container
    if: >-
      ${{
        always() &&
        needs.vscode-remote-ssh-container.result == 'success' &&
        !startsWith(github.ref, 'refs/tags/ide-jetbrains-v')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC_REMOTE_EVIDENCE_ARTIFACT: vscode-remote-ssh-container-evidence-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.12.0"
      - name: Download exact producer artifact from this workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.CC_REMOTE_EVIDENCE_ARTIFACT }}
          path: ${{ runner.temp }}/cc-remote-ssh-evidence
      - name: Rehash artifact bytes and assert release readiness
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/ide-vscode-v'))
        run: |
          node packages/cli/scripts/verify-ide-roadmap-fixtures.mjs \
            --verify-runtime-evidence-dir "$RUNNER_TEMP/cc-remote-ssh-evidence" \
            --release-commit "$IDE_RELEASE_COMMIT" \
            --case q4a-vscode-remote-ssh-container \
            --require-release-ready \
            --output "$RUNNER_TEMP/cc-remote-ssh-aggregate.json" \
            --trusted-repository "$GITHUB_REPOSITORY" \
            --trusted-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --trusted-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --trusted-run-id "$GITHUB_RUN_ID" \
            --trusted-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-job vscode-remote-ssh-container \
            --trusted-artifact-name "$CC_REMOTE_EVIDENCE_ARTIFACT" \
            --trusted-event-name "$GITHUB_EVENT_NAME"
      - name: Rehash artifact bytes as advisory evidence
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' &&
          !startsWith(github.ref, 'refs/tags/ide-vscode-v'))
        run: |
          node packages/cli/scripts/verify-ide-roadmap-fixtures.mjs \
            --verify-runtime-evidence-dir "$RUNNER_TEMP/cc-remote-ssh-evidence" \
            --release-commit "$IDE_RELEASE_COMMIT" \
            --case q4a-vscode-remote-ssh-container \
            --output "$RUNNER_TEMP/cc-remote-ssh-aggregate.json" \
            --trusted-repository "$GITHUB_REPOSITORY" \
            --trusted-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --trusted-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --trusted-run-id "$GITHUB_RUN_ID" \
            --trusted-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-job vscode-remote-ssh-container \
            --trusted-artifact-name "$CC_REMOTE_EVIDENCE_ARTIFACT" \
            --trusted-event-name "$GITHUB_EVENT_NAME"
      - name: Upload trusted scoped aggregate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vscode-remote-ssh-container-aggregate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cc-remote-ssh-aggregate.json
          if-no-files-found: error

  vscode:
    name: VS Code extension (Linux host gate + publish)
    needs:
      [
        vscode-package,
        vscode-windows-smoke,
        vscode-macos-smoke,
        vscode-remote-ssh-container,
        ide-roadmap-evidence-aggregate,
        browser-evidence-aggregate,
      ]
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/ide-jetbrains-v') &&
        needs.vscode-package.result == 'success' &&
        needs.vscode-windows-smoke.result == 'success' &&
        needs.vscode-macos-smoke.result == 'success' &&
        needs.vscode-remote-ssh-container.result == 'success' &&
        needs.ide-roadmap-evidence-aggregate.result == 'success' &&
        needs.browser-evidence-aggregate.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Download immutable .vsix candidate
        uses: actions/download-artifact@v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: packages/vscode-extension

      - name: Verify immutable candidate manifest before Linux host gates
        run: >-
          node scripts/vsix-release-artifact.mjs verify
          chainlesschain-ide.vsix manifest.json

      # Real VS Code Extension Host gate: install the packaged artifact into a
      # fresh profile and verify activation, declared commands, and the local
      # IDE Bridge. This catches packaging/activation regressions that ZIP
      # metadata validation cannot detect.
      - name: Extension Host multi-root + multi-window journey (Linux stable)
        timeout-minutes: 25
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install --no-save --no-package-lock @vscode/test-electron@3.1.0 ws@8.21.2
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix \
              --release-commit ${{ env.IDE_RELEASE_COMMIT }} \
              --artifact-dir build/reports/extension-host/linux-stable

      - name: Extension Host multi-root + multi-window journey (Linux minimum 1.85.2)
        timeout-minutes: 25
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node test/extension-host/run.cjs --vsix chainlesschain-ide.vsix \
              --vscode-version 1.85.2 \
              --release-commit ${{ env.IDE_RELEASE_COMMIT }} \
              --artifact-dir build/reports/extension-host/linux-minimum

      - name: Upload Linux host journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vscode-linux-host-evidence-${{ github.run_attempt }}
          path: packages/vscode-extension/build/reports/extension-host/
          if-no-files-found: error

      - name: Verify immutable candidate manifest before publishing
        run: >-
          node scripts/vsix-release-artifact.mjs verify
          chainlesschain-ide.vsix manifest.json

      # A release tag publishes the primary Open VSX channel independently.
      # Fail before upload when its token is missing; Microsoft credentials are
      # checked separately only for an explicit exact-tag backfill.
      - name: Preflight Open VSX credential
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace))
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set; cannot publish to Open VSX."
            exit 1
          fi

      - name: Preflight VS Code Marketplace credential
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set; cannot backfill the official Marketplace."
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.2 verify-pat chainlesschain -p "$VSCE_PAT"

      # Open VSX is the primary channel (Cursor / VSCodium / Gitpod / ...). The
      # namespace + token are 'chainlesschain' / OVSX_PAT (see
      # docs/internal/ide-extensions-releasing.md).
      - name: Publish to Open VSX
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace))
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set — cannot publish to Open VSX."
            exit 1
          fi
          # --skip-duplicate makes an exact-version tag workflow safe to rerun.
          # Other authentication, network, and validation failures still fail.
          npx --yes ovsx@1.0.2 publish --skip-duplicate chainlesschain-ide.vsix

      - name: Verify Open VSX listing
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace))
        env:
          # Open VSX activates a scanned upload asynchronously and caches the
          # latest-extension projection for up to one hour. First wait up to
          # 45 minutes for exact activation without reading that cache, then
          # start an independent 75-minute latest/listing convergence window.
          CC_MARKETPLACE_VERIFY_ATTEMPTS: "90"
          CC_MARKETPLACE_VERIFY_DELAY_MS: "30000"
          CC_OPEN_VSX_LISTING_VERIFY_ATTEMPTS: "75"
          CC_OPEN_VSX_LISTING_VERIFY_DELAY_MS: "60000"
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          result="$(node ../../scripts/verify-ide-marketplace.mjs open-vsx "$version" --artifact chainlesschain-ide.vsix)"
          echo "$result"
          {
            echo "### Open VSX verification"
            echo
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Official VS Code Marketplace is an explicit exact-tag backfill, not
      # part of the primary Open VSX tag release. It needs a VSCE_PAT secret (an
      # Azure DevOps PAT, org "All accessible organizations", scope
      # Marketplace→Manage; the org itself is free) and the `chainlesschain`
      # publisher on marketplace.visualstudio.com/manage.
      - name: Publish to VS Code Marketplace
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set — cannot publish to the official Marketplace."
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.2 verify-pat chainlesschain -p "$VSCE_PAT"
          npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate --no-dependencies --packagePath chainlesschain-ide.vsix -p "$VSCE_PAT"

      - name: Verify VS Code Marketplace listing and exact VSIX
        if: >-
          startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_vscode_marketplace
        env:
          CC_MARKETPLACE_VERIFY_ATTEMPTS: "30"
          CC_MARKETPLACE_VERIFY_DELAY_MS: "20000"
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          result="$(node ../../scripts/verify-ide-marketplace.mjs vscode-marketplace "$version" --artifact chainlesschain-ide.vsix)"
          echo "$result"
          {
            echo "### Microsoft VS Code Marketplace verification"
            echo
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  jetbrains-host-matrix:
    name: JetBrains real host (${{ matrix.os }}, ${{ matrix.ide.version }})
    needs: capability-manifest
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
        !(github.event_name == 'workflow_dispatch' && inputs.publish_vscode_marketplace)
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        ide:
          - version: "2024.2"
            java: "21"
          - version: "2025.2"
            java: "21"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.ide.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Verify Remote Robot startup retry contract
        run: node --test packages/jetbrains-plugin/scripts/run-ui-host-journey.test.mjs
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        working-directory: packages/jetbrains-plugin
        run: chmod +x ./gradlew
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run deterministic chat/control/resume journey (Linux)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          node packages/jetbrains-plugin/scripts/run-ui-host-journey.mjs
          --ide-version ${{ matrix.ide.version }}
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir packages/jetbrains-plugin/build/reports/ide-journey/${{ runner.os }}-${{ matrix.ide.version }}
      - name: Run deterministic chat/control/resume journey (Windows/macOS)
        if: runner.os != 'Linux'
        run: >-
          node packages/jetbrains-plugin/scripts/run-ui-host-journey.mjs
          --ide-version ${{ matrix.ide.version }}
          --release-commit ${{ env.IDE_RELEASE_COMMIT }}
          --artifact-dir packages/jetbrains-plugin/build/reports/ide-journey/${{ runner.os }}-${{ matrix.ide.version }}
      - name: Upload host journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jetbrains-${{ runner.os }}-${{ matrix.ide.version }}-host-evidence-${{ github.run_attempt }}
          path: |
            packages/jetbrains-plugin/build/reports/ide-journey/
            packages/jetbrains-plugin/build/reports/ui-host-driver/
            packages/jetbrains-plugin/build/reports/ui-smoke/
            packages/jetbrains-plugin/build/reports/tests/uiSmokeTest/
          if-no-files-found: error

  jetbrains:
    name: JetBrains plugin (build + publish)
    needs:
      [capability-manifest, jetbrains-host-matrix, browser-evidence-aggregate]
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/ide-vscode-v') &&
        !(github.event_name == 'workflow_dispatch' && inputs.publish_vscode_marketplace)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/jetbrains-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate JetBrains version sources and release tag
        shell: bash
        run: |
          set -euo pipefail
          gradle_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' build.gradle.kts)"
          plugin_xml_version="$(sed -nE 's@^[[:space:]]*<version>([^<]+)</version>[[:space:]]*$@\1@p' src/main/resources/META-INF/plugin.xml)"
          if [[ -z "$gradle_version" || "$gradle_version" == *$'\n'* ]]; then
            echo "::error::Expected exactly one project version in build.gradle.kts."
            exit 1
          fi
          if [[ -z "$plugin_xml_version" || "$plugin_xml_version" == *$'\n'* ]]; then
            echo "::error::Expected exactly one <version> in plugin.xml."
            exit 1
          fi
          if [ "$gradle_version" != "$plugin_xml_version" ]; then
            echo "::error::JetBrains version mismatch: Gradle=$gradle_version plugin.xml=$plugin_xml_version."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/ide-jetbrains-v* ]]; then
            expected_tag="ide-jetbrains-v${gradle_version}"
            if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' does not match JetBrains version '$gradle_version' (expected '$expected_tag')."
              exit 1
            fi
            echo "Validated release tag: $expected_tag"
          else
            echo "Validated matching JetBrains version sources: $gradle_version"
          fi

      - name: Verify JetBrains release metadata coherence
        run: node scripts/verify-release-metadata.mjs

      # Pure-core regression gate: 300+ assertions over the vscode-parity pure
      # layers (PureLogicSmokeMain exits 1 on any failure). Runs before the
      # full build so a logic regression fails fast.
      - name: Pure-logic smoke (smokeTest)
        run: ./gradlew smokeTest --no-daemon --stacktrace

      # Real JUnit 5 over the pure com.chainlesschain.ide.* layer (per-test
      # isolation + JUnit XML). No IntelliJ platform test framework, so it runs
      # headless in seconds. Complements the aggregate smokeTest gate above.
      - name: Unit tests (JUnit)
        run: ./gradlew test --no-daemon --stacktrace

      # Downloads the IntelliJ Platform SDK + builds the signed-able plugin zip.
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --stacktrace

      - name: Verify plugin structure and project configuration
        run: >-
          ./gradlew verifyPluginStructure verifyPluginProjectConfiguration
          --no-daemon --stacktrace

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: chainlesschain-ide-jetbrains-${{ github.run_attempt }}
          path: packages/jetbrains-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Publish to JetBrains Marketplace
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/ide-jetbrains-v')
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$JETBRAINS_PUBLISH_TOKEN" ]; then
            echo "::error::JETBRAINS_PUBLISH_TOKEN secret is not set — cannot publish."
            exit 1
          fi
          signing_secret_count=0
          for secret_name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::notice::$secret_name is not configured."
            else
              signing_secret_count=$((signing_secret_count + 1))
            fi
          done
          if [ "$signing_secret_count" -ne 0 ] && [ "$signing_secret_count" -ne 3 ]; then
            echo "::error::JetBrains author signing is only safe with all three signing secrets configured."
            exit 1
          fi
          if [ "$signing_secret_count" -eq 0 ]; then
            echo "::warning::Author signing secrets are not configured; signPlugin will be skipped, matching the existing Marketplace release path."
          else
            echo "All JetBrains author signing secrets are configured."
          fi
          ./gradlew publishPlugin --no-daemon --stacktrace

  jetbrains-marketplace-verify:
    name: JetBrains Marketplace (post-publish verification)
    needs: jetbrains
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/ide-jetbrains-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/jetbrains-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IDE_RELEASE_COMMIT }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Verify JetBrains Marketplace listing
        env:
          # A successful publishPlugin upload may wait for human Marketplace
          # approval. Reachable pending state is reported, not treated as an
          # upload failure; HTTP/network/malformed and explicitly hidden states
          # still fail.
          CC_MARKETPLACE_VERIFY_ATTEMPTS: "12"
          CC_MARKETPLACE_VERIFY_DELAY_MS: "10000"
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' build.gradle.kts)"
          result="$(node ../../scripts/verify-ide-marketplace.mjs jetbrains "$version" --allow-pending)"
          echo "$result"
          if [[ "$result" == *'"status":"pending"'* ]]; then
            echo "::warning::JetBrains Marketplace upload succeeded; version $version is pending manual approval/listing."
          fi
          {
            echo "### JetBrains Marketplace verification"
            echo
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
