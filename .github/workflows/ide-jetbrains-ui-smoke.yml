# JetBrains plugin GUI smoke gate (gap #8) — NIGHTLY, NON-BLOCKING.
#
# Launches a sandbox IDE (IntelliJ 2024.2, downloaded by the Gradle plugin)
# under xvfb through the same deterministic fixture-backed host driver used by
# the required release matrix. Failure screenshots, protocol logs, and bounded
# immutable journey evidence are uploaded as artifacts.
#
# Deliberately DECOUPLED from ide-extensions.yml and every release path:
# schedule + manual dispatch only, never a required check. Per the
# cosmetic-green CI trap (#30): NO continue-on-error, NO always-exit-0
# wrappers — if the smoke test fails, the nightly run is red.

name: IDE JetBrains UI Smoke

on:
  schedule:
    # Nightly, 19:30 UTC (03:30 CST) — off the busy CI hours.
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    name: JetBrains plugin GUI smoke (Remote Robot)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/jetbrains-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run deterministic chat/control/resume journey
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          node scripts/run-ui-host-journey.mjs
          --ide-version 2024.2
          --artifact-dir build/reports/ide-journey/Linux-2024.2

      - name: Upload failure artifacts (screenshots, reports, IDE log)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jetbrains-ui-smoke-failure
          path: |
            packages/jetbrains-plugin/build/reports/ide-journey/
            packages/jetbrains-plugin/build/reports/ui-host-driver/
            packages/jetbrains-plugin/build/reports/ui-smoke/
            packages/jetbrains-plugin/build/reports/tests/uiSmokeTest/
          if-no-files-found: ignore
